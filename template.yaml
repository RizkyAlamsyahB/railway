AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Haji Umroh Store Backend API - Lambda Deployment

Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    Runtime: provided.al2023
    Architectures:
      - x86_64

Parameters:
  AppEnv:
    Type: String
    Default: production
    AllowedValues:
      - development
      - staging
      - production
  DBHost:
    Type: String
    Description: CockroachDB host address
  DBPort:
    Type: Number
    Default: 26257
  DBUser:
    Type: String
    Default: root
  DBPassword:
    Type: String
    NoEcho: true
    Default: ''
  DBName:
    Type: String
    Default: haji_umroh_store
  DBSSLMode:
    Type: String
    Default: require
    AllowedValues:
      - disable
      - require
      - verify-full
  DBMaxIdleConns:
    Type: Number
    Default: 2
  DBMaxOpenConns:
    Type: Number
    Default: 5

Resources:
  ApiFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      Handler: bootstrap
      CodeUri: .
      Description: Haji Umroh Store API Handler
      Environment:
        Variables:
          APP_NAME: haji-umroh-store-be
          APP_PORT: '8080'
          APP_ENV: !Ref AppEnv
          DB_HOST: !Ref DBHost
          DB_PORT: !Ref DBPort
          DB_USER: !Ref DBUser
          DB_PASSWORD: !Ref DBPassword
          DB_NAME: !Ref DBName
          DB_SSLMODE: !Ref DBSSLMode
          DB_MAX_IDLE_CONNS: !Ref DBMaxIdleConns
          DB_MAX_OPEN_CONNS: !Ref DBMaxOpenConns
      Events:
        CatchAll:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY
            ApiId: !Ref HttpApi
        Root:
          Type: HttpApi
          Properties:
            Path: /
            Method: ANY
            ApiId: !Ref HttpApi
      # Uncomment and configure if CockroachDB is in a VPC:
      # VpcConfig:
      #   SecurityGroupIds:
      #     - !Ref LambdaSecurityGroup
      #   SubnetIds:
      #     - !Ref PrivateSubnet1
      #     - !Ref PrivateSubnet2

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
          - X-Request-ID
        ExposeHeaders:
          - X-Request-ID
        MaxAge: 86400

Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com'
  FunctionArn:
    Description: Lambda Function ARN
    Value: !GetAtt ApiFunction.Arn
