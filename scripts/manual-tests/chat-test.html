<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat CS — Manual Test UI</title>
  <style>
    :root {
      --bg: #f5f0e8;
      --panel: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --line: #e2e8f0;
      --gold: #c8a951;
      --gold-light: #f5ecd5;
      --gold-dark: #a38930;
      --primary: #c8a951;
      --danger: #dc2626;
      --success: #16a34a;
      --bubble-me: #f5ecd5;
      --bubble-other: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ─────────────────────────────── */
    header {
      background: linear-gradient(135deg, #d4b95e 0%, #c8a951 50%, #a38930 100%);
      color: #fff;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0,0,0,.12);
    }
    header h1 { font-size: 18px; font-weight: 700; letter-spacing: -.3px; }
    #ws-badge {
      margin-left: auto;
      font-size: 11px;
      padding: 4px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,.2);
      color: #fff;
      font-weight: 600;
      backdrop-filter: blur(4px);
    }
    #ws-badge.connected { background: rgba(22,163,74,.85); }
    #ws-badge.disconnected { background: rgba(220,38,38,.75); }

    /* ── Layout ─────────────────────────────── */
    .layout {
      display: grid;
      grid-template-columns: 340px 1fr 300px;
      flex: 1;
      overflow: hidden;
    }

    /* ── Left Sidebar ───────────────────────── */
    .sidebar {
      background: var(--panel);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Login form */
    .login-section {
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      background: #fefcf7;
    }
    .login-section summary {
      font-size: 12px; font-weight: 700; color: var(--gold-dark);
      cursor: pointer; user-select: none;
    }
    .login-section summary:hover { color: var(--text); }
    .login-form { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
    .login-form label { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
    .login-form input, .login-form select {
      width: 100%; padding: 8px 10px; font-size: 13px;
      border: 1px solid var(--line); border-radius: 8px; outline: none;
      transition: border-color .2s;
    }
    .login-form input:focus, .login-form select:focus { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(200,169,81,.15); }

    .btn {
      padding: 8px 14px; font-size: 13px; font-weight: 600;
      border: none; border-radius: 8px; cursor: pointer; transition: all .15s;
    }
    .btn:hover { opacity: .88; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn-gold { background: linear-gradient(135deg, #d4b95e, #c8a951); color: #fff; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-outline { background: transparent; border: 1px solid var(--line); color: var(--text); }
    .btn-outline:hover { background: #f8f8f8; }
    .btn-sm { padding: 5px 10px; font-size: 12px; }

    #user-info {
      padding: 10px 16px; font-size: 12px; background: #f0fdf4;
      border-bottom: 1px solid var(--line); display: none;
      line-height: 1.5;
    }
    #user-info b { color: var(--success); }
    #user-info code { font-size: 10px; background: #e5e7eb; padding: 1px 5px; border-radius: 3px; cursor: pointer; }

    /* Conversation header & filters */
    .conv-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }
    .conv-header-title {
      font-size: 16px; font-weight: 700; color: var(--text);
    }
    .search-bar {
      display: flex; gap: 6px; align-items: center;
    }
    .search-bar input {
      flex: 1; padding: 8px 12px; font-size: 13px;
      border: 1px solid var(--line); border-radius: 8px; outline: none;
    }
    .search-bar input:focus { border-color: var(--gold); }
    .search-bar .search-icon {
      width: 36px; height: 36px; border-radius: 8px; background: var(--gold-light);
      border: 1px solid #e8ddb8; display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 16px; flex-shrink: 0;
    }
    .search-bar .search-icon:hover { background: #ede0ba; }

    .filter-row {
      display: flex; gap: 6px; flex-wrap: wrap; align-items: center;
    }
    .filter-row select {
      padding: 6px 10px; font-size: 12px; border: 1px solid var(--line);
      border-radius: 8px; outline: none; background: #fff; cursor: pointer;
    }
    .filter-row select:focus { border-color: var(--gold); }

    /* Conversations list */
    #conv-list { flex: 1; overflow-y: auto; }
    .conv-item {
      padding: 12px 16px; cursor: pointer; border-bottom: 1px solid #f1f5f9;
      transition: background .15s; display: flex; gap: 10px; align-items: flex-start;
    }
    .conv-item:hover { background: #fefcf7; }
    .conv-item.active { background: var(--gold-light); border-left: 3px solid var(--gold); }
    .conv-avatar {
      width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
      background: linear-gradient(135deg, #d4b95e, #e8d78a); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 16px; text-transform: uppercase;
    }
    .conv-info { flex: 1; min-width: 0; overflow: hidden; }
    .conv-name { font-size: 13px; font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .conv-role-tag {
      font-size: 9px; padding: 1px 7px; border-radius: 99px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .03em;
    }
    .conv-role-tag.role-cs { background: #dbeafe; color: #1d4ed8; }
    .conv-role-tag.role-admin { background: #fef9c3; color: #854d0e; }
    .conv-role-tag.role-customer { background: #f0fdf4; color: #166534; }
    .conv-role-tag.role-umkm { background: #fdf4ff; color: #7e22ce; }
    .conv-role-tag.role-finance { background: #fff7ed; color: #9a3412; }
    .conv-badge {
      min-width: 20px; height: 20px; padding: 0 6px; border-radius: 99px;
      background: #ef4444; color: #fff; font-size: 10px; font-weight: 700;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
      line-height: 1;
    }
    .conv-preview { font-size: 12px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .conv-time { font-size: 10px; color: var(--muted); flex-shrink: 0; padding-top: 2px; }

    /* Start conversation */
    .start-conv {
      padding: 12px 16px; border-top: 1px solid var(--line); flex-shrink: 0;
      display: flex; flex-direction: column; gap: 6px;
    }
    .start-conv label {
      font-size: 11px; font-weight: 700; color: var(--gold-dark);
      text-transform: uppercase; letter-spacing: .04em;
    }
    .start-conv input {
      width: 100%; padding: 8px 12px; font-size: 13px;
      border: 1px solid var(--line); border-radius: 8px; outline: none;
    }
    .start-conv input:focus { border-color: var(--gold); }

    .role-chips { display: flex; flex-wrap: wrap; gap: 4px; }
    .role-chip {
      display: flex; align-items: center; gap: 4px; font-size: 11px; cursor: pointer;
      background: #f8f9fa; padding: 4px 10px; border-radius: 99px;
      border: 1px solid var(--line); user-select: none; transition: all .15s;
    }
    .role-chip input[type=checkbox] { accent-color: var(--gold); width: 13px; height: 13px; }
    .role-chip.checked { background: var(--gold-light); border-color: var(--gold); color: var(--gold-dark); font-weight: 700; }

    #user-results {
      max-height: 200px; overflow-y: auto; border: 1px solid var(--line);
      border-radius: 8px; display: none; background: var(--panel);
      box-shadow: 0 4px 12px rgba(0,0,0,.08);
    }
    .user-result-item {
      padding: 8px 12px; cursor: pointer; border-bottom: 1px solid #f1f5f9; transition: background .12s;
    }
    .user-result-item:hover { background: var(--gold-light); }
    .user-result-item:last-child { border-bottom: none; }

    /* ── Chat Area ──────────────────────────── */
    .chat-area {
      display: flex; flex-direction: column; overflow: hidden; background: var(--bg);
    }
    .chat-header {
      padding: 14px 20px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      display: flex; align-items: center; gap: 10px;
      flex-shrink: 0;
      box-shadow: 0 1px 3px rgba(0,0,0,.04);
    }
    .chat-header-avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: linear-gradient(135deg, #d4b95e, #e8d78a); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 14px; text-transform: uppercase;
    }
    .chat-header-info { flex: 1; }
    .chat-header-name { font-weight: 700; font-size: 14px; }
    .chat-header-role { font-size: 11px; color: var(--muted); }

    /* Date separator */
    .date-separator {
      text-align: center; font-size: 11px; color: var(--muted);
      padding: 8px 0;
    }
    .date-separator span {
      background: #eee8d5; padding: 3px 14px; border-radius: 99px;
    }

    #messages {
      flex: 1; overflow-y: auto; padding: 20px;
      display: flex; flex-direction: column; gap: 6px;
    }
    .msg-row { display: flex; align-items: flex-end; gap: 8px; max-width: 75%; }
    .msg-row.me { margin-left: auto; flex-direction: row-reverse; }
    .msg-row.other { margin-right: auto; }
    .bubble {
      padding: 10px 14px; border-radius: 16px;
      font-size: 13px; line-height: 1.5; word-break: break-word;
      box-shadow: 0 1px 2px rgba(0,0,0,.06);
    }
    .msg-row.me .bubble {
      background: var(--bubble-me); color: var(--text);
      border-bottom-right-radius: 4px;
    }
    .msg-row.other .bubble {
      background: var(--bubble-other); color: var(--text);
      border: 1px solid #f0ebe0;
      border-bottom-left-radius: 4px;
    }
    .msg-time { font-size: 10px; color: var(--muted); flex-shrink: 0; }
    .msg-sender { font-size: 10px; color: var(--gold-dark); margin-bottom: 2px; font-weight: 600; }

    .chat-input-bar {
      padding: 14px 20px;
      border-top: 1px solid var(--line);
      background: var(--panel);
      display: flex; gap: 10px; align-items: flex-end;
      flex-shrink: 0;
    }
    #msg-input {
      flex: 1; padding: 10px 14px; font-size: 14px;
      border: 1px solid var(--line); border-radius: 12px; outline: none;
      resize: none; max-height: 120px; font-family: inherit;
      transition: border-color .2s;
    }
    #msg-input:focus { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(200,169,81,.12); }
    #msg-input:disabled { background: #f8f8f8; }
    .send-btn {
      width: 40px; height: 40px; border-radius: 50%; border: none;
      background: linear-gradient(135deg, #d4b95e, #c8a951);
      color: #fff; font-size: 18px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all .15s;
    }
    .send-btn:hover { transform: scale(1.05); box-shadow: 0 2px 8px rgba(200,169,81,.3); }
    .send-btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }

    .empty-state {
      flex: 1; display: flex; align-items: center; justify-content: center;
      color: var(--muted); font-size: 14px; flex-direction: column; gap: 8px;
    }
    .empty-state .ico { font-size: 48px; }

    /* ── Right Sidebar — WS Log ─────────────── */
    .log-sidebar {
      border-left: 1px solid var(--line);
      background: #1e293b;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .log-title {
      padding: 12px 14px; font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .06em;
      color: #94a3b8; border-bottom: 1px solid #334155; flex-shrink: 0;
    }
    #ws-log {
      flex: 1; overflow-y: auto; padding: 10px; font-family: "Fira Code", "Cascadia Code", monospace;
      font-size: 11px; color: #94a3b8; display: flex; flex-direction: column; gap: 3px;
    }
    .log-entry { line-height: 1.4; word-break: break-all; }
    .log-entry.push  { color: #34d399; }
    .log-entry.send  { color: #60a5fa; }
    .log-entry.error { color: #f87171; }
    .log-entry.info  { color: #fbbf24; }
    .log-actions {
      padding: 8px 10px; border-top: 1px solid #334155;
      display: flex; gap: 6px;
    }
    .log-btn {
      padding: 5px 10px; font-size: 11px; font-weight: 600;
      border: 1px solid #334155; border-radius: 6px; cursor: pointer;
      background: transparent; color: #94a3b8; transition: all .15s;
    }
    .log-btn:hover { background: #334155; color: #e2e8f0; }
    .log-btn.ws-disconnect { color: #f87171; border-color: #7f1d1d; }
    .log-btn.ws-disconnect:hover { background: #7f1d1d; color: #fff; }

    /* ── Toast ──────────────────────────────── */
    .toast {
      position: fixed; bottom: 20px; right: 20px;
      padding: 10px 18px; border-radius: 10px; font-size: 13px; font-weight: 600;
      color: #fff; z-index: 999; animation: slideUp .25s ease-out;
      box-shadow: 0 4px 12px rgba(0,0,0,.15);
    }
    .toast.success { background: var(--success); }
    .toast.error   { background: var(--danger); }
    @keyframes slideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

    /* ── Scrollbar ──────────────────────────── */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 99px; }
    .log-sidebar ::-webkit-scrollbar-thumb { background: #475569; }
  </style>
</head>
<body>

<header>
  <div style="font-size:22px">💬</div>
  <h1>Chat — Manual Test UI</h1>
  <span id="ws-badge" class="disconnected">WS: Disconnected</span>
</header>

<div class="layout">

  <!-- ═══════ Left: Login + Conversations ═══════ -->
  <div class="sidebar">

    <!-- Login (collapsible) -->
    <div class="login-section">
      <details open>
        <summary>🔐 Session Login</summary>
        <div class="login-form">
          <label>Email</label>
          <input id="login-email" type="email" value="cs@dev.local" />
          <label>Password</label>
          <input id="login-pass" type="password" value="Password123!" />
          <label>Login Endpoint</label>
          <select id="login-endpoint">
            <option value="/cs/login">CS (cs/login)</option>
            <option value="/users/login">Customer (users/login)</option>
            <option value="/users/login">Finance (users/login)</option>
            <option value="/vendors/login">UMKM (vendors/login)</option>
            <option value="/admin/login">Admin (admin/login)</option>
          </select>
          <div style="display:flex;gap:6px;margin-top:4px">
            <button class="btn btn-gold" style="flex:1" onclick="doLogin()">Login</button>
            <button class="btn btn-outline btn-sm" onclick="doLogout()">Logout</button>
          </div>
        </div>
      </details>
    </div>

    <div id="user-info"></div>

    <!-- Conversations header with search & filter -->
    <div class="conv-header">
      <div class="conv-header-title">Conversations</div>
      <div class="search-bar">
        <input id="conv-search" placeholder="Cari…" oninput="debouncedConvSearch()" />
        <div class="search-icon" onclick="loadConversations()">🔍</div>
      </div>
      <div class="filter-row">
        <select id="conv-role-filter" onchange="loadConversations()">
          <option value="">Semua</option>
        </select>
      </div>
    </div>

    <!-- Conversations list -->
    <div id="conv-list">
      <div style="padding:20px;font-size:13px;color:var(--muted);text-align:center">Login terlebih dahulu</div>
    </div>

    <!-- Start new conversation -->
    <div class="start-conv">
      <label>➕ Mulai Percakapan Baru</label>
      <div id="role-chips" class="role-chips" style="display:none"></div>
      <input id="user-search" placeholder="Cari nama atau email…" oninput="debouncedUserSearch()" />
      <div id="user-results"></div>
    </div>
  </div>

  <!-- ═══════ Center: Chat Area ═══════ -->
  <div class="chat-area">
    <div class="chat-header" id="chat-header-bar">
      <div class="chat-header-avatar" id="chat-avatar" style="display:none">?</div>
      <div class="chat-header-info">
        <div class="chat-header-name" id="chat-header-name" style="color:var(--muted)">Pilih percakapan →</div>
        <div class="chat-header-role" id="chat-header-role"></div>
      </div>
      <button class="btn btn-outline btn-sm" onclick="loadMessages()" id="btn-refresh" style="display:none">↻ Refresh</button>
      <button class="btn btn-outline btn-sm" onclick="markRead()" id="btn-mark-read" style="display:none">✓ Read</button>
    </div>

    <div id="messages">
      <div class="empty-state">
        <div class="ico">💬</div>
        <div>Belum ada percakapan yang dipilih</div>
      </div>
    </div>

    <div class="chat-input-bar">
      <textarea id="msg-input" rows="1" placeholder="Kirim Pesan…" disabled></textarea>
      <button class="send-btn" id="btn-send" onclick="sendMessage()" disabled title="Kirim">➤</button>
    </div>
  </div>

  <!-- ═══════ Right: WebSocket Log ═══════ -->
  <div class="log-sidebar">
    <div class="log-title">WebSocket Log</div>
    <div id="ws-log"></div>
    <div class="log-actions">
      <button class="log-btn" onclick="clearLog()">Clear</button>
      <button class="log-btn" onclick="connectWS()" id="btn-ws-connect">Connect WS</button>
      <button class="log-btn ws-disconnect" onclick="disconnectWS()" id="btn-ws-disconnect" style="display:none">Disconnect</button>
    </div>
  </div>

</div>

<script>
// ════════════════════════════════════════════════════════════
//  Configuration
// ════════════════════════════════════════════════════════════
const BASE   = 'http://localhost:8080/api/v1';
const WS_URL = 'ws://localhost:8080/api/v1/ws';

let token       = null;
let myUserID    = null;
let myRole      = null;
let activeConvID = null;
let activeConvName = null;
let ws          = null;

const ALLOWED_CHAT = {
  customer: ['umkm', 'cs'],
  umkm:     ['customer', 'admin', 'cs', 'finance'],
  admin:    ['umkm', 'admin', 'cs', 'finance'],
  cs:       ['customer', 'umkm', 'admin', 'cs', 'finance'],
  finance:  ['umkm', 'admin', 'cs', 'finance'],
};

const ROLE_LABELS = {
  customer: 'Customer',
  umkm:     'Vendor',
  admin:    'Admin',
  cs:       'CS',
  finance:  'Finance',
};

// ════════════════════════════════════════════════════════════
//  Helpers
// ════════════════════════════════════════════════════════════
async function api(method, path, body, tok) {
  try {
    const headers = { 'Content-Type': 'application/json' };
    const t = tok ?? token;
    if (t) headers['Authorization'] = `Bearer ${t}`;
    const res = await fetch(BASE + path, {
      method, headers,
      body: body ? JSON.stringify(body) : undefined,
    });
    const text = await res.text();
    try { return JSON.parse(text); }
    catch { wsLog(`API ${method} ${path} → non-JSON: ${text.slice(0, 120)}`, 'error'); return { success: false, message: `Server error (${res.status})` }; }
  } catch (err) {
    wsLog(`API ${method} ${path} error: ${err.message}`, 'error');
    return { success: false, message: err.message };
  }
}

function toast(msg, type = 'success') {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

function wsLog(msg, type = 'info') {
  const el = document.createElement('div');
  el.className = `log-entry ${type}`;
  const ts = new Date().toLocaleTimeString('id', { hour12: false });
  el.textContent = `[${ts}] ${msg}`;
  const logEl = document.getElementById('ws-log');
  logEl.appendChild(el);
  logEl.scrollTop = logEl.scrollHeight;
}

function clearLog() { document.getElementById('ws-log').innerHTML = ''; }

function fmtTime(iso) {
  if (!iso) return '';
  return new Date(iso).toLocaleTimeString('id', { hour: '2-digit', minute: '2-digit', hour12: false });
}

function fmtDate(iso) {
  if (!iso) return '';
  return new Date(iso).toLocaleDateString('id', { day: '2-digit', month: '2-digit', year: 'numeric' });
}

function fmtDateTime(iso) {
  if (!iso) return '';
  return fmtTime(iso) + '  ' + fmtDate(iso);
}

function shortID(id) { return id ? id.slice(0, 8) + '…' : '?'; }
function initial(name) { return name ? name.charAt(0).toUpperCase() : '?'; }

function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}

function escAttr(str) {
  return String(str).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ════════════════════════════════════════════════════════════
//  Auth
// ════════════════════════════════════════════════════════════
async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pass  = document.getElementById('login-pass').value;
  const ep    = document.getElementById('login-endpoint').value;

  let res;
  try {
    const r = await fetch(BASE + ep, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password: pass }),
    });
    res = await r.json();
  } catch (err) {
    toast('Fetch error: ' + err.message, 'error');
    wsLog('Login error: ' + err.message, 'error');
    return;
  }

  if (!res.success) { toast(res.message || 'Login gagal', 'error'); return; }

  token    = res.data.token;
  myUserID = res.data.user_id ?? res.data.user?.id;
  myRole   = res.data.role ?? res.data.user?.role;

  // Decode JWT for role/id fallback
  try {
    const payload = JSON.parse(atob(token.split('.')[1]));
    myRole   = payload.role ?? myRole;
    myUserID = myUserID ?? payload.user_id;
  } catch {}

  const info = document.getElementById('user-info');
  info.style.display = 'block';
  info.innerHTML = `✅ <b>${escHtml(email)}</b> — ${ROLE_LABELS[myRole] || myRole}<br>` +
    `ID: <code onclick="navigator.clipboard.writeText('${myUserID}').then(()=>toast('ID copied!'))" title="Click to copy">${myUserID}</code>`;

  toast(`Login berhasil sebagai ${ROLE_LABELS[myRole] || myRole}`);
  wsLog(`Login: ${email} [${myRole}]`, 'info');

  renderRoleFilter();
  renderRoleChips();
  connectWS();
  loadConversations();
}

function doLogout() {
  token = null; myUserID = null; myRole = null; activeConvID = null; activeConvName = null;
  disconnectWS();
  document.getElementById('user-info').style.display = 'none';
  document.getElementById('conv-list').innerHTML = '<div style="padding:20px;font-size:13px;color:var(--muted);text-align:center">Login terlebih dahulu</div>';
  resetChatArea();
  document.getElementById('role-chips').style.display = 'none';
  document.getElementById('role-chips').innerHTML = '';
  document.getElementById('user-search').value = '';
  document.getElementById('user-results').style.display = 'none';
  document.getElementById('conv-search').value = '';
  renderRoleFilter();
  toast('Logged out', 'error');
}

function resetChatArea() {
  document.getElementById('messages').innerHTML = '<div class="empty-state"><div class="ico">💬</div><div>Belum ada percakapan yang dipilih</div></div>';
  document.getElementById('chat-header-name').textContent = 'Pilih percakapan →';
  document.getElementById('chat-header-name').style.color = 'var(--muted)';
  document.getElementById('chat-header-role').textContent = '';
  document.getElementById('chat-avatar').style.display = 'none';
  document.getElementById('btn-refresh').style.display = 'none';
  document.getElementById('btn-mark-read').style.display = 'none';
  setInputEnabled(false);
}

// ════════════════════════════════════════════════════════════
//  WebSocket
// ════════════════════════════════════════════════════════════
function connectWS() {
  if (!token) { toast('Login dulu', 'error'); return; }
  if (ws && ws.readyState === WebSocket.OPEN) { toast('WS sudah terhubung'); return; }

  ws = new WebSocket(`${WS_URL}?token=${token}`);

  ws.onopen = () => {
    updateWSBadge(true);
    wsLog('WebSocket connected ✓', 'info');
    document.getElementById('btn-ws-connect').style.display = 'none';
    document.getElementById('btn-ws-disconnect').style.display = 'inline-block';
  };

  ws.onmessage = (e) => {
    wsLog('⬇ PUSH: ' + e.data, 'push');
    try {
      const frame = JSON.parse(e.data);
      if (frame.type === 'chat_message') {
        if (frame.conversation_id === activeConvID) {
          const msgData = frame.data;
          appendMessage(msgData, false);
        } else {
          toast('💬 Pesan baru di conversation lain');
          loadConversations();
        }
      }
    } catch {}
  };

  ws.onerror = () => { wsLog('WS error', 'error'); };

  ws.onclose = (e) => {
    updateWSBadge(false);
    wsLog(`WS closed (code=${e.code})`, 'info');
    document.getElementById('btn-ws-connect').style.display = 'inline-block';
    document.getElementById('btn-ws-disconnect').style.display = 'none';
  };
}

function disconnectWS() {
  if (ws) { ws.close(); ws = null; }
  updateWSBadge(false);
}

function updateWSBadge(connected) {
  const b = document.getElementById('ws-badge');
  b.textContent = connected ? 'WS: Connected' : 'WS: Disconnected';
  b.className = connected ? 'connected' : 'disconnected';
}

// ════════════════════════════════════════════════════════════
//  Conversations
// ════════════════════════════════════════════════════════════
let _convSearchTimer = null;
function debouncedConvSearch() {
  clearTimeout(_convSearchTimer);
  _convSearchTimer = setTimeout(loadConversations, 300);
}

async function loadConversations() {
  if (!token) return;

  const search = document.getElementById('conv-search').value.trim();
  const role   = document.getElementById('conv-role-filter').value;

  const params = new URLSearchParams({ limit: '50' });
  if (search) params.set('search', search);
  if (role)   params.set('role', role);

  const res = await api('GET', '/chat?' + params.toString());
  const list = document.getElementById('conv-list');

  if (!res.success) {
    wsLog('loadConversations error: ' + (res.message || ''), 'error');
    list.innerHTML = '<div style="padding:20px;font-size:13px;color:#f87171;text-align:center">Gagal memuat percakapan</div>';
    return;
  }

  if (!res.data || res.data.length === 0) {
    list.innerHTML = '<div style="padding:20px;font-size:13px;color:var(--muted);text-align:center">Belum ada percakapan</div>';
    return;
  }

  list.innerHTML = res.data.map(c => {
    const name     = c.user_name || 'Unknown';
    const role     = c.user_role || '';
    const preview  = c.last_message || '';
    const time     = c.last_message_time ? fmtDateTime(c.last_message_time) : '';
    const isActive = c.id === activeConvID;
    const unread   = c.unread_count || 0;
    const badgeText = unread > 99 ? '99+' : (unread > 0 ? unread : '');
    return `
      <div class="conv-item ${isActive ? 'active' : ''}"
           onclick="openConversation('${c.id}', '${escAttr(name)}', '${role}')">
        <div class="conv-avatar">${initial(name)}</div>
        <div class="conv-info">
          <div class="conv-name">
            ${escHtml(name)}
            ${role ? `<span class="conv-role-tag role-${role}">${ROLE_LABELS[role] || role}</span>` : ''}
          </div>
          <div class="conv-preview">${escHtml(preview)}</div>
          <div style="font-size:10px;color:var(--muted);margin-top:1px">${time}</div>
        </div>
        ${badgeText ? `<div class="conv-badge">${badgeText}</div>` : ''}
      </div>
    `;
  }).join('');
}

function openConversation(convID, name, role) {
  activeConvID   = convID;
  activeConvName = name;

  // Update chat header
  document.getElementById('chat-header-name').textContent = name || shortID(convID);
  document.getElementById('chat-header-name').style.color = 'var(--text)';
  document.getElementById('chat-header-role').textContent = ROLE_LABELS[role] || role || '';
  const avatar = document.getElementById('chat-avatar');
  avatar.style.display = 'flex';
  avatar.textContent = initial(name);
  document.getElementById('btn-refresh').style.display = 'inline-block';
  document.getElementById('btn-mark-read').style.display = 'inline-block';
  setInputEnabled(true);

  // Highlight active in list
  document.querySelectorAll('.conv-item').forEach(el => el.classList.remove('active'));
  if (event && event.target) {
    const item = event.target.closest('.conv-item');
    if (item) item.classList.add('active');
  }

  loadMessages();
  // Auto mark-read when opening conversation, then refresh badge
  markRead().then(() => loadConversations());
}

// ════════════════════════════════════════════════════════════
//  Messages
// ════════════════════════════════════════════════════════════
async function loadMessages() {
  if (!activeConvID) return;
  const res = await api('GET', `/chat/${activeConvID}/messages?limit=100`);
  if (!res.success) { toast(res.message, 'error'); return; }

  const msgs = document.getElementById('messages');
  if (!res.data || res.data.length === 0) {
    msgs.innerHTML = '<div class="empty-state"><div>Belum ada pesan dalam percakapan ini</div></div>';
    return;
  }

  msgs.innerHTML = '';
  let lastDate = '';
  res.data.forEach(m => {
    const msgDate = fmtDate(m.created_at);
    if (msgDate !== lastDate) {
      lastDate = msgDate;
      const sep = document.createElement('div');
      sep.className = 'date-separator';
      sep.innerHTML = `<span>${msgDate}</span>`;
      msgs.appendChild(sep);
    }
    appendMessage(m, true);
  });
  msgs.scrollTop = msgs.scrollHeight;
}

function appendMessage(m, skipScroll = false) {
  const msgs = document.getElementById('messages');
  const empty = msgs.querySelector('.empty-state');
  if (empty) empty.remove();

  const isMe = m.sender_id === myUserID;
  const senderLabel = m.sender_name
    ? `${m.sender_name}${m.sender_role ? ' (' + (ROLE_LABELS[m.sender_role] || m.sender_role) + ')' : ''}`
    : shortID(m.sender_id);

  const row = document.createElement('div');
  row.className = `msg-row ${isMe ? 'me' : 'other'}`;
  row.innerHTML = `
    <div>
      ${!isMe ? `<div class="msg-sender">${escHtml(senderLabel)}</div>` : ''}
      <div class="bubble">${escHtml(m.message)}</div>
    </div>
    <div class="msg-time">${fmtTime(m.created_at)}</div>
  `;
  msgs.appendChild(row);
  if (!skipScroll) msgs.scrollTop = msgs.scrollHeight;
}

async function sendMessage() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text || !activeConvID) return;

  input.value = '';
  input.style.height = 'auto';

  const res = await api('POST', `/chat/${activeConvID}/messages`, { message: text });
  if (!res.success) { toast(res.message || 'Gagal kirim', 'error'); return; }

  wsLog(`⬆ SENT msg ${shortID(res.data.id)}`, 'send');
  appendMessage(res.data, false);

  // Refresh conversation list to update last_message
  loadConversations();
}

async function markRead() {
  if (!activeConvID) return;
  const res = await api('PATCH', `/chat/${activeConvID}/read`);
  toast(res.success ? 'Marked as read ✓' : (res.message || 'Error'), res.success ? 'success' : 'error');
}

// ════════════════════════════════════════════════════════════
//  User Search (Start new conversation)
// ════════════════════════════════════════════════════════════
function renderRoleFilter() {
  const sel = document.getElementById('conv-role-filter');
  const allowed = ALLOWED_CHAT[myRole] || [];
  sel.innerHTML = '<option value="">Semua</option>' +
    allowed.map(r => `<option value="${r}">${ROLE_LABELS[r] || r}</option>`).join('');
}

function renderRoleChips() {
  const allowed = ALLOWED_CHAT[myRole] || [];
  const container = document.getElementById('role-chips');
  if (allowed.length === 0) { container.style.display = 'none'; return; }

  container.style.display = 'flex';
  container.innerHTML = allowed.map(r => `
    <label class="role-chip checked">
      <input type="checkbox" value="${r}" checked onchange="this.closest('label').classList.toggle('checked', this.checked); debouncedUserSearch()" />
      ${ROLE_LABELS[r] || r}
    </label>
  `).join('');
}

let _userSearchTimer = null;
function debouncedUserSearch() {
  clearTimeout(_userSearchTimer);
  _userSearchTimer = setTimeout(searchChatableUsers, 300);
}

async function searchChatableUsers() {
  if (!token) return;
  const q = document.getElementById('user-search').value.trim();
  const checked = [...document.querySelectorAll('#role-chips input:checked')].map(e => e.value);
  const resultsEl = document.getElementById('user-results');

  const params = new URLSearchParams({ limit: '20' });
  if (q) params.set('q', q);
  if (checked.length > 0) params.set('roles', checked.join(','));

  const res = await api('GET', '/chat/users?' + params.toString());
  if (!res.success) { resultsEl.style.display = 'none'; return; }

  const users = res.data || [];
  if (users.length === 0) {
    resultsEl.style.display = 'block';
    resultsEl.innerHTML = '<div style="padding:12px;font-size:12px;color:var(--muted);text-align:center">Tidak ada user ditemukan</div>';
    return;
  }

  resultsEl.style.display = 'block';
  resultsEl.innerHTML = users.map(u => `
    <div class="user-result-item" data-uid="${u.id}" data-uname="${escAttr(u.full_name)}">
      <div style="font-weight:600;font-size:13px">${escHtml(u.full_name)}</div>
      <div style="font-size:11px;color:var(--muted)">${escHtml(u.email)}</div>
      <span class="conv-role-tag role-${u.role}" style="font-size:10px;padding:2px 8px">${ROLE_LABELS[u.role] || u.role}</span>
    </div>
  `).join('');
  resultsEl.querySelectorAll('.user-result-item').forEach(el => {
    el.addEventListener('click', () => startConvWithUser(el.dataset.uid, el.dataset.uname));
  });
}

async function startConvWithUser(userID, userName) {
  if (!token) { toast('Login dulu', 'error'); return; }
  if (userID === myUserID) { toast('Tidak bisa chat dengan diri sendiri', 'error'); return; }

  wsLog(`startConvWithUser → ${userName} (${shortID(userID)})`, 'send');
  const res = await api('POST', '/chat', { participant_id: userID });

  if (!res.success) {
    toast(res.message || 'Gagal memulai chat', 'error');
    wsLog('startConvWithUser error: ' + (res.message || ''), 'error');
    return;
  }

  toast(`Chat dengan ${userName} siap!`);
  wsLog(`Conversation started → ${shortID(res.data.id)}`, 'send');

  document.getElementById('user-results').style.display = 'none';
  document.getElementById('user-search').value = '';

  await loadConversations();
  openConversation(res.data.id, res.data.user_name || userName, res.data.user_role || '');
}

// ════════════════════════════════════════════════════════════
//  Input helpers
// ════════════════════════════════════════════════════════════
function setInputEnabled(yes) {
  document.getElementById('msg-input').disabled = !yes;
  document.getElementById('btn-send').disabled  = !yes;
}

document.getElementById('msg-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

document.getElementById('msg-input').addEventListener('input', function () {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});
</script>
