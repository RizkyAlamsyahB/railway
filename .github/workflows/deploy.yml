name: Build & Deploy

on:
  push:
    branches: [ "main2" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Login ke GHCR
      - name: Login to GHCR
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # 3. Build & Push Docker Image
      - name: Build & Push Image
        run: |
          docker build -t ghcr.io/rizkyalamsyahb/railway:latest .
          docker push ghcr.io/rizkyalamsyahb/railway:latest

      # 4. Setup SSH
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      # 5. Add VPS ke known_hosts
      - name: Add known hosts
        run: |
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      # 6. Deploy ke VPS (FIXED 🔥)
      - name: Deploy to VPS
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            set -e

            echo "Login GHCR..."
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            cd /root/haji-umroh-store-be

            echo "Pull image terbaru..."
            docker compose pull

            echo "Recreate container (penting!)..."
            docker compose up -d --force-recreate --remove-orphans

            echo "Cleanup image lama..."
            docker image prune -f

            echo "Deploy selesai 🚀"
          EOF