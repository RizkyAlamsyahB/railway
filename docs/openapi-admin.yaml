openapi: 3.0.3
info:
  title: Haji Umroh Store BE - Admin API
  version: 1.0.0
  description: Dokumentasi OpenAPI 3 untuk endpoint admin (autentikasi admin, manajemen user, dan review vendor).
servers:
  - url: http://localhost:8080
    description: Local development server
tags:
  - name: Admin Auth
    description: Operasi autentikasi untuk admin.
  - name: Admin Users
    description: Operasi manajemen user untuk role admin.
  - name: Admin Vendors
    description: Operasi review dan manajemen vendor untuk role admin.
security:
  - BearerAuth: []
paths:
  /api/v1/admin/login:
    post:
      tags:
        - Admin Auth
      summary: Login admin
      description: Endpoint login untuk admin. Tidak membutuhkan token.
      operationId: adminLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLoginRequest'
            example:
              email: admin@example.com
              password: supersecret123
      responses:
        '200':
          description: Login berhasil.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessAdminLoginEnvelope'
              example:
                success: true
                message: login successful
                data:
                  token: <JWT_TOKEN>
                errors: null
                meta: null
        '400':
          description: Request tidak valid (payload/validasi gagal).
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: validation failed
                data: null
                errors: "Key: 'AdminLoginRequest.Email' Error:Field validation for 'Email' failed on the 'email' tag"
                meta: null
        '401':
          description: Kredensial salah atau akun tidak aktif.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                invalidCredentials:
                  summary: Email atau password salah
                  value:
                    success: false
                    message: invalid email or password
                    data: null
                    errors: null
                    meta: null
                inactiveAccount:
                  summary: Akun belum aktif
                  value:
                    success: false
                    message: account is not active
                    data: null
                    errors: null
                    meta: null
        '403':
          description: User bukan admin.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: admin access required
                data: null
                errors: null
                meta: null
        '500':
          description: Internal server error.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: internal server error
                data: null
                errors: null
                meta: null
  /api/v1/admin/users:
    post:
      tags:
        - Admin Users
      summary: Membuat user baru
      operationId: createAdminUser
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
            example:
              email: admin.ops@example.com
              full_name: Admin Operations
              password: supersecret123
              phone: "+6281234567890"
              birth_date: "1990-05-12"
              role: admin
      responses:
        '201':
          description: User berhasil dibuat.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessUserEnvelope'
              example:
                success: true
                message: user created successfully
                data:
                  id: 7d2e9f31-09af-4d49-adf3-47bb2b9e2010
                  email: admin.ops@example.com
                  full_name: Admin Operations
                  birth_date: "1990-05-12T00:00:00Z"
                  phone: "+6281234567890"
                  status: active
                  email_verified_at: "2026-02-10T10:20:30Z"
                  role: admin
                  created_at: "2026-02-10T10:20:30Z"
                  updated_at: "2026-02-10T10:20:30Z"
                errors: null
                meta: null
        '400':
          description: Request tidak valid (validasi gagal, email sudah ada, atau birth_date tidak valid).
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                validationFailed:
                  summary: Validasi payload gagal
                  value:
                    success: false
                    message: validation failed
                    data: null
                    errors: "Key: 'CreateUserRequest.Password' Error:Field validation for 'Password' failed on the 'min' tag"
                    meta: null
                emailExists:
                  summary: Email sudah terdaftar
                  value:
                    success: false
                    message: email already exists
                    data: null
                    errors: null
                    meta: null
                invalidBirthDate:
                  summary: Format birth_date tidak valid
                  value:
                    success: false
                    message: invalid birth_date format, expected YYYY-MM-DD
                    data: null
                    errors: null
                    meta: null
        '401':
          description: Token tidak ada, format salah, atau token expired/invalid.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                invalidToken:
                  summary: Token invalid atau expired
                  value:
                    success: false
                    message: invalid or expired token
                    data: null
                    errors: null
                    meta: null
        '403':
          description: User tidak memiliki izin role admin.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                insufficientPermissions:
                  summary: Akses role tidak cukup
                  value:
                    success: false
                    message: insufficient permissions
                    data: null
                    errors: null
                    meta: null
        '500':
          description: Internal server error.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                internalServerError:
                  summary: Kesalahan server
                  value:
                    success: false
                    message: internal server error
                    data: null
                    errors: "failed to create user: database timeout"
                    meta: null
    get:
      tags:
        - Admin Users
      summary: Mengambil daftar user dengan pagination dan filter
      operationId: listAdminUsers
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          description: Nomor halaman (default 1).
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Jumlah item per halaman (default 10). Nilai <1 atau >100 akan dinormalisasi server menjadi 10.
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 10
        - name: role
          in: query
          description: Filter berdasarkan role user.
          required: false
          schema:
            type: string
            enum:
              - admin
              - umkm
              - customer
              - cs
              - finance
        - name: status
          in: query
          description: Filter berdasarkan status user.
          required: false
          schema:
            type: string
            enum:
              - pending
              - active
              - blocked
        - name: search
          in: query
          description: Pencarian berdasarkan nama lengkap atau email (case-insensitive).
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Daftar user berhasil diambil.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessUserListEnvelope'
              example:
                success: true
                message: users retrieved successfully
                data:
                  - id: 7d2e9f31-09af-4d49-adf3-47bb2b9e2010
                    email: admin.ops@example.com
                    full_name: Admin Operations
                    birth_date: "1990-05-12T00:00:00Z"
                    phone: "+6281234567890"
                    status: active
                    email_verified_at: "2026-02-10T10:20:30Z"
                    role: admin
                    created_at: "2026-02-10T10:20:30Z"
                    updated_at: "2026-02-10T10:20:30Z"
                  - id: 39fbf2d2-c4de-43cf-b833-392cbf11f289
                    email: cs.team@example.com
                    full_name: CS Team
                    birth_date: null
                    phone: null
                    status: active
                    email_verified_at: "2026-02-01T09:00:00Z"
                    role: cs
                    created_at: "2026-02-01T09:00:00Z"
                    updated_at: "2026-02-09T09:00:00Z"
                errors: null
                meta:
                  page: 1
                  limit: 10
                  total_items: 2
                  total_pages: 1
        '401':
          description: Token tidak ada, format salah, atau token expired/invalid.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: missing authorization header
                data: null
                errors: null
                meta: null
        '403':
          description: User tidak memiliki izin role admin.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: insufficient permissions
                data: null
                errors: null
                meta: null
        '500':
          description: Internal server error.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: failed to list users
                data: null
                errors: "failed to list users: database timeout"
                meta: null
  /api/v1/admin/users/{id}:
    get:
      tags:
        - Admin Users
      summary: Mengambil detail user berdasarkan ID
      operationId: getAdminUserById
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          description: ID user dalam format UUID.
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detail user berhasil diambil.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessUserEnvelope'
              example:
                success: true
                message: user retrieved successfully
                data:
                  id: 7d2e9f31-09af-4d49-adf3-47bb2b9e2010
                  email: admin.ops@example.com
                  full_name: Admin Operations
                  birth_date: "1990-05-12T00:00:00Z"
                  phone: "+6281234567890"
                  status: active
                  email_verified_at: "2026-02-10T10:20:30Z"
                  role: admin
                  created_at: "2026-02-10T10:20:30Z"
                  updated_at: "2026-02-10T10:20:30Z"
                errors: null
                meta: null
        '400':
          description: ID user bukan UUID yang valid.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: invalid user ID
                data: null
                errors: id must be a valid UUID
                meta: null
        '401':
          description: Token tidak ada, format salah, atau token expired/invalid.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: invalid or expired token
                data: null
                errors: null
                meta: null
        '403':
          description: User tidak memiliki izin role admin.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: insufficient permissions
                data: null
                errors: null
                meta: null
        '404':
          description: User tidak ditemukan.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                userNotFound:
                  summary: User tidak ditemukan
                  value:
                    success: false
                    message: user not found
                    data: null
                    errors: null
                    meta: null
        '500':
          description: Internal server error.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: internal server error
                data: null
                errors: "failed to fetch user: database timeout"
                meta: null
    put:
      tags:
        - Admin Users
      summary: Memperbarui data user berdasarkan ID
      operationId: updateAdminUserById
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          description: ID user dalam format UUID.
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
            example:
              full_name: Admin Ops Updated
              phone: "+628111111111"
              status: active
              role: finance
      responses:
        '200':
          description: User berhasil diperbarui.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessUserEnvelope'
              example:
                success: true
                message: user updated successfully
                data:
                  id: 7d2e9f31-09af-4d49-adf3-47bb2b9e2010
                  email: admin.ops@example.com
                  full_name: Admin Ops Updated
                  birth_date: "1990-05-12T00:00:00Z"
                  phone: "+628111111111"
                  status: active
                  email_verified_at: "2026-02-10T10:20:30Z"
                  role: finance
                  created_at: "2026-02-10T10:20:30Z"
                  updated_at: "2026-02-10T11:00:00Z"
                errors: null
                meta: null
        '400':
          description: Request tidak valid (ID UUID salah, validasi payload gagal, atau birth_date tidak valid).
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                invalidUserID:
                  summary: Format UUID tidak valid
                  value:
                    success: false
                    message: invalid user ID
                    data: null
                    errors: id must be a valid UUID
                    meta: null
                validationFailed:
                  summary: Validasi payload gagal
                  value:
                    success: false
                    message: validation failed
                    data: null
                    errors: "Key: 'UpdateUserRequest.Status' Error:Field validation for 'Status' failed on the 'oneof' tag"
                    meta: null
                invalidBirthDate:
                  summary: Format birth_date tidak valid
                  value:
                    success: false
                    message: invalid birth_date format, expected YYYY-MM-DD
                    data: null
                    errors: null
                    meta: null
        '401':
          description: Token tidak ada, format salah, atau token expired/invalid.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: invalid or expired token
                data: null
                errors: null
                meta: null
        '403':
          description: User tidak memiliki izin role admin.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: insufficient permissions
                data: null
                errors: null
                meta: null
        '404':
          description: User tidak ditemukan.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: user not found
                data: null
                errors: null
                meta: null
        '500':
          description: Internal server error.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: internal server error
                data: null
                errors: "failed to update user: database timeout"
                meta: null
    delete:
      tags:
        - Admin Users
      summary: Menghapus user berdasarkan ID
      operationId: deleteAdminUserById
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          description: ID user dalam format UUID.
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User berhasil dihapus.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessNoDataEnvelope'
              example:
                success: true
                message: user deleted successfully
                data: null
                errors: null
                meta: null
        '400':
          description: Request tidak valid (ID UUID salah atau mencoba menghapus akun sendiri).
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                invalidUserID:
                  summary: Format UUID tidak valid
                  value:
                    success: false
                    message: invalid user ID
                    data: null
                    errors: id must be a valid UUID
                    meta: null
                cannotDeleteSelf:
                  summary: Tidak boleh hapus akun sendiri
                  value:
                    success: false
                    message: cannot delete your own account
                    data: null
                    errors: null
                    meta: null
        '401':
          description: Token tidak ada, format salah, atau token expired/invalid.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: invalid or expired token
                data: null
                errors: null
                meta: null
        '403':
          description: User tidak memiliki izin role admin.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: insufficient permissions
                data: null
                errors: null
                meta: null
        '404':
          description: User tidak ditemukan.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: user not found
                data: null
                errors: null
                meta: null
        '500':
          description: Internal server error.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: internal server error
                data: null
                errors: "failed to delete user: database timeout"
                meta: null
  /api/v1/admin/vendors:
    get:
      tags:
        - Admin Vendors
      summary: Mengambil daftar vendor dengan pagination dan filter
      description: >
        Menampilkan daftar vendor yang terdaftar. Gunakan parameter `status=submitted`
        untuk melihat vendor yang menunggu persetujuan admin.
      operationId: listAdminVendors
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          description: Nomor halaman (default 1).
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Jumlah item per halaman (default 10). Nilai <1 atau >100 akan dinormalisasi server menjadi 10.
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 10
        - name: status
          in: query
          description: Filter berdasarkan status vendor.
          required: false
          schema:
            type: string
            enum:
              - draft
              - submitted
              - active
              - rejected
              - blocked
        - name: vendor_type
          in: query
          description: Filter berdasarkan tipe vendor.
          required: false
          schema:
            type: string
            enum:
              - umrah_souvenir_store
              - hajj_souvenir_store
              - general_souvenir_store
        - name: search
          in: query
          description: Pencarian berdasarkan display_name atau legal_name (case-insensitive).
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Daftar vendor berhasil diambil.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessVendorListEnvelope'
              example:
                success: true
                message: vendors retrieved successfully
                data:
                  - id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                    display_name: Toko Oleh-Oleh Haji Mabrur
                    legal_name: PT Mabrur Sejahtera
                    vendor_type: hajj_souvenir_store
                    responsible_person_name: Ahmad Fauzi
                    status: submitted
                    status_reason: null
                    owner_name: Budi Santoso
                    owner_email: budi@example.com
                    created_at: "2026-02-10T08:00:00Z"
                    updated_at: "2026-02-10T09:30:00Z"
                  - id: b2c3d4e5-f6a7-8901-bcde-f12345678901
                    display_name: Umrah Store Jakarta
                    legal_name: null
                    vendor_type: umrah_souvenir_store
                    responsible_person_name: Siti Aminah
                    status: rejected
                    status_reason: Dokumen KTP tidak jelas
                    owner_name: Siti Aminah
                    owner_email: siti@example.com
                    created_at: "2026-02-09T14:00:00Z"
                    updated_at: "2026-02-09T15:00:00Z"
                errors: null
                meta:
                  page: 1
                  limit: 10
                  total_items: 2
                  total_pages: 1
        '401':
          description: Token tidak ada, format salah, atau token expired/invalid.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: missing authorization header
                data: null
                errors: null
                meta: null
        '403':
          description: User tidak memiliki izin role admin.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: insufficient permissions
                data: null
                errors: null
                meta: null
        '500':
          description: Internal server error.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
