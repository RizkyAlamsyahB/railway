        - Daftar dokumen persyaratan utama (`requirements_documents`)

        Catatan:
        - `responsible_person`, `ktp`, dan item `requirements_documents` bisa berisi field nullable untuk data lama yang belum lengkap.
        - `mime_type` dan `file_size_bytes` diambil dari metadata object upload yang tersimpan.
