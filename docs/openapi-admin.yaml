  /api/v1/admin/payments:
    get:
      tags:
        - Admin Payments
      summary: Get Payment List
      description: |
        Endpoint untuk mengambil daftar semua payment invoice beserta informasi terkait (order, customer, vendor).
        Data diambil dari tabel `payment_invoices` yang di-JOIN dengan `orders`, `users`, dan `vendors`.

        URL: `GET /api/v1/admin/payments`
        Header: `Authorization: Bearer <admin_jwt>`

        **Pagination:**
        - `page` — nomor halaman (default: 1)
        - `limit` — jumlah item per halaman (default: 10, maks: 100)

        **Filter:**
        - `status` — filter berdasarkan status pembayaran (`pending`, `paid`, `expired`, `failed`)

        **Pencarian:**
        - `search` — pencarian berdasarkan nama customer (`users.full_name`) atau nomor order (`orders.order_no`) (case-insensitive, partial match)

        **Sorting:**
        - `sort_by` — kolom untuk pengurutan: `created_at`, `amount`, `customer_name`, `status` (default: `created_at`)
        - `sort_order` — arah pengurutan: `asc` (ascending) atau `desc` (descending) (default: `desc`)
      operationId: listAdminPayments
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          description: Nomor halaman (default 1).
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Jumlah item per halaman (default 10). Nilai <1 atau >100 akan dinormalisasi server menjadi 10.
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 10
        - name: status
          in: query
          description: Filter berdasarkan status pembayaran.
          required: false
          schema:
            type: string
            enum:
              - pending
              - paid
              - expired
              - failed
        - name: search
          in: query
          description: Pencarian berdasarkan nama customer atau nomor order (case-insensitive, partial match).
          required: false
          schema:
            type: string
        - name: sort_by
          in: query
          description: |
            Kolom yang digunakan untuk pengurutan. Default: `created_at`.
          required: false
          schema:
            type: string
            enum:
              - created_at
              - amount
              - customer_name
              - status
            default: created_at
        - name: sort_order
          in: query
          description: |
            Arah pengurutan. Default: `desc` (descending/terbaru dulu).
          required: false
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
      responses:
        "200":
          description: Daftar pembayaran berhasil diambil.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessPaymentListEnvelope"
              example:
                success: true
                message: payments retrieved successfully
                data:
                  - invoice_id: f1a2b3c4-d5e6-7890-abcd-ef1234567890
                    order_id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                    order_no: ORD-20260327-ABC123
                    customer_name: Ahmad Fauzi
                    vendor_name: Toko Oleh-Oleh Haji Mabrur
                    payment_method: BANK_TRANSFER
                    amount: 150000
                    status: paid
                    created_at: "2026-03-27T10:00:00Z"
                  - invoice_id: a2b3c4d5-e6f7-8901-bcde-f12345678901
                    order_id: b2c3d4e5-f6a7-8901-bcde-f12345678901
                    order_no: ORD-20260327-DEF456
                    customer_name: Siti Aminah
                    vendor_name: Umrah Store Jakarta
                    payment_method: null
                    amount: 75000
                    status: pending
                    created_at: "2026-03-27T09:30:00Z"
                errors: null
                meta:
                  page: 1
                  limit: 10
                  total_items: 2
                  total_pages: 1
        "401":
          description: Token tidak ada, format salah, atau token expired/invalid.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                message: missing authorization header
                data: null
                errors: null
                meta: null
        "403":
          description: User tidak memiliki izin role admin.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                message: insufficient permissions
                data: null
                errors: null
                meta: null
        "500":
          description: Internal server error.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                message: failed to list payments
                data: null
                errors: "failed to list payments: database timeout"
                meta: null
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  headers:
    RequestIDHeader:
      description: ID unik request dari middleware RequestID.
      schema:
        type: string
        example: 9e0d6f87-89ed-4ed5-bf74-b0c7610ce9cf
  schemas:
    AdminLoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: Email akun admin.
          example: admin@example.com
        password:
          type: string
          description: Password akun admin.
          example: supersecret123
    AdminLoginResponse:
      type: object
      required:
        - token
        - id
        - image_url
        - email
        - name
      properties:
        token:
          type: string
          description: JWT token untuk akses endpoint admin yang terproteksi.
          example: <JWT_TOKEN>
        id:
          type: string
          format: uuid
          description: ID user admin.
          example: 7d2e9f31-09af-4d49-adf3-47bb2b9e2010
        image_url:
          type: string
          description: URL foto profil admin. Bernilai string kosong jika belum diisi.
          example: https://cdn.example.com/admins/profile.jpg
        email:
          type: string
          format: email
          description: Email akun admin.
          example: admin@example.com
        name:
          type: string
          description: Nama admin.
          example: Admin Ops
    AdminMeResponse:
      type: object
      required:
        - id
        - image_url
        - email
        - name
      properties:
        id:
          type: string
          format: uuid
          description: ID user admin.
          example: 0e50f347-d4a7-4a21-be25-8bfbd61320a6
        image_url:
          type: string
          description: URL foto profil admin. Bernilai string kosong jika belum diisi.
          example: https://cdn.example.com/admins/profile.jpg
        email:
          type: string
          format: email
          description: Email akun admin.
          example: admin@example.com
        name:
          type: string
          description: Nama admin.
          example: System Administrator
    CreateUserRequest:
      type: object
      required:
        - email
        - full_name
        - password
        - role
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          description: Email unik user.
          example: admin.ops@example.com
        full_name:
          type: string
          maxLength: 120
          description: Nama lengkap user.
          example: Admin Operations
        password:
          type: string
          minLength: 8
          description: Password plaintext minimal 8 karakter.
          example: supersecret123
        phone:
          type: string
          maxLength: 20
          nullable: true
          description: Nomor telepon user.
          example: "+6281234567890"
        birth_date:
          type: string
          format: date
          nullable: true
          description: Tanggal lahir format YYYY-MM-DD.
          example: "1990-05-12"
        role:
          type: string
          description: Role awal user.
          enum:
            - admin
            - umkm
            - customer
            - cs
            - finance
          example: admin
    UpdateUserRequest:
      type: object
