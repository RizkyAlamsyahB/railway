components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  headers:
    RequestIDHeader:
      description: ID unik request dari middleware RequestID.
      schema:
        type: string
        example: 9e0d6f87-89ed-4ed5-bf74-b0c7610ce9cf
  schemas:
    AdminLoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: Email akun admin.
          example: admin@example.com
        password:
          type: string
          description: Password akun admin.
          example: supersecret123
    AdminLoginResponse:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          description: JWT token untuk akses endpoint admin yang terproteksi.
          example: <JWT_TOKEN>
    CreateUserRequest:
      type: object
      required:
        - email
        - full_name
        - password
        - role
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          description: Email unik user.
          example: admin.ops@example.com
        full_name:
          type: string
          maxLength: 120
          description: Nama lengkap user.
          example: Admin Operations
        password:
          type: string
          minLength: 8
          description: Password plaintext minimal 8 karakter.
          example: supersecret123
        phone:
          type: string
          maxLength: 20
          nullable: true
          description: Nomor telepon user.
          example: "+6281234567890"
        birth_date:
          type: string
          format: date
          nullable: true
          description: Tanggal lahir format YYYY-MM-DD.
          example: "1990-05-12"
        role:
          type: string
          description: Role awal user.
          enum:
            - admin
            - umkm
            - customer
            - cs
            - finance
          example: admin
    UpdateUserRequest:
      type: object
      description: Semua field opsional, hanya field yang dikirim yang akan diubah.
      properties:
        full_name:
          type: string
          maxLength: 120
          description: Nama lengkap user.
          example: Admin Ops Updated
        phone:
          type: string
          maxLength: 20
          nullable: true
          description: Nomor telepon user.
          example: "+628111111111"
        birth_date:
          type: string
          format: date
          nullable: true
          description: Tanggal lahir format YYYY-MM-DD.
          example: "1990-05-20"
        status:
          type: string
          description: Status user.
          enum:
            - pending
            - active
            - blocked
          example: active
        role:
          type: string
          description: Role user.
          enum:
            - admin
            - umkm
            - customer
            - cs
            - finance
          example: finance
        password:
          type: string
          minLength: 8
          description: Password baru user.
          example: newpassword123
    UserResponse:
      type: object
      required:
        - id
        - email
        - full_name
        - status
        - role
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          example: 7d2e9f31-09af-4d49-adf3-47bb2b9e2010
        email:
          type: string
          format: email
          example: admin.ops@example.com
        full_name:
          type: string
          example: Admin Operations
        birth_date:
          type: string
          format: date-time
          nullable: true
          description: Nilai response mengikuti serialisasi time.Time Go.
          example: "1990-05-12T00:00:00Z"
        phone:
          type: string
          nullable: true
          example: "+6281234567890"
        status:
          type: string
          enum:
            - pending
            - active
            - blocked
          example: active
        email_verified_at:
          type: string
          format: date-time
          nullable: true
          example: "2026-02-10T10:20:30Z"
        role:
          type: string
          description: Role user.
          enum:
            - admin
            - umkm
            - customer
            - cs
            - finance
          example: admin
        created_at:
          type: string
          format: date-time
          example: "2026-02-10T10:20:30Z"
        updated_at:
          type: string
          format: date-time
          example: "2026-02-10T10:20:30Z"
    PaginationMeta:
      type: object
      required:
        - page
        - limit
        - total_items
        - total_pages
      properties:
        page:
          type: integer
          format: int32
          example: 1
        limit:
          type: integer
          format: int32
          example: 10
        total_items:
          type: integer
          format: int64
          example: 2
        total_pages:
          type: integer
          format: int32
          example: 1
    SuccessUserEnvelope:
      type: object
      required:
        - success
        - message
        - data
        - errors
        - meta
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: user retrieved successfully
        data:
          $ref: '#/components/schemas/UserResponse'
