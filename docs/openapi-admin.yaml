          description: Object key S3 yang diterima saat membuat banner.
          example: banners/a1b2c3d4-e5f6-7890-abcd-ef1234567890.jpg
    BannerUpdateRequest:
      type: object
      description: |
        Semua field opsional.
        Jika `content_type` disertakan, response akan menyertakan `upload_url`, `object_key`, dan `expires_in`
        sehingga FE bisa langsung upload ulang gambar tanpa harus delete & buat banner baru.
        Setelah upload selesai, konfirmasi dengan `POST /api/v1/admin/settings/banners/{id}/confirm`.
      properties:
        title:
          type: string
          description: Judul banner baru.
          example: "Promo Haji 2026 — Updated"
        content_type:
          type: string
          description: MIME type gambar baru (image/jpeg, image/jpg, image/png, image/webp). Jika diisi, response akan mengembalikan presigned upload URL.
          example: image/jpeg
    BannerUpdateResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        image_url:
          type: string
          description: URL gambar saat ini (mungkin masih placeholder jika baru request presign).
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        upload_url:
          type: string
          description: Presigned URL untuk upload gambar baru ke S3. Hanya ada jika `content_type` dikirim di request.
          nullable: true
        object_key:
          type: string
          description: Object key S3 yang perlu dikirim ke endpoint confirm. Hanya ada jika `content_type` dikirim di request.
          nullable: true
        expires_in:
          type: integer
          description: Durasi validitas presigned URL dalam detik (1800 = 30 menit). Hanya ada jika `content_type` dikirim di request.
          nullable: true
    BannerResponse:
      type: object
      required:
        - id
        - title
        - image_url
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        title:
          type: string
          example: Promo Haji 2026
        image_url:
          type: string
          nullable: true
          description: URL gambar banner. Null jika gambar belum dikonfirmasi.
          example: "https://cdn.umrahmart.com/banners/a1b2c3d4.jpg"
        created_at:
          type: string
          format: date-time
          example: "2026-03-04T10:00:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2026-03-04T10:05:00Z"
