openapi: 3.0.3
info:
  title: UmrahMart - Admin API
  version: 1.0.0
  description: Dokumentasi OpenAPI 3 untuk endpoint admin (autentikasi admin, manajemen user, dan review vendor).
servers:
  - url: http://localhost:8080
    description: Local development server
tags:
  - name: Admin Auth
    description: Operasi autentikasi untuk admin.
  - name: Admin Users
    description: Operasi manajemen user untuk role admin.
  - name: Admin Vendors
    description: Operasi review dan manajemen vendor untuk role admin.
  - name: Admin Payments
    description: Operasi listing dan monitoring pembayaran untuk role admin.
security:
  - BearerAuth: []
paths:
  /api/v1/admin/login:
    post:
      tags:
        - Admin Auth
      summary: Login
      description: Endpoint login untuk admin. Tidak membutuhkan token.
      operationId: adminLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginRequest"
            example:
              email: admin@example.com
              password: supersecret123
      responses:
        "200":
          description: Login berhasil.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessAdminLoginEnvelope"
              example:
                success: true
                message: login successful
                data:
                  token: <JWT_TOKEN>
                  id: 7d2e9f31-09af-4d49-adf3-47bb2b9e2010
                  image_url: https://cdn.example.com/admins/profile.jpg
                  email: admin@example.com
                  name: Admin Ops
                errors: null
                meta: null
        "400":
          description: Request tidak valid (payload/validasi gagal).
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                message: validation failed
                data: null
                errors: "Key: 'AdminLoginRequest.Email' Error:Field validation for 'Email' failed on the 'email' tag"
                meta: null
        "401":
          description: Kredensial salah atau akun tidak aktif.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                invalidCredentials:
                  summary: Email atau password salah
                  value:
                    success: false
                    message: invalid email or password
                    data: null
                    errors: null
                    meta: null
                inactiveAccount:
                  summary: Akun belum aktif
                  value:
                    success: false
                    message: account is not active
                    data: null
                    errors: null
                    meta: null
        "403":
          description: User bukan admin.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                message: admin access required
                data: null
                errors: null
                meta: null
        "500":
          description: Internal server error.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                message: internal server error
                data: null
                errors: null
                meta: null
  /api/v1/admin/me:
    get:
      tags:
        - Admin Auth
      summary: Get My Profile
      description: Mengembalikan profil admin berdasarkan JWT pada header Authorization.
      operationId: getAdminMe
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Profil admin berhasil diambil.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessAdminMeEnvelope"
              example:
                success: true
                message: admin profile retrieved successfully
                data:
                  id: 0e50f347-d4a7-4a21-be25-8bfbd61320a6
                  image_url: ""
                  email: admin@example.com
                  name: System Administrator
                errors: null
                meta: null
        "400":
          description: Data user ID dari token tidak valid.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                message: invalid user ID in token
                data: null
                errors: null
                meta: null
        "401":
          description: Token tidak ada, format salah, atau token expired/invalid.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                message: invalid or expired token
                data: null
                errors: null
                meta: null
        "403":
          description: User tidak memiliki izin role admin.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                message: insufficient permissions
                data: null
                errors: null
                meta: null
        "404":
          description: User admin tidak ditemukan.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                message: user not found
                data: null
                errors: null
                meta: null
        "500":
          description: Internal server error.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                message: internal server error
                data: null
                errors: "failed to fetch user: database timeout"
                meta: null
  /api/v1/admin/users:
    post:
      tags:
        - Admin Users
      summary: Create User
      description: |
        Endpoint untuk membuat user baru oleh admin.

        URL: `POST /api/v1/admin/users`
        Header: `Authorization: Bearer <admin_jwt>`
        Content-Type: `application/json`

        Field wajib:
        - `email`
        - `full_name`
        - `password`
        - `role`

        Field opsional:
        - `phone`
        - `birth_date` dengan format `YYYY-MM-DD`
      operationId: createAdminUser
      security:
        - BearerAuth: []
      requestBody:
        required: true
        description: Payload JSON untuk membuat user baru.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
            example:
              email: admin.ops@example.com
              full_name: Admin Operations
              password: supersecret123
              phone: "+6281234567890"
              birth_date: "1990-05-12"
              role: admin
      responses:
        "201":
          description: User berhasil dibuat.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessUserEnvelope"
              example:
                success: true
                message: user created successfully
                data:
                  id: 7d2e9f31-09af-4d49-adf3-47bb2b9e2010
                  email: admin.ops@example.com
                  full_name: Admin Operations
                  birth_date: "1990-05-12T00:00:00Z"
                  phone: "+6281234567890"
                  status: active
                  email_verified_at: "2026-02-10T10:20:30Z"
                  role: admin
                  created_at: "2026-02-10T10:20:30Z"
                  updated_at: "2026-02-10T10:20:30Z"
                errors: null
                meta: null
        "400":
          description: Request tidak valid (validasi payload gagal atau format birth_date tidak valid).
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                validationFailed:
                  summary: Validasi payload gagal
                  value:
                    success: false
                    message: validation failed
                    data: null
                    errors:
                      fields:
                        email:
                          - must be a valid email address
                        full_name:
                          - is required
                        password:
                          - must be at least 8 characters
                        role:
                          - "must be one of: admin, umkm, customer, cs, finance"
                      request: []
                    meta: null
                invalidBirthDate:
                  summary: Format birth_date tidak valid
                  value:
                    success: false
                    message: validation failed
                    data: null
                    errors:
                      fields:
                        birth_date:
                          - must use YYYY-MM-DD format
                      request: []
                    meta: null
                malformedJson:
                  summary: Body JSON tidak valid
                  value:
                    success: false
                    message: validation failed
                    data: null
                    errors:
                      fields: {}
                      request:
                        - request body must be valid JSON
                    meta: null
        "409":
          description: Terjadi konflik data unik pada user.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                emailExists:
                  summary: Email sudah terdaftar
                  value:
                    success: false
                    message: email already exists
                    data: null
                    errors:
                      fields:
                        email:
                          - email is already registered
                      request: []
                    meta: null
                phoneExists:
                  summary: Nomor telepon sudah terdaftar
                  value:
                    success: false
                    message: phone number already registered
                    data: null
                    errors:
                      fields:
                        phone:
                          - phone number is already registered
                      request: []
                    meta: null
        "401":
          description: Token tidak ada, format salah, atau token expired/invalid.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                invalidToken:
                  summary: Token invalid atau expired
                  value:
                    success: false
                    message: invalid or expired token
                    data: null
                    errors: null
                    meta: null
        "403":
          description: User tidak memiliki izin role admin.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                insufficientPermissions:
                  summary: Akses role tidak cukup
                  value:
                    success: false
                    message: insufficient permissions
                    data: null
                    errors: null
                    meta: null
        "500":
          description: Internal server error.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                internalServerError:
                  summary: Kesalahan server
                  value:
                    success: false
                    message: internal server error
                    data: null
                    errors:
                      fields: {}
                      request: []
                    meta: null
    get:
      tags:
        - Admin Users
      summary: Get User List
      description: |
        Endpoint untuk mengambil daftar semua user dengan fitur pagination, filter, pencarian, dan sorting.

        URL: `GET /api/v1/admin/users`
        Header: `Authorization: Bearer <admin_jwt>`

        **Pagination:**
        - `page` — nomor halaman (default: 1)
        - `limit` — jumlah item per halaman (default: 10, maks: 100)

        **Filter:**
        - `role` — filter berdasarkan role user (`admin`, `umkm`, `customer`, `cs`, `finance`)
        - `status` — filter berdasarkan status user (`pending`, `active`, `blocked`)

        **Pencarian:**
        - `search` — pencarian berdasarkan `full_name` atau `email` (case-insensitive, partial match)

        **Sorting:**
        - `sort_by` — kolom untuk pengurutan: `full_name`, `email`, `role`, `status`, `created_at` (default: `created_at`)
        - `sort_order` — arah pengurutan: `asc` (ascending) atau `desc` (descending) (default: `desc`)
      operationId: listAdminUsers
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          description: Nomor halaman (default 1).
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Jumlah item per halaman (default 10). Nilai <1 atau >100 akan dinormalisasi server menjadi 10.
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 10
        - name: role
          in: query
          description: Filter berdasarkan role user.
          required: false
          schema:
            type: string
            enum:
              - admin
              - umkm
              - customer
              - cs
              - finance
        - name: status
          in: query
          description: Filter berdasarkan status user.
          required: false
          schema:
            type: string
            enum:
              - pending
              - active
              - blocked
        - name: search
          in: query
          description: Pencarian berdasarkan nama lengkap atau email (case-insensitive, partial match).
          required: false
          schema:
            type: string
        - name: sort_by
          in: query
          description: |
            Kolom yang digunakan untuk pengurutan. Default: `created_at`.
          required: false
          schema:
            type: string
            enum:
              - full_name
              - email
              - role
              - status
              - created_at
            default: created_at
        - name: sort_order
          in: query
          description: |
            Arah pengurutan. Default: `desc` (descending/terbaru dulu).
          required: false
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
      responses:
        "200":
          description: Daftar user berhasil diambil.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessUserListEnvelope"
              example:
                success: true
                message: users retrieved successfully
                data:
                  - id: 7d2e9f31-09af-4d49-adf3-47bb2b9e2010
                    email: admin.ops@example.com
                    full_name: Admin Operations
                    birth_date: "1990-05-12T00:00:00Z"
                    phone: "+6281234567890"
                    status: active
                    email_verified_at: "2026-02-10T10:20:30Z"
                    role: admin
                    created_at: "2026-02-10T10:20:30Z"
                    updated_at: "2026-02-10T10:20:30Z"
                  - id: 39fbf2d2-c4de-43cf-b833-392cbf11f289
                    email: cs.team@example.com
                    full_name: CS Team
                    birth_date: null
                    phone: null
                    status: active
                    email_verified_at: "2026-02-01T09:00:00Z"
                    role: cs
                    created_at: "2026-02-01T09:00:00Z"
                    updated_at: "2026-02-09T09:00:00Z"
                errors: null
                meta:
                  page: 1
                  limit: 10
                  total_items: 2
                  total_pages: 1
        "401":
          description: Token tidak ada, format salah, atau token expired/invalid.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                message: missing authorization header
                data: null
                errors: null
                meta: null
        "403":
          description: User tidak memiliki izin role admin.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                message: insufficient permissions
                data: null
                errors: null
                meta: null
        "500":
          description: Internal server error.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                message: failed to list users
                data: null
                errors: "failed to list users: database timeout"
                meta: null
  /api/v1/admin/users/{id}:
    get:
      tags:
        - Admin Users
      summary: Get User By ID
      description: Mengambil detail user berdasarkan ID. ID harus dalam format UUID.
      operationId: getAdminUserById
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          description: ID user dalam format UUID.
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Detail user berhasil diambil.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessUserEnvelope"
              example:
                success: true
                message: user retrieved successfully
                data:
                  id: 7d2e9f31-09af-4d49-adf3-47bb2b9e2010
                  email: admin.ops@example.com
                  full_name: Admin Operations
                  birth_date: "1990-05-12T00:00:00Z"
                  phone: "+6281234567890"
                  status: active
                  email_verified_at: "2026-02-10T10:20:30Z"
                  role: admin
                  created_at: "2026-02-10T10:20:30Z"
                  updated_at: "2026-02-10T10:20:30Z"
                errors: null
                meta: null
        "400":
          description: ID user bukan UUID yang valid.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                message: invalid user ID
                data: null
                errors: id must be a valid UUID
                meta: null
        "401":
          description: Token tidak ada, format salah, atau token expired/invalid.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                message: invalid or expired token
                data: null
                errors: null
                meta: null
        "403":
          description: User tidak memiliki izin role admin.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                message: insufficient permissions
                data: null
                errors: null
                meta: null
        "404":
          description: User tidak ditemukan.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                userNotFound:
                  summary: User tidak ditemukan
                  value:
                    success: false
                    message: user not found
                    data: null
                    errors: null
                    meta: null
        "500":
          description: Internal server error.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                message: internal server error
                data: null
                errors: "failed to fetch user: database timeout"
                meta: null
    put:
      tags:
        - Admin Users
      summary: Update User By ID
      operationId: updateAdminUserById
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          description: ID user dalam format UUID.
          required: true
          schema:
            type: string
