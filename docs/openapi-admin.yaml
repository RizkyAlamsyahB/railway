          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        status:
          type: string
          description: Status vendor setelah perubahan.
          enum:
            - active
            - rejected
            - blocked
          example: active
        message:
          type: string
          description: Pesan deskriptif.
          example: vendor approved successfully
    SuccessVendorActionEnvelope:
      type: object
      required:
        - success
        - message
        - data
        - errors
        - meta
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: vendor approved successfully
        data:
          $ref: "#/components/schemas/AdminVendorActionResponse"
        errors:
          nullable: true
          description: Selalu null pada response sukses.
        meta:
          nullable: true
          description: Selalu null.
    AdminPaymentListItem:
      type: object
      required:
        - invoice_id
        - order_id
        - order_no
        - customer_name
        - vendor_name
        - amount
        - status
        - created_at
      properties:
        invoice_id:
          type: string
          format: uuid
          description: ID unik payment invoice.
          example: f1a2b3c4-d5e6-7890-abcd-ef1234567890
        order_id:
          type: string
          format: uuid
          description: ID order terkait.
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        order_no:
          type: string
          description: Nomor order yang dapat dibaca manusia.
          example: ORD-20260327-ABC123
        customer_name:
          type: string
          description: Nama lengkap customer yang melakukan pembayaran (dari tabel users).
          example: Ahmad Fauzi
        vendor_name:
          type: string
          description: Nama toko vendor (display_name dari tabel vendors).
          example: Toko Oleh-Oleh Haji Mabrur
        payment_method:
          type: string
          nullable: true
          description: Metode pembayaran yang digunakan (e.g. BANK_TRANSFER, EWALLET). Null jika belum dibayar.
          example: BANK_TRANSFER
        amount:
          type: number
          format: double
          description: Nominal pembayaran dalam satuan Rupiah.
          example: 150000
        status:
          type: string
          description: Status pembayaran invoice.
          enum:
            - pending
            - paid
            - expired
            - failed
          example: paid
        created_at:
          type: string
          format: date-time
          description: Waktu pembuatan invoice.
          example: "2026-03-27T10:00:00Z"
    SuccessPaymentListEnvelope:
      type: object
      required:
        - success
        - message
        - data
        - errors
        - meta
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: payments retrieved successfully
        data:
          type: array
          items:
            $ref: "#/components/schemas/AdminPaymentListItem"
        errors:
          nullable: true
          description: Selalu null pada response sukses.
        meta:
          $ref: "#/components/schemas/PaginationMeta"
