      summary: Get Vendor By ID
      description: |
        Mengambil detail vendor berdasarkan ID (UUID) untuk kebutuhan review admin.

        Response dikembalikan dalam shape kontrak review terbaru:
        - Informasi inti toko (`store_name`, `store_description`, `store_type`, `status`, `status_reason`, `email`)
