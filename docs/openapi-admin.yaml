  /api/v1/admin/vendors:
    get:
      tags:
        - Admin Vendors
      summary: Get Vendor List
      description: |
        Menampilkan daftar vendor yang terdaftar.

        Gunakan parameter `status=submitted` untuk melihat vendor yang menunggu persetujuan admin.

        Catatan nullable pada `data[]`:
        - `store_type` dapat bernilai `null` (umumnya saat vendor masih `draft`).
        - `store_name` dapat bernilai `null` (umumnya saat vendor masih `draft`).
        - `address` dapat bernilai `null` jika data alamat belum diisi.

        Jika `address` tidak `null`, field di dalamnya (`province`, `city`, `district`, `subdistrict`, `postal_code`) tetap bisa bernilai `null` sesuai kelengkapan data.
      operationId: listAdminVendors
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          description: Nomor halaman (default 1).
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Jumlah item per halaman (default 10). Nilai <1 atau >100 akan dinormalisasi server menjadi 10.
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 10
        - name: status
          in: query
          description: Filter berdasarkan status vendor.
          required: false
          schema:
            type: string
            enum:
              - draft
              - submitted
              - active
              - rejected
              - blocked
        - name: vendor_type
          in: query
          description: Filter berdasarkan tipe vendor.
          required: false
          schema:
            type: string
            enum:
              - souvenir_store
              - ppiu
              - hajj_dormitory
        - name: search
          in: query
          description: Pencarian berdasarkan display_name atau legal_name (case-insensitive).
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Daftar vendor berhasil diambil.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessVendorListEnvelope"
              example:
                success: true
                message: vendors retrieved successfully
                data:
                  - id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                    status: submitted
                    store_type: null
                    store_name: Toko Oleh-Oleh Haji Mabrur
                    email: budi@example.com
                    address:
                      province: DKI Jakarta
                      city: Jakarta Pusat
                      district: Menteng
                      subdistrict: Pegangsaan
                      postal_code: "10320"
                    created_at: "2026-02-10T08:00:00Z"
                  - id: b2c3d4e5-f6a7-8901-bcde-f12345678901
                    status: submitted
                    store_type: ppiu
                    store_name: Umrah Store Jakarta
                    email: siti@example.com
                    address: null
                    created_at: "2026-02-09T14:00:00Z"
                errors: null
                meta:
                  page: 1
                  limit: 10
                  total_items: 2
                  total_pages: 1
        "401":
          description: Token tidak ada, format salah, atau token expired/invalid.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                message: missing authorization header
                data: null
                errors: null
                meta: null
        "403":
          description: User tidak memiliki izin role admin.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                message: insufficient permissions
                data: null
                errors: null
                meta: null
        "500":
          description: Internal server error.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                message: failed to list vendors
                data: null
                errors: "failed to list vendors: database timeout"
                meta: null
