  /api/v1/admin/payments:
    get:
      tags:
        - Admin Payments
      summary: Get Payment List
      description: |
        Endpoint untuk mengambil daftar semua payment invoice beserta informasi terkait (order, customer, vendor).
        Data diambil dari tabel `payment_invoices` yang di-JOIN dengan `orders`, `users`, dan `vendors`.

        URL: `GET /api/v1/admin/payments`
        Header: `Authorization: Bearer <admin_jwt>`

        **Pagination:**
        - `page` — nomor halaman (default: 1)
        - `limit` — jumlah item per halaman (default: 10, maks: 100)

        **Filter:**
        - `status` — filter berdasarkan status pembayaran (`pending`, `paid`, `expired`, `failed`)

        **Pencarian:**
        - `search` — pencarian berdasarkan nama customer (`users.full_name`) atau nomor order (`orders.order_no`) (case-insensitive, partial match)

        **Sorting:**
        - `sort_by` — kolom untuk pengurutan: `created_at`, `amount`, `customer_name`, `status` (default: `created_at`)
        - `sort_order` — arah pengurutan: `asc` (ascending) atau `desc` (descending) (default: `desc`)
      operationId: listAdminPayments
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          description: Nomor halaman (default 1).
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Jumlah item per halaman (default 10). Nilai <1 atau >100 akan dinormalisasi server menjadi 10.
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 10
        - name: status
          in: query
          description: Filter berdasarkan status pembayaran.
          required: false
          schema:
            type: string
            enum:
              - pending
              - paid
              - expired
              - failed
        - name: search
          in: query
          description: Pencarian berdasarkan nama customer atau nomor order (case-insensitive, partial match).
          required: false
          schema:
            type: string
        - name: sort_by
          in: query
          description: |
            Kolom yang digunakan untuk pengurutan. Default: `created_at`.
          required: false
          schema:
            type: string
            enum:
              - created_at
              - amount
              - customer_name
              - status
            default: created_at
        - name: sort_order
          in: query
          description: |
            Arah pengurutan. Default: `desc` (descending/terbaru dulu).
          required: false
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
        - name: start_date
          in: query
          description: |
            Filter tanggal mulai (inklusif). Format: `YYYY-MM-DD`.
          required: false
          schema:
            type: string
            format: date
            example: "2026-04-01"
        - name: end_date
          in: query
          description: |
            Filter tanggal akhir (inklusif). Format: `YYYY-MM-DD`.
          required: false
          schema:
            type: string
            format: date
            example: "2026-04-07"
      responses:
        "200":
          description: Daftar pembayaran berhasil diambil.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessPaymentListEnvelope"
              example:
                success: true
                message: payments retrieved successfully
                data:
                  - invoice_id: f1a2b3c4-d5e6-7890-abcd-ef1234567890
                    order_id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                    order_no: ORD-20260327-ABC123
                    customer_name: Ahmad Fauzi
                    vendor_name: Toko Oleh-Oleh Haji Mabrur
                    payment_method: BANK_TRANSFER
                    amount: 150000
                    status: paid
                    created_at: "2026-03-27T10:00:00Z"
                  - invoice_id: a2b3c4d5-e6f7-8901-bcde-f12345678901
                    order_id: b2c3d4e5-f6a7-8901-bcde-f12345678901
                    order_no: ORD-20260327-DEF456
                    customer_name: Siti Aminah
                    vendor_name: Umrah Store Jakarta
                    payment_method: null
                    amount: 75000
                    status: pending
                    created_at: "2026-03-27T09:30:00Z"
                errors: null
                meta:
                  page: 1
                  limit: 10
                  total_items: 2
                  total_pages: 1
        "401":
          description: Token tidak ada, format salah, atau token expired/invalid.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                message: missing authorization header
                data: null
                errors: null
                meta: null
        "403":
          description: User tidak memiliki izin role admin.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                message: insufficient permissions
                data: null
                errors: null
                meta: null
        "500":
          description: Internal server error.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                message: failed to list payments
                data: null
                errors: "failed to list payments: database timeout"
                meta: null
  /api/v1/admin/payments/summary:
    get:
      tags:
        - Admin Payments
      summary: Get Payment Summary
      description: |
        Mengembalikan ringkasan total nominal pembayaran berdasarkan status.
        Mendukung filter tanggal (`start_date`, `end_date`) untuk melihat ringkasan periode tertentu.

        URL: `GET /api/v1/admin/payments/summary`
        Header: `Authorization: Bearer <admin_jwt>`

        **Response fields:**
        - `total_amount` — total semua transaksi (semua status)
        - `paid_amount` — total transaksi berstatus `paid`
        - `pending_amount` — total transaksi berstatus `pending`
        - `failed_amount` — total transaksi berstatus `failed` + `expired`
      operationId: getAdminPaymentSummary
      security:
        - BearerAuth: []
      parameters:
        - name: start_date
          in: query
          description: |
            Filter tanggal mulai (inklusif). Format: `YYYY-MM-DD`.
          required: false
          schema:
            type: string
            format: date
            example: "2026-04-01"
        - name: end_date
          in: query
          description: |
            Filter tanggal akhir (inklusif). Format: `YYYY-MM-DD`.
          required: false
          schema:
            type: string
            format: date
            example: "2026-04-07"
      responses:
        "200":
          description: Ringkasan pembayaran berhasil diambil.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessPaymentSummaryEnvelope"
              example:
                success: true
                message: payment summary retrieved successfully
                data:
                  total_amount: 125000000
                  paid_amount: 118000000
                  pending_amount: 5000000
                  failed_amount: 2000000
                errors: null
                meta: null
        "401":
          description: Token tidak ada atau invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Bukan admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/admin/payments/export:
    get:
      tags:
        - Admin Payments
      summary: Export Payment CSV
      description: |
        Mengekspor seluruh data pembayaran dalam format CSV (tanpa pagination).
        Mendukung semua filter yang sama dengan endpoint list (`status`, `search`, `start_date`, `end_date`, `sort_by`, `sort_order`).

        URL: `GET /api/v1/admin/payments/export`
        Header: `Authorization: Bearer <admin_jwt>`

        **Kolom CSV:** Tanggal, Invoice ID, Order No, Customer, Vendor, Metode, Nominal, Status
      operationId: exportAdminPayments
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, paid, expired, failed, refunded]
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: sort_by
          in: query
          required: false
          schema:
            type: string
            enum: [created_at, amount, customer_name, status]
            default: created_at
        - name: sort_order
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: start_date
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        "200":
          description: File CSV berhasil diunduh.
          headers:
            Content-Disposition:
              schema:
                type: string
                example: "attachment; filename=\"payments.csv\""
          content:
            text/csv:
              schema:
                type: string
                format: binary
        "401":
          description: Token tidak ada atau invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Bukan admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
