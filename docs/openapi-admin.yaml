    # --- Chat ---
    ConversationResponse:
      type: object
      required:
        - id
        - initiator_id
        - participant_id
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          example: f1a2b3c4-d5e6-7890-f123-456789abcdef
        initiator_id:
          type: string
          format: uuid
          example: b2c3d4e5-f6a7-8901-bcde-f12345678901
        participant_id:
          type: string
          format: uuid
          example: d4e5f6a7-b8c9-0123-def4-567890abcdef
        last_message_at:
          type: string
          format: date-time
          nullable: true
          example: "2026-03-02T09:00:00Z"
        created_at:
          type: string
          format: date-time
          example: "2026-03-01T14:00:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2026-03-02T09:00:00Z"
        user_name:
          type: string
          description: Nama peserta percakapan (bukan diri sendiri).
          example: Toko Umrah Jaya
        user_role:
          type: string
          description: Role peserta percakapan.
          example: umkm
        last_message:
          type: string
          nullable: true
          description: Teks pesan terakhir dalam percakapan.
          example: Mohon review dokumen izin usaha
        last_message_time:
          type: string
          format: date-time
          nullable: true
          example: "2026-03-02T09:00:00Z"
        unread_count:
          type: integer
          format: int32
          description: Jumlah pesan yang belum dibaca.
          example: 1
