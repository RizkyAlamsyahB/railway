                meta: null
        "500":
          description: Internal server error.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                message: internal server error
                data: null
                errors: "failed to update user: database timeout"
                meta: null
    delete:
      tags:
        - Admin Users
      summary: Delete User By ID
      operationId: deleteAdminUserById
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          description: ID user dalam format UUID.
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: User berhasil dihapus.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessNoDataEnvelope"
              example:
                success: true
                message: user deleted successfully
                data: null
                errors: null
                meta: null
        "400":
          description: Request tidak valid (ID UUID salah atau mencoba menghapus akun sendiri).
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
