openapi: 3.0.3
info:
  title: Admin API
  version: 1.0.0
  description: Dokumentasi OpenAPI 3 untuk endpoint admin (autentikasi admin, manajemen user, dan review vendor).
servers:
  - url: https://haji-umroh-store-api.jauhar.id
    description: Local development server
tags:
  - name: Admin Auth
    description: Operasi autentikasi untuk admin.
  - name: Admin Users
    description: Operasi manajemen user untuk role admin.
  - name: Admin Dashboard
    description: Ringkasan metrik dan transaksi terbaru untuk dashboard admin.
  - name: Admin Reports
    description: Laporan transaksi admin beserta ringkasan KPI dan export CSV.
  - name: Admin Vendors
    description: Operasi review dan manajemen vendor untuk role admin.
  - name: Admin Payments
    description: Operasi listing dan monitoring pembayaran untuk role admin.
  - name: Admin Settings - Banners
    description: Manajemen banner halaman utama (upload presign, konfirmasi, CRUD).
  - name: Admin Settings - Categories
    description: Manajemen master data kategori produk.
  - name: Admin Settings - Return Reasons
    description: Manajemen master data alasan pengembalian produk.
  - name: Admin Settings - Contacts
    description: Manajemen data kontak admin yang ditampilkan ke publik.
  - name: Admin Settings - FAQ
    description: Manajemen FAQ (Pusat Bantuan) yang ditampilkan ke customer.
  - name: Admin Chat
    description: Operasi manajemen percakapan chat untuk role admin.
security:
  - BearerAuth: []
paths:
  /api/v1/admin/login:
    post:
      tags:
        - Admin Auth
      summary: Login
      description: Endpoint login untuk admin. Tidak membutuhkan token.
      operationId: adminLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginRequest"
            example:
              email: admin@example.com
              password: supersecret123
      responses:
        "200":
          description: Login berhasil.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessAdminLoginEnvelope"
              example:
                success: true
                message: login successful
                data:
                  token: <JWT_TOKEN>
                  id: 7d2e9f31-09af-4d49-adf3-47bb2b9e2010
                  image_url: https://cdn.example.com/admins/profile.jpg
                  email: admin@example.com
                  name: Admin Ops
                errors: null
                meta: null
        "400":
          description: Request tidak valid (payload/validasi gagal).
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                message: validation failed
                data: null
                errors: "Key: 'AdminLoginRequest.Email' Error:Field validation for 'Email' failed on the 'email' tag"
                meta: null
        "401":
          description: Kredensial salah atau akun tidak aktif.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                invalidCredentials:
                  summary: Email atau password salah
                  value:
                    success: false
                    message: invalid email or password
                    data: null
                    errors: null
                    meta: null
                inactiveAccount:
                  summary: Akun belum aktif
                  value:
                    success: false
                    message: account is not active
                    data: null
                    errors: null
                    meta: null
        "403":
          description: User bukan admin.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                message: admin access required
                data: null
                errors: null
                meta: null
        "500":
          description: Internal server error.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                message: internal server error
                data: null
                errors: null
                meta: null
  /api/v1/admin/me:
    get:
      tags:
        - Admin Auth
      summary: Get My Profile
      description: Mengembalikan profil admin berdasarkan JWT pada header Authorization.
      operationId: getAdminMe
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Profil admin berhasil diambil.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessAdminMeEnvelope"
              example:
                success: true
                message: admin profile retrieved successfully
                data:
                  id: 0e50f347-d4a7-4a21-be25-8bfbd61320a6
                  image_url: ""
                  email: admin@example.com
                  name: System Administrator
                errors: null
                meta: null
        "400":
          description: Data user ID dari token tidak valid.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                message: invalid user ID in token
                data: null
                errors: null
                meta: null
        "401":
          description: Token tidak ada, format salah, atau token expired/invalid.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                message: invalid or expired token
                data: null
                errors: null
                meta: null
        "403":
          description: User tidak memiliki izin role admin.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                message: insufficient permissions
                data: null
                errors: null
                meta: null
        "404":
          description: User admin tidak ditemukan.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                message: user not found
                data: null
                errors: null
                meta: null
        "500":
          description: Internal server error.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                message: internal server error
                data: null
                errors: "failed to fetch user: database timeout"
                meta: null
  /api/v1/admin/dashboard:
    get:
      tags:
        - Admin Dashboard
      summary: Get Admin Dashboard
      description: Mengambil ringkasan metrik dashboard admin dan daftar transaksi terbaru pada bulan yang dipilih.
      operationId: getAdminDashboard
      security:
        - BearerAuth: []
      parameters:
        - name: month
          in: query
          required: false
          description: Bulan dashboard (1-12). Default bulan saat ini.
          schema:
            type: integer
            minimum: 1
            maximum: 12
            example: 3
        - name: year
          in: query
          required: false
          description: Tahun dashboard. Default tahun saat ini.
          schema:
            type: integer
            minimum: 2000
            maximum: 2100
            example: 2026
      responses:
        "200":
          description: Dashboard admin berhasil diambil.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessAdminDashboardEnvelope"
              example:
                success: true
                message: admin dashboard retrieved successfully
                data:
                  month: 3
                  year: 2026
                  summary:
                    ppiu_and_pihk_count: 128
                    dormitory_count: 56
                    store_count: 342
                    pending_payment_count: 17
                    needs_review_count: 24
                    order_count: 1245
                  transactions:
                    - date_time: 2026-03-01T20:15:00Z
                      invoice: INV-20260301-007
                      customer_name: Hendra Wijaya
                      product_name: Paket Umroh VIP
                      price: 35000000
                      status: paid
                errors: null
                meta: null
        "400":
          description: Parameter query tidak valid.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                message: month must be between 1 and 12
                data: null
                errors: null
                meta: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/admin/reports:
    get:
      tags:
        - Admin Reports
      summary: Get Admin Report
      description: Mengambil ringkasan laporan admin dan daftar agregasi transaksi per bulan dalam tahun yang dipilih.
      operationId: getAdminReport
      security:
        - BearerAuth: []
      parameters:
        - name: year
          in: query
          required: false
          description: Tahun laporan. Default tahun saat ini.
          schema:
            type: integer
            minimum: 2000
            maximum: 2100
            example: 2026
        - name: page
          in: query
          required: false
          description: Nomor halaman data laporan. Default `1`.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          description: Jumlah data per halaman. Default `10`, maksimum `100`.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: search
          in: query
          required: false
          description: Pencarian berdasarkan label periode, misalnya `Jan 2026`.
          schema:
            type: string
        - name: sort_by
          in: query
          required: false
          description: Kolom pengurutan data laporan.
          schema:
            type: string
            enum: [period, total_transaction, dp, settlement, refund]
            default: period
        - name: sort_order
          in: query
          required: false
          description: Arah pengurutan data laporan.
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        "200":
          description: Laporan admin berhasil diambil.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessAdminReportEnvelope"
              example:
                success: true
                message: admin report retrieved successfully
                data:
                  year: 2026
                  summary:
                    success_transaction_rate: 82
                    total_transactions: 8
                    customer_count: 400
                    platform_commission: 430000000
                  items:
                    - period: Jan 2026
                      total_transaction: 4000000
                      dp: 3000000
                      settlement: 4000000
                      refund: 50000
                errors: null
                meta:
                  page: 1
                  limit: 10
                  total_items: 12
                  total_pages: 2
        "400":
          description: Parameter query tidak valid.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                message: year must be between 2000 and 2100
                data: null
                errors: null
                meta: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/admin/reports/export:
    get:
      tags:
        - Admin Reports
      summary: Export Admin Report
      description: "Mengunduh laporan admin dalam format CSV berdasarkan filter yang saat ini didukung backend: `year`, `from_date`, `to_date`, `search`, `sort_by`, dan `sort_order`."
      operationId: exportAdminReport
      security:
        - BearerAuth: []
      parameters:
        - name: year
          in: query
          required: false
          description: Tahun laporan. Default tahun saat ini.
          schema:
            type: integer
            minimum: 2000
            maximum: 2100
            example: 2026
        - name: from_date
          in: query
          required: false
          description: Tanggal awal filter export dengan format `YYYY-MM-DD`.
          schema:
            type: string
            format: date
            example: 2026-01-01
        - name: to_date
          in: query
          required: false
          description: Tanggal akhir filter export dengan format `YYYY-MM-DD`.
          schema:
            type: string
            format: date
            example: 2026-12-31
        - name: search
          in: query
          required: false
          description: Pencarian berdasarkan label periode, misalnya `Jan 2026`.
          schema:
            type: string
        - name: sort_by
          in: query
          required: false
          description: Kolom pengurutan data export.
          schema:
            type: string
            enum: [period, total_transaction, dp, settlement, refund]
            default: period
        - name: sort_order
          in: query
          required: false
          description: Arah pengurutan data export.
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        "200":
          description: File CSV laporan admin berhasil dibuat.
          headers:
            Content-Disposition:
              schema:
                type: string
                example: attachment; filename="admin-report-2026.csv"
          content:
            text/csv:
              schema:
                type: string
                format: binary
        "400":
          description: Parameter query tidak valid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/admin/users:
    post:
      tags:
        - Admin Users
      summary: Create User
      description: |
        Endpoint untuk membuat user baru oleh admin.

        URL: `POST /api/v1/admin/users`
        Header: `Authorization: Bearer <admin_jwt>`
        Content-Type: `application/json`

        Field wajib:
        - `email`
        - `full_name`
        - `password`
        - `role`

        Field opsional:
        - `phone`
        - `birth_date` dengan format `YYYY-MM-DD`
      operationId: createAdminUser
      security:
        - BearerAuth: []
      requestBody:
        required: true
        description: Payload JSON untuk membuat user baru.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
            example:
              email: admin.ops@example.com
              full_name: Admin Operations
              password: supersecret123
              phone: "+6281234567890"
              birth_date: "1990-05-12"
              role: admin
      responses:
        "201":
          description: User berhasil dibuat.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessUserEnvelope"
              example:
                success: true
                message: user created successfully
                data:
                  id: 7d2e9f31-09af-4d49-adf3-47bb2b9e2010
                  email: admin.ops@example.com
                  full_name: Admin Operations
                  birth_date: "1990-05-12T00:00:00Z"
                  phone: "+6281234567890"
                  status: active
                  email_verified_at: "2026-02-10T10:20:30Z"
                  role: admin
                  created_at: "2026-02-10T10:20:30Z"
                  updated_at: "2026-02-10T10:20:30Z"
                errors: null
                meta: null
        "400":
          description: Request tidak valid (validasi payload gagal atau format birth_date tidak valid).
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                validationFailed:
                  summary: Validasi payload gagal
                  value:
                    success: false
                    message: validation failed
                    data: null
                    errors:
                      fields:
                        email:
                          - must be a valid email address
                        full_name:
                          - is required
                        password:
                          - must be at least 8 characters
                        role:
                          - "must be one of: admin, umkm, customer, cs, finance"
                      request: []
                    meta: null
                invalidBirthDate:
                  summary: Format birth_date tidak valid
                  value:
                    success: false
                    message: validation failed
                    data: null
                    errors:
                      fields:
                        birth_date:
                          - must use YYYY-MM-DD format
                      request: []
                    meta: null
                malformedJson:
                  summary: Body JSON tidak valid
                  value:
                    success: false
                    message: validation failed
                    data: null
                    errors:
                      fields: {}
                      request:
                        - request body must be valid JSON
                    meta: null
        "409":
          description: Terjadi konflik data unik pada user.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                emailExists:
                  summary: Email sudah terdaftar
                  value:
                    success: false
                    message: email already exists
                    data: null
                    errors:
                      fields:
                        email:
                          - email is already registered
                      request: []
                    meta: null
                phoneExists:
                  summary: Nomor telepon sudah terdaftar
                  value:
                    success: false
                    message: phone number already registered
                    data: null
                    errors:
                      fields:
                        phone:
                          - phone number is already registered
                      request: []
                    meta: null
        "401":
          description: Token tidak ada, format salah, atau token expired/invalid.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                invalidToken:
                  summary: Token invalid atau expired
                  value:
                    success: false
                    message: invalid or expired token
                    data: null
                    errors: null
                    meta: null
        "403":
          description: User tidak memiliki izin role admin.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                insufficientPermissions:
                  summary: Akses role tidak cukup
                  value:
                    success: false
                    message: insufficient permissions
                    data: null
                    errors: null
                    meta: null
        "500":
          description: Internal server error.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                internalServerError:
                  summary: Kesalahan server
                  value:
                    success: false
                    message: internal server error
                    data: null
                    errors:
                      fields: {}
                      request: []
                    meta: null
    get:
      tags:
        - Admin Users
      summary: Get User List
      description: |
        Endpoint untuk mengambil daftar semua user dengan fitur pagination, filter, pencarian, dan sorting.

        URL: `GET /api/v1/admin/users`
        Header: `Authorization: Bearer <admin_jwt>`

        **Pagination:**
        - `page` — nomor halaman (default: 1)
        - `limit` — jumlah item per halaman (default: 10, maks: 100)

        **Filter:**
        - `role` — filter berdasarkan role user (`admin`, `umkm`, `customer`, `cs`, `finance`)
        - `status` — filter berdasarkan status user (`pending`, `active`, `blocked`)

        **Pencarian:**
        - `search` — pencarian berdasarkan `full_name` atau `email` (case-insensitive, partial match)

        **Sorting:**
        - `sort_by` — kolom untuk pengurutan: `full_name`, `email`, `role`, `status`, `created_at` (default: `created_at`)
        - `sort_order` — arah pengurutan: `asc` (ascending) atau `desc` (descending) (default: `desc`)
      operationId: listAdminUsers
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          description: Nomor halaman (default 1).
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Jumlah item per halaman (default 10). Nilai <1 atau >100 akan dinormalisasi server menjadi 10.
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 10
        - name: role
          in: query
          description: Filter berdasarkan role user.
          required: false
          schema:
            type: string
            enum:
              - admin
              - umkm
              - customer
              - cs
              - finance
        - name: status
          in: query
          description: Filter berdasarkan status user.
          required: false
          schema:
            type: string
            enum:
              - pending
              - active
              - blocked
        - name: search
          in: query
          description: Pencarian berdasarkan nama lengkap atau email (case-insensitive, partial match).
          required: false
          schema:
            type: string
        - name: sort_by
          in: query
          description: |
            Kolom yang digunakan untuk pengurutan. Default: `created_at`.
          required: false
          schema:
            type: string
            enum:
              - full_name
              - email
              - role
              - status
              - created_at
            default: created_at
        - name: sort_order
          in: query
          description: |
            Arah pengurutan. Default: `desc` (descending/terbaru dulu).
          required: false
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
      responses:
        "200":
          description: Daftar user berhasil diambil.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessUserListEnvelope"
              example:
                success: true
                message: users retrieved successfully
                data:
                  - id: 7d2e9f31-09af-4d49-adf3-47bb2b9e2010
                    email: admin.ops@example.com
                    full_name: Admin Operations
                    birth_date: "1990-05-12T00:00:00Z"
                    phone: "+6281234567890"
                    status: active
                    email_verified_at: "2026-02-10T10:20:30Z"
                    role: admin
                    created_at: "2026-02-10T10:20:30Z"
                    updated_at: "2026-02-10T10:20:30Z"
                  - id: 39fbf2d2-c4de-43cf-b833-392cbf11f289
                    email: cs.team@example.com
                    full_name: CS Team
                    birth_date: null
                    phone: null
                    status: active
                    email_verified_at: "2026-02-01T09:00:00Z"
                    role: cs
                    created_at: "2026-02-01T09:00:00Z"
                    updated_at: "2026-02-09T09:00:00Z"
                errors: null
                meta:
                  page: 1
                  limit: 10
                  total_items: 2
                  total_pages: 1
        "401":
          description: Token tidak ada, format salah, atau token expired/invalid.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                message: missing authorization header
                data: null
                errors: null
                meta: null
        "403":
          description: User tidak memiliki izin role admin.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                message: insufficient permissions
                data: null
                errors: null
                meta: null
        "500":
          description: Internal server error.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                message: failed to list users
                data: null
                errors: "failed to list users: database timeout"
                meta: null
  /api/v1/admin/users/{id}:
    get:
      tags:
        - Admin Users
