components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Unauthorized:
      description: Token tidak ada, format salah, atau token expired/invalid.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestIDHeader"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            success: false
            message: invalid or expired token
            data: null
            errors: null
            meta: null
    Forbidden:
      description: User tidak memiliki izin role admin.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestIDHeader"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            success: false
            message: insufficient permissions
            data: null
            errors: null
            meta: null
    InternalServerError:
      description: Internal server error.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestIDHeader"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            success: false
            message: internal server error
            data: null
            errors: null
            meta: null
  headers:
    RequestIDHeader:
      description: ID unik request dari middleware RequestID.
      schema:
        type: string
        example: 9e0d6f87-89ed-4ed5-bf74-b0c7610ce9cf
  schemas:
    AdminLoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: Email akun admin.
          example: admin@example.com
        password:
          type: string
          description: Password akun admin.
          example: supersecret123
    AdminLoginResponse:
      type: object
      required:
        - token
        - id
        - image_url
        - email
        - name
      properties:
        token:
          type: string
          description: JWT token untuk akses endpoint admin yang terproteksi.
          example: <JWT_TOKEN>
        id:
          type: string
          format: uuid
          description: ID user admin.
          example: 7d2e9f31-09af-4d49-adf3-47bb2b9e2010
        image_url:
          type: string
          description: URL foto profil admin. Bernilai string kosong jika belum diisi.
          example: https://cdn.example.com/admins/profile.jpg
        email:
          type: string
          format: email
          description: Email akun admin.
          example: admin@example.com
        name:
          type: string
          description: Nama admin.
          example: Admin Ops
    AdminMeResponse:
      type: object
      required:
        - id
        - image_url
        - email
        - name
      properties:
        id:
          type: string
          format: uuid
          description: ID user admin.
          example: 0e50f347-d4a7-4a21-be25-8bfbd61320a6
        image_url:
          type: string
          description: URL foto profil admin. Bernilai string kosong jika belum diisi.
          example: https://cdn.example.com/admins/profile.jpg
        email:
          type: string
          format: email
          description: Email akun admin.
          example: admin@example.com
        name:
          type: string
          description: Nama admin.
          example: System Administrator
    AdminDashboardSummary:
