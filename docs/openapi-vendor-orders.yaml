openapi: 3.0.3
info:
  title: UmrahMart - Vendor Kelola Order API
  version: 1.0.0
  description: |
    Dokumentasi OpenAPI 3 untuk fitur **Kelola Order** vendor (UMKM).

    Fitur ini memungkinkan vendor untuk:
    - Melihat daftar pesanan masuk (dengan filter status dan paginasi)
    - Melihat detail pesanan lengkap (item, alamat, pembayaran, pengiriman)
    - Menerima pesanan (paid → processing)
    - Menolak pesanan (paid/processing → canceled)
    - Input nomor resi / kirim pesanan (processing → shipped)
    - Lacak pengiriman (tracking AWB) via Binderbyte

    **Status Flow:**
    ```
    paid → (accept) → processing → (ship) → shipped → delivered/completed
         → (reject) → canceled
    ```

    Semua endpoint memerlukan autentikasi JWT vendor (role `umkm`).
servers:
  - url: http://localhost:8080
    description: Local development server
tags:
  - name: Vendor Kelola Order
    description: Manajemen pesanan vendor — list, detail, accept, reject, ship, tracking.

security:
  - BearerAuth: []

paths:
  /api/v1/vendors/orders:
    get:
      tags:
        - Vendor Kelola Order
      summary: Daftar pesanan vendor
      description: |
        Mengambil daftar pesanan untuk vendor yang sedang login, dengan opsi filter berdasarkan status dan paginasi.

        Status yang valid untuk filter: `paid`, `processing`, `shipped`, `delivered`, `completed`, `canceled`.
      operationId: listVendorOrders
      parameters:
        - name: page
          in: query
          description: Halaman yang diminta (default 1).
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: limit
          in: query
          description: Jumlah item per halaman (default 10, max 100).
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
        - name: status
          in: query
          description: Filter berdasarkan status pesanan. Kosongkan untuk semua status.
          schema:
            type: string
            enum:
              - paid
              - processing
              - shipped
              - delivered
              - completed
              - canceled
      responses:
        "200":
          description: Daftar pesanan berhasil diambil.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/VendorOrderListItem"
                      meta:
                        $ref: "#/components/schemas/PaginationMeta"
              example:
                success: true
                message: vendor orders retrieved successfully
                data:
                  - order_id: "4354c494-d5a1-4f00-b120-abcdef123456"
                    order_no: "ORD-20260301-ABC1"
                    order_date: "2026-03-01T10:30:00Z"
                    customer_name: "Ahmad Rizky"
                    items:
                      - product_name: "Kain Ihram Premium"
                        selected_variant: "Putih - L"
                        qty: 2
                        unit_price: 150000
                        line_total: 300000
                    total_payment: 325000
                    status: "paid"
                errors: null
                meta:
                  page: 1
                  limit: 10
                  total_items: 3
                  total_pages: 1
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/vendors/orders/{orderId}:
    get:
      tags:
        - Vendor Kelola Order
      summary: Detail pesanan vendor
      description: |
        Mengambil detail lengkap satu pesanan milik vendor, termasuk:
        - Item pesanan (produk, varian, qty, harga)
        - Ringkasan biaya (subtotal produk, ongkos kirim, biaya layanan, grand total)
        - Alamat pengiriman / penerima
        - Informasi pengiriman (kurir, resi, status)
        - Informasi pembayaran
      operationId: getVendorOrderDetail
      parameters:
        - $ref: "#/components/parameters/OrderIdParam"
      responses:
        "200":
          description: Detail pesanan berhasil diambil.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/VendorOrderDetailResponse"
              example:
                success: true
                message: order detail retrieved successfully
                data:
                  shipping:
                    courier: "anteraja"
                    tracking_number: "11002960818873"
                    status: "Paket dalam pengiriman"
                    delivered_at: null
                  recipient:
                    name: "Ahmad Rizky"
                    phone: "081234567890"
                    address:
                      street: "Jl. Merdeka No. 10"
                      district: "Menteng"
                      city: "Jakarta"
                      province: "DKI Jakarta"
                      postal_code: "12345"
                  store:
                    name: "Toko Umroh"
                  items:
                    - name: "Kain Ihram Premium"
                      variant: "Putih - L"
                      price: 150000
                      quantity: 2
                      subtotal: 300000
                  payment:
                    method: "QRIS"
                    total_amount: 325000
                  order:
                    order_number: "ORD-20260301-ABC1"
                    order_time: "2026-03-01T10:30:00Z"
                    payment_time: "2026-03-01T10:35:00Z"
                    shipping_time: "2026-03-02T08:00:00Z"
                    delivered_time: null
                  summary:
                    items_total: 300000
                    shipping_fee: 15000
                    service_fee: 10000
                    grand_total: 325000
                errors: null
                meta: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Pesanan bukan milik vendor ini.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                message: order does not belong to this vendor
                data: null
                errors: null
                meta: null

  /api/v1/vendors/orders/{orderId}/accept:
    post:
      tags:
        - Vendor Kelola Order
      summary: Terima pesanan
      description: |
        Mengubah status pesanan dari `paid` → `processing`.

        Vendor menerima pesanan yang masuk dan mulai memprosesnya.
        Hanya bisa dilakukan jika status pesanan saat ini adalah `paid`.
      operationId: acceptVendorOrder
      parameters:
        - $ref: "#/components/parameters/OrderIdParam"
      requestBody:
        description: Tidak memerlukan request body.
        required: false
        content: {}
      responses:
        "200":
          description: Pesanan berhasil diterima.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AcceptRejectOrderResponse"
              example:
                success: true
                message: order accepted successfully
                data:
                  order_id: "4354c494-d5a1-4f00-b120-abcdef123456"
                  order_status: "processing"
                  updated_at: "2026-03-01T11:00:00Z"
                errors: null
                meta: null
        "400":
          description: Status pesanan tidak valid untuk diterima (bukan `paid`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                message: order can only be accepted when status is paid
                data: null
                errors: null
                meta: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Pesanan bukan milik vendor ini.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                message: order does not belong to this vendor
                data: null
                errors: null
                meta: null

  /api/v1/vendors/orders/{orderId}/reject:
    post:
      tags:
        - Vendor Kelola Order
      summary: Tolak pesanan
      description: |
        Mengubah status pesanan dari `paid` atau `processing` → `canceled`.

        Vendor menolak pesanan. Bisa dilakukan saat status `paid` (belum diproses)
        atau `processing` (sudah diproses tapi vendor membatalkan).
      operationId: rejectVendorOrder
      parameters:
        - $ref: "#/components/parameters/OrderIdParam"
      requestBody:
        description: Tidak memerlukan request body.
        required: false
        content: {}
      responses:
        "200":
          description: Pesanan berhasil ditolak.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AcceptRejectOrderResponse"
              example:
                success: true
                message: order rejected successfully
                data:
                  order_id: "4354c494-d5a1-4f00-b120-abcdef123456"
                  order_status: "canceled"
                  updated_at: "2026-03-01T11:05:00Z"
                errors: null
                meta: null
        "400":
          description: Status pesanan tidak valid untuk ditolak.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                message: order can only be rejected when status is paid or processing
                data: null
                errors: null
                meta: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Pesanan bukan milik vendor ini.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                message: order does not belong to this vendor
                data: null
                errors: null
                meta: null

  /api/v1/vendors/orders/{orderId}/ship:
    post:
      tags:
        - Vendor Kelola Order
      summary: Input resi / kirim pesanan
      description: |
        Input nomor resi pengiriman dan mengubah status pesanan dari `processing` → `shipped`.

        **Catatan:** Kurir dan jenis layanan sudah dipilih oleh customer saat checkout.
        Vendor hanya perlu menginput nomor resi (tracking number).
        Data shipment yang sudah ada (courier_code, service_type) akan tetap dipertahankan.
      operationId: shipVendorOrder
      parameters:
        - $ref: "#/components/parameters/OrderIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShipOrderRequest"
            example:
              tracking_no: "JNT0123456789"
      responses:
        "200":
          description: Resi berhasil diinput, pesanan dikirim.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ShipOrderResponse"
              example:
                success: true
                message: order shipped successfully
                data:
                  order_id: "4354c494-d5a1-4f00-b120-abcdef123456"
                  order_status: "shipped"
                  tracking_no: "JNT0123456789"
                  courier_code: "jnt"
                  shipped_at: "2026-03-01T14:30:00Z"
                errors: null
                meta: null
        "400":
          description: Request tidak valid (tracking_no kosong atau status bukan `processing`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                invalidTransition:
                  summary: Status pesanan tidak valid
                  value:
                    success: false
                    message: order can only be shipped when status is processing
                    data: null
                    errors: null
                    meta: null
                emptyTracking:
                  summary: Nomor resi kosong
                  value:
                    success: false
                    message: tracking number is required
                    data: null
                    errors: null
                    meta: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Pesanan bukan milik vendor ini.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                message: order does not belong to this vendor
                data: null
                errors: null
                meta: null
        "404":
          description: Shipment belum dibuat untuk pesanan ini.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                message: shipment not found for this order
                data: null
                errors: null
                meta: null

  /api/v1/vendors/orders/{orderId}/tracking:
    get:
      tags:
        - Vendor Kelola Order
      summary: Lacak pengiriman (tracking AWB)
      description: |
        Mengambil informasi tracking pengiriman dari Binderbyte berdasarkan nomor resi
        yang sudah diinput pada pesanan.

        Pesanan harus sudah memiliki shipment record (sudah melewati tahap ship).
      operationId: trackVendorOrderWaybill
      parameters:
        - $ref: "#/components/parameters/OrderIdParam"
      responses:
        "200":
          description: Informasi tracking berhasil diambil.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/TrackWaybillResponse"
              example:
                success: true
                message: tracking info retrieved successfully
                data:
                  delivered: false
                  summary:
                    courier_code: "jnt"
                    courier_name: "J&T Express"
                    waybill_number: "JNT0123456789"
                    service_code: "EZ"
                    waybill_date: "2026-03-01"
                    shipper_name: "Toko Mabrur"
                    receiver_name: "Ahmad Rizky"
                    origin: "Jakarta"
                    destination: "Bandung"
                    status: "ON PROCESS"
                  details:
                    waybill_number: "JNT0123456789"
                    waybill_date: "2026-03-01"
                    waybill_time: "14:30"
                    weight: "1.5"
                    origin: "Jakarta"
                    destination: "Bandung"
                    shipper_name: "Toko Mabrur"
                    shipper_address1: "Jl. Vendor No. 5"
                    shipper_address2: ""
                    shipper_address3: ""
                    shipper_city: "Jakarta"
                    receiver_name: "Ahmad Rizky"
                    receiver_address1: "Jl. Merdeka No. 10"
                    receiver_address2: ""
                    receiver_address3: ""
                    receiver_city: "Bandung"
                  delivery_status:
                    status: "ON PROCESS"
                    pod_receiver: ""
                    pod_date: ""
                    pod_time: ""
                  manifest:
                    - manifest_code: "101"
                      manifest_description: "Paket telah diterima di gudang Jakarta"
                      manifest_date: "2026-03-01"
                      manifest_time: "14:35"
                      city_name: "Jakarta"
                    - manifest_code: "301"
                      manifest_description: "Paket dalam proses pengiriman ke Bandung"
                      manifest_date: "2026-03-02"
                      manifest_time: "08:00"
                      city_name: "Jakarta"
                errors: null
                meta: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Pesanan bukan milik vendor ini.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                message: order does not belong to this vendor
                data: null
                errors: null
                meta: null
        "404":
          description: Shipment tidak ditemukan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                message: shipment not found for this order
                data: null
                errors: null
                meta: null

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT token yang diperoleh dari endpoint login vendor (`POST /api/v1/vendors/login`).
        Token berisi `vendor_id`, `user_id`, dan `role` (umkm).

  parameters:
    OrderIdParam:
      name: orderId
      in: path
      required: true
      description: UUID pesanan.
      schema:
        type: string
        format: uuid
      example: "4354c494-d5a1-4f00-b120-abcdef123456"

  responses:
    Unauthorized:
      description: Token JWT tidak valid atau tidak disertakan.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            success: false
            message: unauthorized
            data: null
            errors: null
            meta: null

  schemas:
    # --- Envelope wrappers ---
    SuccessEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          description: Response payload (varies per endpoint).
        errors:
          nullable: true
          example: null
        meta:
          nullable: true
          description: Metadata paginasi (jika ada).

    ErrorEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        data:
          nullable: true
          example: null
        errors:
          nullable: true
        meta:
          nullable: true
          example: null

    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10
        total_items:
          type: integer
          example: 25
        total_pages:
          type: integer
          example: 3

    # --- Request DTOs ---
    ShipOrderRequest:
      type: object
      required:
        - tracking_no
      properties:
        tracking_no:
          type: string
          description: Nomor resi pengiriman dari kurir.
          example: "JNT0123456789"

    # --- Response DTOs ---
    VendorOrderListItem:
      type: object
      properties:
        order_id:
          type: string
          format: uuid
          description: UUID pesanan.
        order_no:
          type: string
          description: Nomor pesanan yang mudah dibaca.
          example: "ORD-20260301-ABC1"
        order_date:
          type: string
          format: date-time
          description: Tanggal pesanan dibuat.
        customer_name:
          type: string
          description: Nama customer yang memesan.
          example: "Ahmad Rizky"
        items:
          type: array
          description: Daftar item produk dalam pesanan.
          items:
            $ref: "#/components/schemas/VendorOrderProductItem"
        total_payment:
          type: number
          format: double
          description: Total pembayaran pesanan.
          example: 325000
        status:
          type: string
          description: Status pesanan saat ini.
          enum:
            - paid
            - processing
            - shipped
            - delivered
            - completed
            - canceled
          example: "paid"

    VendorOrderProductItem:
      type: object
      properties:
        product_name:
          type: string
          description: Nama produk.
          example: "Kain Ihram Premium"
        selected_variant:
          type: string
          description: Varian yang dipilih customer.
          example: "Putih - L"
        qty:
          type: integer
          description: Jumlah item.
          example: 2
        unit_price:
          type: number
          format: double
          description: Harga satuan.
          example: 150000
        line_total:
          type: number
          format: double
          description: Total harga baris (qty × unit_price).
          example: 300000

    VendorOrderDetailResponse:
      type: object
      description: Detail pesanan vendor (nested structure).
      properties:
        shipping:
          type: object
          properties:
            courier:
              type: string
              example: "anteraja"
            tracking_number:
              type: string
              example: "11002960818873"
            status:
              type: string
              example: "Paket dalam pengiriman"
            delivered_at:
              type: string
              format: date-time
              nullable: true
        recipient:
          type: object
          properties:
            name:
              type: string
              example: "Ahmad Rizky"
            phone:
              type: string
              example: "081234567890"
            address:
              type: object
              properties:
                street:
                  type: string
                district:
                  type: string
                city:
                  type: string
                province:
                  type: string
                postal_code:
                  type: string
        store:
          type: object
          properties:
            name:
              type: string
              example: "Toko Umroh"
        items:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              variant:
                type: string
              price:
                type: number
                format: double
              quantity:
                type: integer
              subtotal:
                type: number
                format: double
        payment:
          type: object
          properties:
            method:
              type: string
              description: Metode pembayaran (dari kolom payment_method di tabel payment_invoices).
              example: "QRIS"
            total_amount:
              type: number
              format: double
              example: 325000
        order:
          type: object
          properties:
            order_number:
              type: string
              example: "ORD-20260301-ABC1"
            order_time:
              type: string
              format: date-time
            payment_time:
              type: string
              format: date-time
              nullable: true
            shipping_time:
              type: string
              format: date-time
              nullable: true
            delivered_time:
              type: string
              format: date-time
              nullable: true
        summary:
          type: object
          properties:
            items_total:
              type: number
              format: double
              description: Subtotal produk.
              example: 300000
            shipping_fee:
              type: number
              format: double
              description: Ongkos kirim.
              example: 15000
            service_fee:
              type: number
              format: double
              description: Biaya layanan (platform fee).
              example: 10000
            grand_total:
              type: number
              format: double
              description: Total yang dibayar customer.
              example: 325000

    AcceptRejectOrderResponse:
      type: object
      properties:
        order_id:
          type: string
          format: uuid
        order_status:
          type: string
          description: Status baru pesanan setelah aksi.
          enum:
            - processing
            - canceled
        updated_at:
          type: string
          format: date-time

    ShipOrderResponse:
      type: object
      properties:
        order_id:
          type: string
          format: uuid
        order_status:
          type: string
          example: "shipped"
        tracking_no:
          type: string
          description: Nomor resi yang diinput.
          example: "JNT0123456789"
        courier_code:
          type: string
          description: Kode kurir dari shipment yang sudah ada.
          example: "jnt"
        shipped_at:
          type: string
          format: date-time
          description: Waktu pengiriman.

    TrackWaybillResponse:
      type: object
      properties:
        delivered:
          type: boolean
          description: Apakah paket sudah terkirim.
          example: false
        summary:
          $ref: "#/components/schemas/TrackWaybillSummary"
        details:
          $ref: "#/components/schemas/TrackWaybillDetails"
        delivery_status:
          $ref: "#/components/schemas/TrackDeliveryStatus"
        manifest:
          type: array
          description: Daftar event/manifest tracking.
          items:
            $ref: "#/components/schemas/TrackManifestItem"

    TrackWaybillSummary:
      type: object
      properties:
        courier_code:
          type: string
          example: "jnt"
        courier_name:
          type: string
          example: "J&T Express"
        waybill_number:
          type: string
          example: "JNT0123456789"
        service_code:
          type: string
          example: "EZ"
        waybill_date:
          type: string
          example: "2026-03-01"
        shipper_name:
          type: string
          example: "Toko Mabrur"
        receiver_name:
          type: string
          example: "Ahmad Rizky"
        origin:
          type: string
          example: "Jakarta"
        destination:
          type: string
          example: "Bandung"
        status:
          type: string
          example: "ON PROCESS"

    TrackWaybillDetails:
      type: object
      properties:
        waybill_number:
          type: string
        waybill_date:
          type: string
        waybill_time:
          type: string
        weight:
          type: string
        origin:
          type: string
        destination:
          type: string
        shipper_name:
          type: string
        shipper_address1:
          type: string
        shipper_address2:
          type: string
        shipper_address3:
          type: string
        shipper_city:
          type: string
        receiver_name:
          type: string
        receiver_address1:
          type: string
        receiver_address2:
          type: string
        receiver_address3:
          type: string
        receiver_city:
          type: string

    TrackDeliveryStatus:
      type: object
      properties:
        status:
          type: string
          example: "ON PROCESS"
        pod_receiver:
          type: string
          example: ""
        pod_date:
          type: string
          example: ""
        pod_time:
          type: string
          example: ""

    TrackManifestItem:
      type: object
      properties:
        manifest_code:
