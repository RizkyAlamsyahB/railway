  /api/v1/users/orders/{orderId}:
    get:
      tags:
        - Orders
      summary: Detail Pesanan
      description: |
        Mengembalikan detail lengkap pesanan termasuk:
        - **Informasi pengiriman** (kurir, no resi, status) — `shipping`
        - **Alamat penerima** (nama, telepon, alamat lengkap) — `address`
        - **Informasi toko** (nama toko, vendor ID, owner user ID untuk chat) — `store`
        - **Daftar item** (nama produk, varian, harga, qty, subtotal) — `items`
        - **Informasi pembayaran** (metode, invoice ID) — `payment`
        - **Metadata order** (nomor order, status, payment status, tanggal-tanggal) — `order`
        - **Ringkasan biaya** (subtotal, ongkir, biaya layanan, grand total) — `summary`
        - **Aksi yang tersedia** (can_cancel, can_complete, can_review, can_refund, dll) — `actions`
        - **Informasi refund** (jika ada refund terkait order) — `refund`

        Field `actions` menentukan tombol/aksi yang ditampilkan di client:
        - `can_cancel` → tombol "Batalkan"
        - `can_complete` → tombol "Pesanan Diterima"
        - `can_review` → tombol "Beri Review"
