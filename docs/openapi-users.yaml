  /api/v1/users/orders/{orderId}/cancel:
    post:
      tags:
        - Orders
      summary: Batalkan Pesanan
      description: |
        Membatalkan pesanan customer. Endpoint ini mengubah status order menjadi `canceled`,
        mengembalikan stok produk, dan otomatis mem-proses refund jika order sudah dibayar.

        **Status yang diizinkan untuk dibatalkan:**
        - `pending_payment` — belum dibayar, langsung dibatalkan tanpa refund.
        - `paid` — sudah dibayar, otomatis buat refund.
        - `processing` — sedang diproses vendor, otomatis buat refund.

        **Status yang TIDAK bisa dibatalkan:**
        - `packed`, `shipped`, `received`, `completed`, `canceled`, `refunded`

        **Auto-refund logic (jika `payment_status = paid`):**
        - **QR / E-Wallet** → refund langsung dikirim ke Xendit Refund API,
          status refund: `processing`, method: `gateway`.
        - **VA / Bank Transfer** → buat record refund dengan status `awaiting_destination`,
          method: `disbursement`. Customer harus pilih rekening tujuan via
          `POST /api/v1/users/orders/:orderId/refunds/destination`.

        **Side effects:**
        1. Status order → `canceled`
        2. Stok produk dikembalikan (restore stock)
        3. Record `order_status_history` dibuat dengan notes "Order canceled by customer"
        4. Record refund dibuat (jika sudah dibayar)
      operationId: cancelCustomerOrder
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrderIDParam"
      responses:
        "200":
          description: Order berhasil dibatalkan.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessCancelOrderEnvelope"
              examples:
                cancelUnpaid:
                  summary: Batalkan pesanan yang belum dibayar
                  value:
                    success: true
                    message: "order canceled successfully"
                    data:
                      order_id: "11111111-2222-3333-4444-555555555555"
                      order_status: canceled
                      canceled_at: "2026-03-06T09:10:00Z"
                      refund_info: null
                    errors: null
                    meta: null
                cancelPaidVA:
                  summary: Batalkan pesanan yang sudah dibayar (VA/Bank Transfer)
                  value:
                    success: true
                    message: "order canceled successfully"
                    data:
                      order_id: "11111111-2222-3333-4444-555555555555"
                      order_status: canceled
                      canceled_at: "2026-03-06T09:10:00Z"
                      refund_info:
                        refund_id: "aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee"
                        refund_method: disbursement
                        status: awaiting_destination
                        message: "Silakan pilih rekening tujuan untuk refund"
                    errors: null
                    meta: null
                cancelPaidEWallet:
                  summary: Batalkan pesanan yang sudah dibayar (QR/E-Wallet)
                  value:
                    success: true
                    message: "order canceled successfully"
                    data:
                      order_id: "11111111-2222-3333-4444-555555555555"
                      order_status: canceled
                      canceled_at: "2026-03-06T09:10:00Z"
                      refund_info:
                        refund_id: "aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee"
                        refund_method: gateway
                        status: processing
                        message: "Refund sedang diproses melalui metode pembayaran asal"
                    errors: null
                    meta: null
        "400":
          description: |
            Request tidak valid. Kemungkinan:
            - ID order bukan UUID valid
            - Status order tidak bisa dibatalkan (`order can only be canceled when status is pending_payment, paid, or processing`)
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                invalidOrderID:
                  summary: ID order tidak valid
                  value:
                    success: false
                    message: "invalid order id"
                    data: null
                    errors: null
                    meta: null
                invalidTransition:
                  summary: Status order tidak bisa dibatalkan
                  value:
                    success: false
                    message: "order can only be canceled when status is pending_payment, paid, or processing"
                    data: null
                    errors: null
                    meta: null
        "401":
          description: Token tidak diberikan, tidak valid, atau sudah expired.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Order bukan milik customer atau role tidak diizinkan.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                message: "order does not belong to this user"
                data: null
                errors: null
                meta: null
        "404":
          description: Order tidak ditemukan.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
