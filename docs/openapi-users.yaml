      properties:
        refund_id:
          type: string
          format: uuid
          example: "aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee"
        refund_method:
          type: string
          description: |
            Metode refund yang digunakan:
            - `gateway` — refund otomatis via Xendit (QR/E-Wallet)
            - `disbursement` — transfer manual ke rekening customer (VA/Bank Transfer)
          enum: [gateway, disbursement]
          example: disbursement
        status:
          type: string
          description: |
            Status refund:
            - `processing` — sedang diproses via gateway
            - `awaiting_destination` — menunggu customer pilih rekening tujuan
          enum: [processing, awaiting_destination]
          example: awaiting_destination
