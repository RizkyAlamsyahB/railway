          description: Permintaan refund berhasil dibuat.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessCreateOrderRefundEnvelope"
              example:
                success: true
                message: "refund request created"
                data:
                  refund_id: "aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee"
                  order_id: "11111111-2222-3333-4444-555555555555"
                  status: requested
                  amount: 113000
                  return_reason_id: 1
                  reason: "Barang tidak sesuai deskripsi"
                  description: "Barang tidak sesuai deskripsi"
                  destination_channel_code: "ID_BNI"
                  destination_bank_name: "BNI"
                  destination_account_holder_name: "RIZKY ALAMSYAH"
                  destination_account_number_last4: "7890"
                  image_urls:
                    - "https://storage.example.com/refund-evidence/abc123.jpg"
                  requested_at: "2026-04-02T08:30:00Z"
                errors: null
                meta: null
        "400":
          description: Request tidak valid (validasi gagal atau alasan tidak ditemukan).
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                validationFailed:
                  summary: Validasi body gagal
                  value:
                    success: false
                    message: "Invalid request body"
                    data: null
                    errors: "Key: 'CreateOrderRefundRequest.ReturnReasonID' Error:Field validation for 'ReturnReasonID' failed on the 'required' tag"
                    meta: null
                reasonNotFound:
                  summary: Alasan pengembalian tidak ditemukan
                  value:
                    success: false
                    message: "return reason not found"
                    data: null
                    errors: null
                    meta: null
                destinationRequired:
                  summary: Rekening tujuan wajib diisi
                  value:
                    success: false
                    message: "destination account data is required for disbursement refund"
                    data: null
                    errors: null
                    meta: null
                tooManyImages:
                  summary: Terlalu banyak gambar bukti
                  value:
                    success: false
                    message: "maximum 5 images for refund evidence"
                    data: null
                    errors: null
                    meta: null
        "401":
          description: Token tidak diberikan, tidak valid, atau sudah expired.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
