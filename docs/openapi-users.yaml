  /api/v1/users/checkout:
    post:
      tags:
        - Checkout
      summary: Checkout Cart
      description: |
        Melakukan checkout hanya untuk item yang sedang dipilih (`is_selected = true`) pada cart aktif customer yang sedang login.
        Endpoint ini akan membuat order per vendor, lalu membuat invoice Xendit untuk setiap order.

        **Alur checkout:**
        1. Backend mengambil cart aktif milik user dari JWT.
        2. Backend mengambil hanya item cart yang `is_selected = true`.
        3. Backend memvalidasi semua item terpilih (variant aktif, product published, stok mencukupi).
        4. Item terpilih dikelompokkan per vendor.
        5. Untuk setiap vendor:
           - Order dibuat dengan status `pending_payment`.
           - Invoice Xendit dibuat atas nama sub-account vendor.
           - `invoice_url` disimpan dan dikembalikan ke client.
        6. Jika sukses, item terpilih yang berhasil diproses dihapus dari cart aktif.

        **Catatan penting:**
        - Satu checkout dapat menghasilkan lebih dari satu order (multi-vendor).
        - Item cart yang tidak dipilih tidak ikut di-checkout dan tetap berada di cart aktif.
        - Request body wajib berisi `address_id` dan `shipping_choices`.
        - `shipping_choices` harus berisi pilihan kurir untuk setiap vendor yang muncul pada hasil endpoint preview item terpilih.
        - Ongkir tidak diterima dari client; backend menghitung ulang ongkir berdasarkan `courier_code` dan `service` yang dipilih.
        - Response berisi URL invoice Xendit yang bisa langsung dipakai customer untuk pembayaran.
      operationId: checkoutCart
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutRequest"
            example:
              address_id: "7d2e9f31-09af-4d49-adf3-47bb2b9e2010"
              shipping_choices:
                - vendor_id: "aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee"
                  courier_code: "jne"
                  service: "REG"
              notes: "Tolong kirim di jam kerja."
      responses:
        "201":
          description: Checkout berhasil. Order dan invoice pembayaran berhasil dibuat.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessCheckoutEnvelope"
              example:
                success: true
                message: "checkout successful"
                data:
                  orders:
                    - order_id: "11111111-2222-3333-4444-555555555555"
                      order_no: "ORD-20260225-A1B2C3D4"
                      vendor_id: "aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee"
                      vendor_name: "Oleh-Oleh Madinah Store"
                      subtotal: 200000
                      shipping_fee: 11000
                      platform_fee: 6000
                      grand_total: 217000
                      invoice_url: "https://checkout.xendit.co/web/67bdcf2a553f2f5bc7f84f11"
                      expires_at: "2026-02-26T10:30:00Z"
                errors: null
                meta: null
        "400":
          description: Request tidak valid (misalnya body tidak lengkap, tidak ada item cart yang dipilih, atau user ID tidak valid pada context auth).
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                noSelectedItems:
                  summary: Tidak ada item cart yang dipilih
                  value:
                    success: false
                    message: "no selected cart items"
                    data: null
                    errors: null
                    meta: null
                invalidUserIDInToken:
                  summary: User ID tidak valid di token
                  value:
                    success: false
                    message: "invalid user ID in token"
                    data: null
                    errors: null
                    meta: null
                invalidRequestBody:
                  summary: Body checkout tidak lengkap
                  value:
                    success: false
                    message: "invalid request body"
                    data: null
                    errors: "Key: 'CheckoutRequest.AddressID' Error:Field validation for 'AddressID' failed on the 'required' tag\nKey: 'CheckoutRequest.ShippingChoices' Error:Field validation for 'ShippingChoices' failed on the 'required' tag"
                    meta: null
        "401":
          description: Token tidak diberikan, tidak valid, atau sudah expired.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                missingHeader:
                  summary: Header Authorization tidak ada
                  value:
                    success: false
                    message: "missing authorization header"
                    data: null
                    errors: null
                    meta: null
                invalidToken:
                  summary: Token tidak valid atau expired
                  value:
                    success: false
                    message: "invalid or expired token"
                    data: null
                    errors: null
                    meta: null
        "403":
          description: User tidak memiliki role yang diizinkan (bukan customer).
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                message: "insufficient permissions"
                data: null
                errors: null
                meta: null
        "409":
          description: Checkout gagal karena konflik data cart/item (item unavailable atau stok tidak mencukupi).
          headers:
