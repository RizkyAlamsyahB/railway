              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/users/orders/{orderId}/refunds:
    post:
      tags:
        - Refunds
      summary: Ajukan Pengembalian Dana
      description: |
        Membuat permintaan pengembalian dana (refund) untuk order yang sudah diterima.
        Customer harus menyertakan alasan pengembalian, rekening tujuan, dan bukti foto/video opsional.

        **Syarat order eligible:**
        - Order milik customer yang login.
        - Status order memenuhi syarat refund (biasanya `completed` atau `received`).
        - Belum ada refund request terbuka untuk order ini.

        **Upload bukti:**
        - Gunakan `POST /api/v1/users/orders/:orderId/refunds/evidence/presign` untuk mendapatkan presigned upload URL.
        - Upload file, lalu kirim `object_key` yang didapat ke field `image_object_keys` atau `video_object_key`.
        - Maksimal 5 gambar dan 1 video.

        **Rekening tujuan:**
        - `destination_channel_code`: kode channel bank (contoh: `ID_BCA`, `ID_BNI`).
          Jika tidak diisi, default `ID_BCA`.
        - `destination_bank_name`, `destination_account_number`, `destination_account_holder_name` wajib diisi.
      operationId: requestOrderRefund
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrderIDParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRefundRequest"
            example:
              return_reason_id: 1
              description: "Barang tidak sesuai deskripsi"
              destination_channel_code: "ID_BNI"
              destination_bank_name: "BNI"
              destination_account_number: "1234567890"
              destination_account_holder_name: "RIZKY ALAMSYAH"
              image_object_keys:
                - "refund-evidence/abc123.jpg"
              video_object_key: null
      responses:
