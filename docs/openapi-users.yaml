  /api/v1/users/orders/{orderId}/refunds/destination:
    post:
      tags:
        - Refunds
      summary: Kirim Tujuan Refund
      description: |
        Mengirimkan data rekening tujuan untuk refund yang berstatus `awaiting_destination`.
        Flow ini terjadi ketika:
        1. Customer membatalkan order yang dibayar via VA/Bank Transfer.
        2. Auto-refund membuat record dengan status `awaiting_destination`.
        3. Customer membuka modal "Pilih Tujuan Refund".
        4. Customer memilih rekening tersimpan (`user_bank_account_id`) atau input manual.
        5. Submit via endpoint ini.

        **Pilihan input:**
        - Kirim `user_bank_account_id` untuk menggunakan rekening tersimpan.
        - ATAU kirim `destination_channel_code`, `destination_bank_name`,
          `destination_account_number`, `destination_account_holder_name` secara manual.
        - Set `save_bank_account: true` untuk menyimpan rekening manual untuk penggunaan berikutnya.
      operationId: submitRefundDestination
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrderIDParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitRefundDestinationRequest"
            examples:
              useSavedAccount:
                summary: Gunakan rekening tersimpan
                value:
                  user_bank_account_id: "4d4f8b5d-7b19-4b7d-bfe4-fc2f43c9d8bb"
                  save_bank_account: false
              useManualAccount:
                summary: Input rekening manual + simpan
                value:
                  destination_channel_code: "ID_BCA"
                  destination_bank_name: "BCA"
                  destination_account_number: "1234567890"
                  destination_account_holder_name: "John Doe"
                  save_bank_account: true
      responses:
        "200":
          description: Tujuan refund berhasil dikirim.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessSubmitRefundDestinationEnvelope"
              example:
                success: true
                message: "refund destination submitted"
                data:
                  refund_id: "aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee"
                  status: requested
                  message: "Tujuan refund berhasil disimpan, menunggu proses finance"
                errors: null
                meta: null
        "400":
          description: Request tidak valid (data rekening tidak lengkap).
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Token tidak diberikan, tidak valid, atau sudah expired.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Order bukan milik customer atau role tidak diizinkan.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Order atau refund tidak ditemukan.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Internal server error.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

