openapi: 3.0.3
info:
  title: Haji Umroh Store BE - Users API
  version: 1.0.0
  description: Dokumentasi OpenAPI 3 untuk endpoint user/customer, termasuk pendaftaran, verifikasi email, login, profil user, checkout cart, complete order, dan review produk.
servers:
  - url: http://localhost:8080
    description: Local development server
tags:
  - name: OTP
    description: Operasi request dan verifikasi OTP modular.
  - name: User Registration
    description: Operasi pendaftaran customer baru dan verifikasi email.
  - name: User Authentication
    description: Operasi autentikasi user (login).
  - name: User Profile
    description: Operasi profil user yang memerlukan autentikasi.
  - name: Checkout
    description: Operasi checkout cart customer dan pembuatan invoice pembayaran Xendit.
  - name: Orders
    description: Operasi lifecycle order oleh customer.
  - name: Reviews
    description: Operasi review produk oleh customer (presign gambar dan submit review).
paths:
  /api/v1/order-statuses:
    get:
      tags:
        - Orders
      summary: Ambil daftar status order yang didukung sistem
      description: |
        Mengembalikan daftar status order yang valid untuk kebutuhan filter di client.
        Endpoint ini bersifat public (tanpa autentikasi).
      operationId: listOrderStatuses
      security: []
      responses:
        '200':
          description: Daftar status order berhasil dimuat.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessOrderStatusesEnvelope'
              example:
                success: true
                message: "order statuses loaded"
                data:
                  - pending_payment
                  - paid
                  - processing
                  - packed
                  - shipped
                  - received
                  - completed
                  - canceled
                  - refunded
                errors: null
                meta: null
        '500':
          description: Internal server error.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: "internal server error"
                data: null
                errors: null
                meta: null

  /api/v1/otp/request:
    post:
      tags:
        - OTP
      summary: Membuat dan mengirim OTP ke email
      description: |
        Membuat OTP baru untuk `purpose` tertentu dan mengirimkannya ke email tujuan.
        Endpoint ini berdiri sendiri dan belum terhubung ke flow registrasi atau reset password existing.
      operationId: requestOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestOTPRequest'
            example:
              email: ahmad.fauzi@example.com
              purpose: email_verification
      responses:
        '201':
          description: OTP berhasil dibuat dan dikirim.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessRequestOTPEnvelope'
        '400':
          description: Request tidak valid.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Request OTP terlalu cepat.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/otp/verify:
    post:
      tags:
        - OTP
      summary: Verifikasi OTP dan keluarkan proof token
      description: |
        Memverifikasi OTP berdasarkan kombinasi `email`, `purpose`, dan `code`.
        Jika sukses, endpoint mengembalikan proof token khusus OTP untuk dipakai di flow lanjutan.
      operationId: verifyOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOTPRequest'
            example:
              email: ahmad.fauzi@example.com
              purpose: forgot_password
              code: "123456"
      responses:
        '200':
          description: OTP valid dan proof token berhasil diterbitkan.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessVerifyOTPEnvelope'
        '400':
          description: OTP invalid, expired, atau request tidak valid.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Jumlah percobaan OTP melebihi batas.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/users/register:
    post:
      tags:
        - User Registration
      summary: Mendaftarkan customer baru
      description: |
        Membuat akun user baru dengan role `customer` dan status `pending`.
        Setelah registrasi berhasil, sistem akan mengirimkan email berisi link verifikasi
        ke alamat email yang didaftarkan.

        **Alur registrasi:**
        1. Client mengirim data registrasi (nama, telepon, email, password).
        2. Sistem memvalidasi keunikan email dan nomor telepon.
        3. Akun dibuat dengan status `pending`.
        4. Email verifikasi dikirim otomatis.
        5. User harus klik link verifikasi untuk mengaktifkan akun.

        **Aturan:**
        - Email harus unik (belum terdaftar).
        - Nomor telepon harus unik (belum terdaftar).
        - Password minimal 8 karakter.
        - Link verifikasi berlaku selama **24 jam**.
      operationId: registerCustomer
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterCustomerRequest'
            example:
              full_name: Ahmad Fauzi
              phone: "081234567890"
              email: ahmad.fauzi@example.com
              password: SecurePass123!
      responses:
        '201':
          description: Customer berhasil didaftarkan. Email verifikasi telah dikirim.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessRegisterEnvelope'
              example:
                success: true
                message: "Registration successful. Please check your email to verify your account."
                data:
                  user_id: 7d2e9f31-09af-4d49-adf3-47bb2b9e2010
                  email: ahmad.fauzi@example.com
                  message: "Registration successful. Please check your email to verify your account."
                errors: null
                meta: null
        '400':
          description: Request tidak valid (validasi gagal).
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                missingFullName:
                  summary: Nama lengkap wajib diisi
                  value:
                    success: false
                    message: "Invalid request body"
                    data: null
                    errors: "Key: 'RegisterCustomerRequest.FullName' Error:Field validation for 'FullName' failed on the 'required' tag"
                    meta: null
                missingEmail:
                  summary: Email wajib diisi
                  value:
                    success: false
                    message: "Invalid request body"
                    data: null
                    errors: "Key: 'RegisterCustomerRequest.Email' Error:Field validation for 'Email' failed on the 'required' tag"
                    meta: null
                invalidEmail:
                  summary: Format email tidak valid
                  value:
                    success: false
                    message: "Invalid request body"
                    data: null
                    errors: "Key: 'RegisterCustomerRequest.Email' Error:Field validation for 'Email' failed on the 'email' tag"
                    meta: null
                passwordTooShort:
                  summary: Password kurang dari 8 karakter
                  value:
                    success: false
                    message: "Invalid request body"
                    data: null
                    errors: "Key: 'RegisterCustomerRequest.Password' Error:Field validation for 'Password' failed on the 'min' tag"
                    meta: null
                missingPhone:
                  summary: Nomor telepon wajib diisi
                  value:
                    success: false
                    message: "Invalid request body"
                    data: null
                    errors: "Key: 'RegisterCustomerRequest.Phone' Error:Field validation for 'Phone' failed on the 'required' tag"
                    meta: null
        '409':
          description: Konflik — email atau nomor telepon sudah terdaftar.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                emailAlreadyRegistered:
                  summary: Email sudah terdaftar
                  value:
                    success: false
                    message: email already registered
                    data: null
                    errors: null
                    meta: null
                phoneAlreadyRegistered:
                  summary: Nomor telepon sudah terdaftar
                  value:
                    success: false
                    message: phone number already registered
                    data: null
                    errors: null
                    meta: null
        '500':
          description: Internal server error.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: "An unexpected error occurred"
                data: null
                errors: null
                meta: null

  /api/v1/users/verify-email:
    get:
      tags:
        - User Registration
      summary: Verifikasi email customer
      description: |
        Memverifikasi alamat email customer menggunakan token yang dikirim via email.
        Endpoint ini dipanggil ketika user mengklik link verifikasi di email.

        **Alur verifikasi:**
        1. User klik link verifikasi di email (link mengarah ke endpoint ini).
        2. Backend memvalidasi token (decode, hash, cek keberadaan, dan cek expiry).
        3. Jika valid, status user berubah dari `pending` menjadi `active`.
        4. Token ditandai sebagai consumed (tidak dapat digunakan lagi).
        5. User di-redirect ke halaman frontend berdasarkan hasil verifikasi.

        **Redirect URL:**
        - Sukses: `{FRONTEND_URL}/verify-email?status=success`
        - Token kosong: `{FRONTEND_URL}/verify-email?status=failed&reason=missing_token`
        - Token invalid/expired: `{FRONTEND_URL}/verify-email?status=failed&reason=invalid_or_expired`
        - Error lainnya: `{FRONTEND_URL}/verify-email?status=failed&reason=invalid_token`

        **Catatan:** Endpoint ini tidak mengembalikan JSON response, melainkan melakukan HTTP redirect (302 Found).
      operationId: verifyEmail
      security: []
      parameters:
        - name: token
          in: query
          required: true
          description: Token verifikasi yang dikirim melalui email (base64url encoded).
          schema:
            type: string
          example: dGhpcyBpcyBhIHNhbXBsZSB0b2tlbiB2YWx1ZQ==
      responses:
        '302':
          description: |
            Redirect ke halaman frontend. Lokasi redirect tergantung hasil verifikasi:
            - **Sukses** → `{FRONTEND_URL}/verify-email?status=success`
            - **Gagal (token kosong)** → `{FRONTEND_URL}/verify-email?status=failed&reason=missing_token`
            - **Gagal (token invalid/expired)** → `{FRONTEND_URL}/verify-email?status=failed&reason=invalid_or_expired`
            - **Gagal (error lainnya)** → `{FRONTEND_URL}/verify-email?status=failed&reason=invalid_token`
          headers:
            Location:
              description: URL tujuan redirect di frontend.
              schema:
                type: string
                example: https://app.example.com/verify-email?status=success

  /api/v1/users/resend-verification:
    post:
      tags:
        - User Registration
      summary: Kirim ulang email verifikasi
      description: |
        Mengirim ulang email verifikasi ke alamat email yang didaftarkan.
        Endpoint ini dirancang untuk keamanan — response selalu sukses meskipun email tidak ditemukan
        (untuk mencegah enumerasi email).

        **Aturan:**
        - User harus berstatus `pending` (belum diverifikasi).
        - Terdapat cooldown **1 menit** antara setiap permintaan kirim ulang.
        - Token verifikasi lama akan di-invalidate sebelum token baru dibuat.
        - Link verifikasi baru berlaku selama **24 jam**.

        **Perilaku khusus:**
        - Jika email tidak ditemukan → response tetap sukses (keamanan).
        - Jika user sudah aktif → error 409 (Conflict).
        - Jika user bukan status `pending` → error 400 (Bad Request).
        - Jika request terlalu cepat (< 1 menit) → error 429 (Too Many Requests).
      operationId: resendVerification
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendVerificationRequest'
            example:
              email: ahmad.fauzi@example.com
      responses:
        '200':
          description: Permintaan kirim ulang diterima. Jika email terdaftar dan masih pending, email verifikasi baru telah dikirim.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResendVerificationEnvelope'
              example:
                success: true
                message: "If your email is registered and pending verification, a new verification email has been sent."
                data: null
                errors: null
                meta: null
        '400':
          description: Request tidak valid (validasi gagal atau user bukan status pending).
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                missingEmail:
                  summary: Email wajib diisi
                  value:
                    success: false
                    message: "Invalid request body"
                    data: null
                    errors: "Key: 'ResendVerificationRequest.Email' Error:Field validation for 'Email' failed on the 'required' tag"
                    meta: null
                invalidEmailFormat:
                  summary: Format email tidak valid
                  value:
                    success: false
                    message: "Invalid request body"
                    data: null
                    errors: "Key: 'ResendVerificationRequest.Email' Error:Field validation for 'Email' failed on the 'email' tag"
                    meta: null
                userNotPending:
                  summary: User bukan status pending
                  value:
                    success: false
                    message: "user is not in pending status"
                    data: null
                    errors: null
                    meta: null
        '409':
          description: Konflik — user sudah aktif (sudah diverifikasi).
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: "user is already active"
                data: null
                errors: null
                meta: null
        '429':
          description: Terlalu banyak permintaan — silakan tunggu sebelum meminta email verifikasi lagi.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: "please wait before requesting another verification email"
                data: null
                errors: null
                meta: null
        '500':
          description: Internal server error.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: "An unexpected error occurred"
                data: null
                errors: null
                meta: null

  /api/v1/users/login:
    post:
      tags:
        - User Authentication
      summary: Login user
      description: |
        Mengautentikasi user dengan email dan password, lalu mengembalikan JWT token.

        **Syarat login:**
        - Akun harus berstatus `active`.
        - Email harus sudah diverifikasi.
        - Akun tidak boleh berstatus `blocked`.

        **JWT Claims:**
        Token yang dihasilkan berisi `user_id`, `email`, `role`, dan informasi lainnya.
        Token berlaku sesuai konfigurasi `JWT_EXPIRY_HOURS` di server.
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: ahmad.fauzi@example.com
              password: SecurePass123!
      responses:
        '200':
          description: Login berhasil. Mengembalikan JWT token dan data user.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessLoginEnvelope'
              example:
                success: true
                message: "login successful"
                data:
                  token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  user:
                    id: 7d2e9f31-09af-4d49-adf3-47bb2b9e2010
                    email: ahmad.fauzi@example.com
                    full_name: Ahmad Fauzi
                    birth_date: null
                    phone: "081234567890"
                    status: active
                    email_verified_at: "2026-02-17T07:00:00Z"
                    role: customer
                    created_at: "2026-02-17T06:30:00Z"
                    updated_at: "2026-02-17T07:00:00Z"
                errors: null
                meta: null
        '400':
          description: Request tidak valid (validasi gagal).
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                missingEmail:
                  summary: Email wajib diisi
                  value:
                    success: false
                    message: "validation failed"
                    data: null
                    errors: "Key: 'LoginRequest.Email' Error:Field validation for 'Email' failed on the 'required' tag"
                    meta: null
                missingPassword:
                  summary: Password wajib diisi
                  value:
                    success: false
                    message: "validation failed"
                    data: null
                    errors: "Key: 'LoginRequest.Password' Error:Field validation for 'Password' failed on the 'required' tag"
                    meta: null
        '401':
          description: Autentikasi gagal — kredensial salah, akun belum aktif, atau email belum diverifikasi.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                invalidCredentials:
                  summary: Email atau password salah
                  value:
                    success: false
                    message: "invalid email or password"
                    data: null
                    errors: null
                    meta: null
                accountNotActive:
                  summary: Akun belum aktif (masih pending)
                  value:
                    success: false
                    message: "account is not active"
                    data: null
                    errors: null
                    meta: null
                emailNotVerified:
                  summary: Email belum diverifikasi
                  value:
                    success: false
                    message: "email is not verified"
                    data: null
                    errors: null
                    meta: null
        '403':
          description: Akun diblokir.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: "account is blocked"
                data: null
                errors: null
                meta: null
        '500':
          description: Internal server error.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: "An unexpected error occurred"
                data: null
                errors: null
                meta: null

  /api/v1/users/me:
    get:
      tags:
        - User Profile
      summary: Ambil data profil user yang sedang login
      description: |
        Mengembalikan data profil user berdasarkan JWT token yang diberikan.
        Endpoint ini hanya bisa diakses oleh user dengan role `customer`.

        **Autentikasi:**
        - Wajib menyertakan header `Authorization: Bearer <token>`.
        - Token didapat dari endpoint login (`POST /api/v1/users/login`).
        - Hanya user dengan role `customer` yang diizinkan.
      operationId: getMe
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Data profil user berhasil diambil.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessGetMeEnvelope'
              example:
                success: true
                message: "user profile retrieved successfully"
                data:
                  id: 7d2e9f31-09af-4d49-adf3-47bb2b9e2010
                  email: ahmad.fauzi@example.com
                  full_name: Ahmad Fauzi
                  birth_date: null
                  phone: "081234567890"
                  status: active
                  email_verified_at: "2026-02-17T07:00:00Z"
                  role: customer
                  created_at: "2026-02-17T06:30:00Z"
                  updated_at: "2026-02-17T07:00:00Z"
                errors: null
                meta: null
        '401':
          description: Token tidak diberikan, tidak valid, atau sudah expired.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                missingHeader:
                  summary: Header Authorization tidak ada
                  value:
                    success: false
                    message: "missing authorization header"
                    data: null
                    errors: null
                    meta: null
                invalidToken:
                  summary: Token tidak valid atau expired
                  value:
                    success: false
                    message: "invalid or expired token"
                    data: null
                    errors: null
                    meta: null
        '403':
          description: User tidak memiliki role yang diizinkan (bukan customer).
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: "insufficient permissions"
                data: null
                errors: null
                meta: null
        '404':
          description: Data user tidak ditemukan.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: "user not found"
                data: null
                errors: null
                meta: null
        '500':
          description: Internal server error.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: "An unexpected error occurred"
                data: null
                errors: null
                meta: null

  /api/v1/users/orders:
    get:
      tags:
        - Orders
      summary: Ambil daftar order milik customer
      description: |
        Mengembalikan daftar pesanan milik customer yang sedang login.
        Mendukung filter berdasarkan status order dan pagination.
      operationId: listCustomerOrders
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          description: Filter status order (single value).
          schema:
            type: string
            enum: [pending_payment, paid, processing, packed, shipped, received, completed, canceled, refunded]
        - name: page
          in: query
          required: false
          description: Nomor halaman (default 1).
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          description: Jumlah data per halaman (default 10, maks 100).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: Daftar order berhasil dimuat.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
