openapi: 3.0.3
info:
  title: Haji Umroh Store API - Wishlist
  version: 1.0.0
  description: |
    Dokumentasi OpenAPI 3 untuk endpoint wishlist customer.
    Seluruh endpoint pada dokumen ini memerlukan autentikasi JWT dengan role `customer`.
servers:
  - url: http://localhost:8080
    description: Local development server
tags:
  - name: Wishlist
    description: Operasi wishlist customer (memerlukan autentikasi dengan role customer).
paths:
  /api/v1/users/wishlist:
    get:
      tags: [Wishlist]
      summary: Get Wishlist Items
      description: |
        Mengembalikan daftar produk dalam wishlist milik customer yang sedang login.

        Endpoint ini mendukung pagination melalui query `page` dan `limit`.
        Jika `page < 1`, sistem akan menggunakan `page = 1`.
        Jika `limit < 1` atau `limit > 100`, sistem akan menggunakan `limit = 10`.

        Field `is_available` bernilai `true` jika produk berstatus `published`.
        Field `image_url`, `price`, dan `currency` dapat bernilai `null`
        jika data turunan produk tidak tersedia.
      operationId: listWishlistItems
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          description: Nomor halaman hasil wishlist (dimulai dari 1).
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1
        - in: query
          name: limit
          description: Jumlah item per halaman (maksimum 100).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          example: 10
      responses:
        "200":
          description: Daftar wishlist berhasil diambil.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WishlistListSuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/users/wishlist/items:
    post:
      tags: [Wishlist]
      summary: Add Product to Wishlist
      description: |
        Menambahkan satu produk ke wishlist customer.

        Operasi ini idempotent terhadap pasangan `user_id + product_id`.
        Jika produk sudah ada di wishlist, request tetap sukses dan field
        `already_exists` akan bernilai `true`.

        Validasi utama:
        - `product_id` wajib berformat UUID.
        - Produk harus ada.
        - Produk harus berstatus `published`.
      operationId: addWishlistItem
      security:
        - bearerAuth: []
      requestBody:
        required: true
        description: Payload untuk menambahkan produk ke wishlist.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddWishlistItemRequest"
            example:
              product_id: "0f7f4fd6-f55f-4f38-8d3b-7acef44ef8f2"
      responses:
        "200":
          description: Produk berhasil ditambahkan ke wishlist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WishlistAddSuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/users/wishlist/products/{productId}:
    delete:
      tags: [Wishlist]
      summary: Remove Product from Wishlist
      description: |
        Menghapus satu produk dari wishlist customer.

        Operasi ini idempotent: jika item wishlist tidak ada,
        endpoint tetap mengembalikan respons sukses.
      operationId: removeWishlistItem
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: productId
          required: true
          description: ID produk yang akan dihapus dari wishlist.
          schema:
            type: string
            format: uuid
          example: "0f7f4fd6-f55f-4f38-8d3b-7acef44ef8f2"
      responses:
        "200":
          description: Produk berhasil dihapus dari wishlist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/users/wishlist/products/{productId}/status:
    get:
      tags: [Wishlist]
      summary: Check Wishlist Product Status
      description: |
        Mengecek apakah sebuah produk sudah ada di wishlist customer.

        Endpoint juga mengembalikan `is_available` untuk menunjukkan
        apakah produk saat ini berstatus `published`.
      operationId: getWishlistProductStatus
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: productId
          required: true
          description: ID produk yang ingin dicek status wishlist-nya.
          schema:
            type: string
            format: uuid
          example: "0f7f4fd6-f55f-4f38-8d3b-7acef44ef8f2"
      responses:
        "200":
          description: Status wishlist berhasil diambil.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WishlistStatusSuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token dengan format Bearer <token>.

  schemas:
    AddWishlistItemRequest:
      type: object
      description: Payload request untuk menambahkan item wishlist.
      required: [product_id]
      properties:
        product_id:
          type: string
          format: uuid
          description: ID produk yang akan ditambahkan ke wishlist.
          example: "0f7f4fd6-f55f-4f38-8d3b-7acef44ef8f2"

    WishlistItem:
      type: object
      description: Data satu item wishlist pada hasil listing.
      properties:
        product_id:
          type: string
          format: uuid
          description: ID produk.
          example: "0f7f4fd6-f55f-4f38-8d3b-7acef44ef8f2"
        product_name:
          type: string
          description: Nama produk.
          example: Sajadah Premium Madinah
        product_slug:
          type: string
          description: Slug produk untuk URL.
          example: sajadah-premium-madinah
        vendor_id:
          type: string
          format: uuid
          description: ID vendor pemilik produk.
          example: "f7b2c7bd-35b0-4ae4-a447-5e0e15f6af8e"
        vendor_name:
          type: string
          description: Nama tampilan vendor.
          example: Toko Harmoni Ibadah
        image_url:
          type: string
          nullable: true
          description: URL gambar utama produk (dapat null jika belum ada).
          example: https://cdn.example.com/products/img-001.jpg
        price:
          type: number
          format: double
          nullable: true
          description: Harga minimum variant aktif produk (dapat null).
          example: 150000
        currency:
          type: string
          nullable: true
          description: Mata uang harga produk (contoh IDR, dapat null).
          example: IDR
        is_available:
          type: boolean
          description: Bernilai true jika produk berstatus published.
          example: true
        added_at:
          type: string
          format: date-time
          description: Waktu produk ditambahkan ke wishlist.
          example: "2026-03-05T10:15:30Z"

    WishlistAddData:
      type: object
      description: Data hasil operasi tambah item ke wishlist.
      properties:
        product_id:
          type: string
          format: uuid
          description: ID produk target.
          example: "0f7f4fd6-f55f-4f38-8d3b-7acef44ef8f2"
        is_in_wishlist:
          type: boolean
          description: Menunjukkan produk ada di wishlist setelah operasi.
          example: true
        already_exists:
          type: boolean
          description: Bernilai true jika item sudah ada sebelumnya (idempotent).
          example: false

    WishlistStatusData:
      type: object
      description: Data status wishlist untuk satu produk.
      properties:
        product_id:
          type: string
          format: uuid
          description: ID produk yang dicek.
          example: "0f7f4fd6-f55f-4f38-8d3b-7acef44ef8f2"
        is_in_wishlist:
          type: boolean
          description: Bernilai true jika produk sudah ada di wishlist customer.
          example: true
        is_available:
          type: boolean
          description: Bernilai true jika produk berstatus published.
          example: true

    PaginationMeta:
      type: object
      description: Metadata pagination untuk response list.
      properties:
        page:
          type: integer
          description: Halaman saat ini.
          example: 1
        limit:
          type: integer
          description: Jumlah item per halaman.
          example: 10
        total_items:
          type: integer
          description: Total seluruh item wishlist.
          example: 24
        total_pages:
          type: integer
          description: Total jumlah halaman.
          example: 3

    WishlistListSuccessResponse:
      type: object
      description: Envelope sukses untuk endpoint list wishlist.
      properties:
        success:
          type: boolean
          description: Penanda request berhasil.
          example: true
        message:
          type: string
          description: Pesan sukses dari server.
          example: wishlist retrieved successfully
        data:
          type: array
          description: Daftar item wishlist pada halaman saat ini.
          items:
            $ref: "#/components/schemas/WishlistItem"
        errors:
          nullable: true
          description: Detail error, null jika request sukses.
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    WishlistAddSuccessResponse:
      type: object
      description: Envelope sukses untuk endpoint tambah item wishlist.
      properties:
        success:
          type: boolean
          description: Penanda request berhasil.
          example: true
        message:
          type: string
          description: Pesan sukses dari server.
          example: item added to wishlist
        data:
          $ref: "#/components/schemas/WishlistAddData"
        errors:
          nullable: true
          description: Detail error, null jika request sukses.
        meta:
          nullable: true
          description: Metadata tambahan, saat ini selalu null.

    WishlistStatusSuccessResponse:
      type: object
      description: Envelope sukses untuk endpoint status wishlist produk.
      properties:
        success:
          type: boolean
          description: Penanda request berhasil.
          example: true
        message:
          type: string
          description: Pesan sukses dari server.
          example: wishlist status retrieved successfully
        data:
          $ref: "#/components/schemas/WishlistStatusData"
        errors:
          nullable: true
          description: Detail error, null jika request sukses.
        meta:
          nullable: true
          description: Metadata tambahan, saat ini selalu null.

    SuccessResponse:
      type: object
      description: Envelope sukses untuk operasi yang tidak mengembalikan data.
      properties:
        success:
          type: boolean
          description: Penanda request berhasil.
          example: true
        message:
          type: string
          description: Pesan sukses dari server.
          example: item removed from wishlist
        data:
          nullable: true
          description: Data payload, null untuk endpoint ini.
        errors:
          nullable: true
          description: Detail error, null jika request sukses.
        meta:
          nullable: true
          description: Metadata tambahan, saat ini selalu null.

    ErrorResponse:
      type: object
      description: Envelope standar untuk response error.
      properties:
        success:
          type: boolean
          description: Selalu false pada response error.
          example: false
        message:
          type: string
          description: Pesan error utama.
          example: validation failed
        data:
          nullable: true
          description: Data payload, umumnya null pada response error.
        errors:
          nullable: true
          description: Detail validasi atau error tambahan.
        meta:
          nullable: true
          description: Metadata tambahan, umumnya null.

  responses:
    BadRequest:
      description: Request tidak valid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            message: validation failed
            data: null
            errors: product_id is required
            meta: null

    Unauthorized:
      description: Token tidak valid, expired, atau tidak diberikan.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            message: invalid or expired token
            data: null
            errors: null
            meta: null

    Forbidden:
      description: User bukan role customer.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            message: insufficient permissions
            data: null
            errors: null
            meta: null

    NotFound:
      description: Resource tidak ditemukan.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            message: product not found
            data: null
            errors: null
            meta: null

    InternalServerError:
      description: Terjadi kesalahan internal server.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            message: internal server error
            data: null
            errors: null
            meta: null
