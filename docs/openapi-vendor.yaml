      description: |
        Endpoint callback dari Xendit untuk update status payout vendor withdrawal.

        **Catatan penting:**
        - Endpoint ini public (tanpa JWT), diverifikasi menggunakan header `x-callback-token`.
        - `data.reference_id` harus berisi UUID internal `vendor_withdrawals.id`.
        - Handler bersifat idempotent untuk event duplicate/retry.
        - Untuk event `payout.reversed`, sistem otomatis rollback saldo (sesuai kebijakan bisnis saat ini).
      operationId: xenditPayoutWebhook
      security: []
      parameters:
        - in: header
          name: x-callback-token
          required: true
          schema:
            type: string
          description: Token verifikasi webhook dari Xendit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/XenditPayoutWebhookPayload'
            example:
              business_id: 62c589ea1f995274c6fd8f47
              event: payout.succeeded
              data:
                id: p-out-f1f6b6a7-c307-4ea8-b650-7499888cf646
                reference_id: c1d2e3f4-a5b6-7890-cdef-1234567890ab
                amount: 100000
                currency: IDR
                status: SUCCEEDED
                channel_code: ID_BCA
                failure_code: ""
                created: '2024-09-01T07:50:46.013124437Z'
                updated: '2024-09-01T07:52:10.012531923Z'
      responses:
        '200':
          description: Webhook diterima dan diproses (termasuk no-op/idempotent).
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/XenditWebhookResponse'
              examples:
                processed:
                  summary: Berhasil diproses
                  value:
                    message: webhook processed
                processedWithErrors:
                  summary: Diterima tapi ada error bisnis/internal
                  value:
                    message: webhook received with errors
                    error: failed to apply payout webhook update
        '400':
          description: Payload tidak valid.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/XenditWebhookResponse'
              example:
                message: invalid payload
        '401':
          description: Callback token tidak valid.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/XenditWebhookResponse'
              example:
                message: invalid callback token
components:
