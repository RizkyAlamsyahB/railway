          type: string
          format: email
          example: toko.mabrur@example.com
        code:
          type: string
          example: "123456"
    VendorVerifyRegistrationOTPResponse:
      type: object
      required:
        - email_token
      properties:
        email_token:
          type: string
          description: JWT khusus email verification untuk step register vendor berikutnya.
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
    VendorRegistrationPasswordRequest:
      type: object
      required:
        - password
      properties:
        password:
          type: string
