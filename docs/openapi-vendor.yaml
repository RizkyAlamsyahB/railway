          description: |
            Presigned URL untuk upload file langsung ke S3 via HTTP PUT.
            Berlaku selama 30 menit. Gunakan `Content-Type` sesuai MIME file yang diunggah.
            MIME yang diizinkan: `image/jpeg`, `image/png`, `image/webp`, `application/pdf`.
          example: https://s3.ap-southeast-1.amazonaws.com/bucket/vendors/.../documents/owner_document_id/uuid?X-Amz-...
        object_key:
          type: string
          description: Object key di S3 storage. Simpan key ini untuk referensi saat mengkonfirmasi upload dokumen.
          example: vendors/a1b2c3d4-e5f6-7890-abcd-ef1234567890/documents/owner_document_id/f1e2d3c4-b5a6-7890-abcd-ef1234567890
