openapi: 3.0.3
info:
  title: Haji Umroh Store BE - Vendor API
  version: 1.0.0
  description: Dokumentasi OpenAPI 3 untuk endpoint vendor/seller (UMKM), termasuk pendaftaran, autentikasi, dokumen, dan manajemen produk.
servers:
  - url: http://localhost:8080
    description: Local development server
tags:
  - name: Vendor Registration
    description: Operasi pendaftaran UMKM baru.
  - name: Vendor Auth
    description: Autentikasi vendor.
  - name: Vendor Documents
    description: Manajemen dokumen vendor.
  - name: Vendor Products
    description: Manajemen produk vendor.
  - name: Vendor Balance
    description: Operasi saldo dan penarikan vendor (Tokopedia-style self-service).
  - name: Xendit Webhook
    description: Endpoint callback webhook dari Xendit.
paths:
  /api/v1/vendors/register/request-otp:
    post:
      tags:
        - Vendor Registration
      summary: Kirim OTP email untuk registrasi vendor
      description: Memulai flow onboarding vendor dengan mengirim OTP ke email vendor.
      operationId: requestVendorRegistrationOTP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VendorRegisterOTPRequest'
            example:
              email: toko.mabrur@example.com
      responses:
        '201':
          description: OTP berhasil dibuat dan dikirim.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessVendorRegisterOTPEnvelope'
        '400':
          description: Request tidak valid.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Email sudah terpakai atau sudah punya profil vendor.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: OTP diminta terlalu cepat.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/vendors/register/verify-otp:
    post:
      tags:
        - Vendor Registration
      summary: Verifikasi OTP email registrasi vendor
      description: Memverifikasi OTP dan mengembalikan onboarding JWT untuk step register berikutnya.
      operationId: verifyVendorRegistrationOTP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VendorVerifyRegistrationOTPRequest'
            example:
              email: toko.mabrur@example.com
              code: "123456"
      responses:
        '200':
          description: OTP valid dan onboarding JWT diterbitkan.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessVendorVerifyRegistrationOTPEnvelope'
        '400':
          description: OTP salah atau payload tidak valid.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Token tidak valid atau expired.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Email sudah terpakai akun vendor.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: OTP terlalu banyak salah atau expired.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/vendors/register/password:
    post:
      tags:
        - Vendor Registration
      summary: Simpan password onboarding vendor
      operationId: saveVendorRegistrationPassword
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VendorRegistrationPasswordRequest'
      responses:
        '200':
          description: Password berhasil disimpan.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessVendorOnboardingProgressEnvelope'
        '400':
          description: Step onboarding tidak valid atau payload tidak valid.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Onboarding JWT tidak valid atau expired.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/vendors/register/store:
    post:
      tags:
        - Vendor Registration
      summary: Simpan data toko onboarding vendor
      operationId: saveVendorRegistrationStore
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VendorRegistrationStoreRequest'
            example:
              store_name: Toko Oleh-Oleh Haji Mabrur
              vendor_type: souvenir_store
      responses:
        '200':
          description: Data toko berhasil disimpan.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessVendorOnboardingProgressEnvelope'
        '400':
          description: Step onboarding tidak valid atau payload tidak valid.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Onboarding JWT tidak valid atau expired.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/vendors/register/legal-document/presign:
    post:
      tags:
        - Vendor Registration
      summary: Buat presigned upload URL dokumen identitas vendor
      operationId: presignVendorRegistrationLegalDocument
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VendorRegistrationPresignDocumentRequest'
            example:
              document_id_type: ktp
      responses:
        '200':
          description: Presigned URL berhasil dibuat.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessVendorRegistrationPresignDocumentEnvelope'
        '400':
          description: Step onboarding tidak valid atau payload tidak valid.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Onboarding JWT tidak valid atau expired.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/vendors/register/legal-document/submit:
    post:
      tags:
        - Vendor Registration
      summary: Finalisasi registrasi vendor dan login otomatis
      operationId: submitVendorRegistrationLegal
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VendorRegistrationLegalRequest'
            example:
              business_legal_type: perorangan
              document_id_type: ktp
              nik: "3173000000000001"
              owner_name: Ahmad Subarkah
              birth_date: "1990-01-02"
              document_id_object_key: vendor-onboardings/6c9f5.../documents/owner_document_id/f1e2d3...
      responses:
        '200':
          description: Registrasi selesai dan auth token vendor diterbitkan.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessVendorLoginEnvelope'
        '400':
          description: Payload tidak valid, step tidak sesuai, atau file dokumen tidak valid.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Onboarding JWT tidak valid atau expired.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Email sudah dipakai akun lain.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/vendors/login:
    post:
      tags:
        - Vendor Auth
      summary: Login vendor
      description: |
        Mengautentikasi vendor menggunakan email dan password.
        Mengembalikan JWT token yang berisi `user_id`, `email`, `roles`, dan `vendor_id` di claims.

        **Aturan akses:**
        - User harus memiliki role `umkm`.
        - User harus memiliki profil vendor yang terhubung.
        - Semua status vendor diizinkan login **kecuali `blocked`** (draft, submitted, active, rejected).
      operationId: loginVendor
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VendorLoginRequest'
            example:
              email: toko.mabrur@example.com
              password: SecurePass123!
      responses:
        '200':
          description: Login berhasil. Response berisi JWT token dan informasi vendor.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessVendorLoginEnvelope'
              example:
                success: true
                message: login successful
                data:
                  token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  vendor_id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                  image_url: https://cdn.umrahmart.com/vendors/a1b2c3d4-e5f6-7890-abcd-ef1234567890/profile.jpg
                  email: toko.mabrur@example.com
                  name: Abu Bakar Shidiq Basalamah
                  vendor_type: souvenir_store
                  vendor_status: active
                  display_name: Toko Oleh-Oleh Haji Mabrur
                errors: null
                meta: null
        '400':
          description: Request tidak valid (validasi gagal).
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: validation failed
                data: null
                errors: "Key: 'VendorLoginRequest.Email' Error:Field validation for 'Email' failed on the 'required' tag"
                meta: null
        '401':
          description: Email atau password salah.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: invalid email or password
                data: null
                errors: null
                meta: null
        '403':
          description: Akses ditolak — user bukan vendor, tidak memiliki profil vendor, atau akun vendor diblokir.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                vendorAccessRequired:
                  summary: User bukan vendor (tidak punya role umkm)
                  value:
                    success: false
                    message: vendor access required
                    data: null
                    errors: null
                    meta: null
                noVendorProfile:
                  summary: User tidak memiliki profil vendor
                  value:
                    success: false
                    message: no vendor profile found
                    data: null
                    errors: null
                    meta: null
                vendorBlocked:
                  summary: Akun vendor diblokir
                  value:
                    success: false
                    message: vendor account is blocked
                    data: null
                    errors: null
                    meta: null
        '500':
          description: Internal server error.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: internal server error
                data: null
                errors: null
                meta: null
  /api/v1/vendors/me:
    get:
      tags:
        - Vendor Auth
      summary: Ambil profil vendor yang sedang login
      description: |
        Mengembalikan profil vendor berdasarkan `vendor_id` yang sudah diekstrak middleware
        dari Bearer token.

        **Autentikasi:**
        - Wajib menyertakan header `Authorization: Bearer <token>`.
        - Token harus valid dan memiliki role `umkm`.
        - `vendor_id` dibaca dari claims token oleh middleware auth.
      operationId: getVendorMe
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Profil vendor berhasil diambil.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessVendorProfileEnvelope'
              example:
                success: true
                message: vendor profile retrieved successfully
                data:
                  vendor_id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                  image_url: https://cdn.umrahmart.com/vendors/a1b2c3d4-e5f6-7890-abcd-ef1234567890/profile.jpg
                  email: toko.mabrur@example.com
                  name: Abu Bakar Shidiq Basalamah
                  vendor_type: souvenir_store
                  vendor_status: active
                  display_name: Toko Oleh-Oleh Haji Mabrur
                errors: null
                meta: null
        '400':
          description: "`vendor_id` pada context auth tidak tersedia atau tidak valid."
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: invalid vendor ID in token
                data: null
                errors: null
                meta: null
        '401':
          description: Token tidak diberikan, tidak valid, atau sudah expired.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                missingHeader:
                  summary: Header Authorization tidak ada
                  value:
                    success: false
                    message: missing authorization header
                    data: null
                    errors: null
                    meta: null
                invalidToken:
                  summary: Token tidak valid atau expired
                  value:
                    success: false
                    message: invalid or expired token
                    data: null
                    errors: null
                    meta: null
        '403':
          description: User tidak memiliki role yang diizinkan.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: insufficient permissions
                data: null
                errors: null
                meta: null
        '404':
          description: Vendor atau owner user tidak ditemukan.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                vendorNotFound:
                  summary: Vendor tidak ditemukan
                  value:
                    success: false
                    message: vendor not found
                    data: null
                    errors: null
                    meta: null
                userNotFound:
                  summary: Owner user tidak ditemukan
                  value:
                    success: false
                    message: user not found
                    data: null
                    errors: null
                    meta: null
        '500':
          description: Internal server error.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: internal server error
                data: null
                errors: null
                meta: null
  /api/v1/vendors/documents/confirm:
    post:
      tags:
        - Vendor Documents
      summary: Konfirmasi upload dokumen vendor
      description: |
        Mengkonfirmasi bahwa dokumen-dokumen vendor telah berhasil diupload ke S3 storage.
        Endpoint ini memverifikasi bahwa file benar-benar ada di S3, memeriksa ukuran dan MIME type,
        lalu memperbarui status dokumen di database.

        **Aturan:**
        - Memerlukan autentikasi dengan JWT token (role `umkm`).
        - Setiap dokumen divalidasi: file harus ada di S3, MIME type harus `image/jpeg`, `image/png`, `image/webp`, atau `application/pdf`.
        - Ukuran file maksimum 5 MB per dokumen.
        - Jika semua dokumen wajib (`owner_document_id`, `store_photo`, `bank_account_proof`, `business_logo`, `business_banner`) telah dikonfirmasi,
          status vendor akan otomatis berubah dari `draft` menjadi `submitted`.

        **Catatan:** `object_key` didapat dari response saat registrasi (`upload_urls[].object_key`).
      operationId: confirmVendorDocuments
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmDocumentsRequest'
            example:
              documents:
                - doc_type: owner_document_id
                  object_key: vendors/a1b2c3d4-e5f6-7890-abcd-ef1234567890/documents/owner_document_id/f1e2d3c4-b5a6-7890-abcd-ef1234567890
                - doc_type: store_photo
                  object_key: vendors/a1b2c3d4-e5f6-7890-abcd-ef1234567890/documents/store_photo/c4d5e6f7-a8b9-0123-def0-345678901234
                - doc_type: bank_account_proof
                  object_key: vendors/a1b2c3d4-e5f6-7890-abcd-ef1234567890/documents/bank_account_proof/d5e6f7a8-b9c0-1234-ef01-456789012345
                - doc_type: business_logo
                  object_key: vendors/a1b2c3d4-e5f6-7890-abcd-ef1234567890/documents/business_logo/e6f7a8b9-c0d1-2345-f012-567890123456
                - doc_type: business_banner
                  object_key: vendors/a1b2c3d4-e5f6-7890-abcd-ef1234567890/documents/business_banner/f7a8b9c0-d1e2-3456-0123-678901234567
      responses:
        '200':
          description: Dokumen berhasil dikonfirmasi.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessConfirmDocumentsEnvelope'
              example:
                success: true
                message: documents confirmed successfully
                data:
                  vendor_id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                  vendor_status: submitted
                  documents_confirmed: 5
                errors: null
                meta: null
        '400':
          description: Request tidak valid (validasi gagal, dokumen tidak ditemukan, file belum diupload, MIME type salah, atau file terlalu besar).
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                validationFailed:
                  summary: Validasi payload gagal
                  value:
                    success: false
                    message: validation failed
                    data: null
                    errors: "Key: 'ConfirmDocumentsRequest.Documents' Error:Field validation for 'Documents' failed on the 'required' tag"
                    meta: null
                documentNotFound:
                  summary: Dokumen tidak ditemukan untuk vendor ini
                  value:
                    success: false
                    message: "document not found for this vendor: owner_document_id"
                    data: null
                    errors: null
                    meta: null
                objectNotUploaded:
                  summary: File belum diupload ke S3
                  value:
                    success: false
                    message: "object not found in storage: vendors/a1b2c3d4/documents/owner_document_id/uuid"
                    data: null
                    errors: null
                    meta: null
                invalidMimeType:
                  summary: MIME type file tidak diizinkan
                  value:
                    success: false
                    message: "invalid document content type: text/plain"
                    data: null
                    errors: null
                    meta: null
                fileTooLarge:
                  summary: Ukuran file melebihi batas
                  value:
                    success: false
                    message: "document file size exceeds supported limit: 10485760 bytes"
                    data: null
                    errors: null
                    meta: null
        '401':
          description: Token tidak ada, format salah, atau token expired/invalid.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: invalid or expired token
                data: null
                errors: null
                meta: null
        '403':
          description: User tidak memiliki role umkm.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: insufficient permissions
                data: null
                errors: null
                meta: null
        '404':
          description: Vendor tidak ditemukan untuk user ini.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: vendor not found
                data: null
                errors: null
                meta: null
        '500':
          description: Internal server error.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: internal server error
                data: null
                errors: null
                meta: null
  /api/v1/vendors/products:
    post:
      tags:
        - Vendor Products
      summary: Membuat produk baru
      description: |
        Membuat produk baru untuk vendor yang sedang login.
        Vendor harus berstatus `active` (sudah di-approve admin) untuk dapat membuat produk.

        **Alur upload gambar (two-step):**
        1. Kirim data produk beserta informasi gambar (nama file, content type, primary flag).
        2. Response akan berisi `upload_urls` — presigned URL untuk upload setiap gambar langsung ke S3.
        3. Client melakukan `PUT` request ke setiap `upload_url` dengan file content.
        4. Setelah semua gambar diupload, panggil endpoint `/api/v1/vendors/products/{id}/images/confirm`.

        **Aturan:**
        - Memerlukan autentikasi JWT dengan role `umkm`.
        - Vendor harus berstatus `active`.
        - Harga dan stok di level top-level akan disimpan sebagai **default variant**.
        - Varian tambahan bisa ditambahkan melalui array `variants`.
        - SKU di-generate otomatis oleh sistem.
        - Slug di-generate otomatis dari nama produk.
        - Minimal 1 shipping service wajib dipilih.
        - Jika `is_active: true`, produk langsung berstatus `published`. Jika `false`, berstatus `draft`.
