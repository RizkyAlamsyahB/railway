    get:
      tags:
        - Vendor Balance
      summary: Get Balance
      description: |
        Menampilkan saldo terkini vendor yang sedang login.

        **Response fields:**
        - `available_balance` — Saldo yang tersedia untuk ditarik.
        - `pending_balance` — Saldo yang sedang diproses (withdrawal in-progress).
        - `total_earned` — Total pendapatan sepanjang waktu.
        - `total_withdrawn` — Total yang sudah ditarik.

        Saldo vendor bertambah otomatis saat pembayaran order dikonfirmasi.
        Net = subtotal order (grand_total - platform_fee).
      operationId: getVendorBalance
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Saldo vendor berhasil diambil.
          headers:
