  /api/v1/vendors/orders/{orderId}/reject:
    post:
      tags:
        - Vendor Orders
      summary: Reject order
      description: |
        Mengubah status pesanan dari `paid` atau `processing` ke `canceled`.

        Vendor menolak pesanan. Bisa dilakukan saat status `paid` (belum diproses)
        atau `processing` (sudah diproses tapi vendor membatalkan).

        **Auto-refund:** Jika pesanan sudah dibayar (`paid` / `processing`), sistem
        otomatis menginisiasi refund ke customer:
        - **VA / QRIS** → refund via payment gateway (`refund_method: "gateway"`).
        - **E-Wallet** → refund via disbursement (`refund_method: "disbursement"`);
          customer perlu mengisi nomor rekening tujuan refund.

        Stok produk juga otomatis dikembalikan.
      operationId: rejectVendorOrder
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrderIDParam"
      requestBody:
        description: Tidak memerlukan request body.
        required: false
        content: {}
      responses:
        "200":
          description: Order rejected successfully.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AcceptRejectOrderResponse"
              examples:
                paid_order_rejected:
                  summary: Pesanan yang sudah dibayar — refund otomatis diinisiasi
                  value:
                    success: true
                    message: order rejected successfully
                    data:
                      order_id: "4354c494-d5a1-4f00-b120-abcdef123456"
                      order_status: "canceled"
                      updated_at: "2026-03-01T11:05:00Z"
                      refund_info:
                        refund_id: "b2c3d4e5-f6a7-8901-bcde-f23456789012"
                        refund_method: "gateway"
                        status: "pending"
                        message: "Refund telah diinisiasi dan sedang diproses"
                    errors: null
                    meta: null
                processing_order_rejected:
                  summary: Pesanan processing (sudah diproses tapi dibatalkan)
                  value:
                    success: true
                    message: order rejected successfully
                    data:
                      order_id: "4354c494-d5a1-4f00-b120-abcdef123456"
                      order_status: "canceled"
                      updated_at: "2026-03-01T11:05:00Z"
                      refund_info:
                        refund_id: "c3d4e5f6-a7b8-9012-cdef-345678901234"
                        refund_method: "disbursement"
                        status: "pending"
                        message: "Refund via disbursement telah diinisiasi. Customer perlu mengisi data rekening tujuan."
                    errors: null
                    meta: null
        "400":
          description: Invalid transition or invalid order ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Order does not belong to this vendor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Order not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
