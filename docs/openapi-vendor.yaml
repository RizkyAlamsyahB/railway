openapi: 3.0.3
info:
  title: Haji Umroh Store BE - Vendor API
  version: 1.0.0
  description: Dokumentasi OpenAPI 3 untuk endpoint pendaftaran UMKM (vendor/seller).
servers:
  - url: http://localhost:8080
    description: Local development server
tags:
  - name: Vendor Registration
    description: Operasi pendaftaran UMKM baru.
  - name: Vendor Auth
    description: Autentikasi vendor.
  - name: Vendor Documents
    description: Manajemen dokumen vendor.
paths:
  /api/v1/vendors/register:
    post:
      tags:
        - Vendor Registration
      summary: Mendaftarkan vendor UMKM baru
      description: |
        Membuat akun user baru (role `umkm`), vendor, dan rekening bank dalam satu request.
        Response berisi JWT token untuk autentikasi dan presigned upload URLs untuk mengunggah
        dokumen-dokumen yang diperlukan langsung ke S3 storage.

        **Dokumen yang tersedia untuk upload:**
        - `owner_ktp` — KTP pemilik
        - `owner_passport` — Passport pemilik
        - `business_npwp` — NPWP usaha (opsional)
        - `store_photo` — Foto toko
        - `bank_account_proof` — Bukti rekening bank
        - `business_logo` — Logo usaha
        - `business_banner` — Banner usaha

        Presigned URL berlaku selama **30 menit** setelah registrasi.
        Client dapat melakukan `PUT` request langsung ke setiap `upload_url` dengan file content
        dan header `Content-Type` sesuai tipe file asli.
        MIME yang diizinkan: `image/jpeg`, `image/png`, `image/webp`, `application/pdf`.
      operationId: registerVendor
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VendorRegisterRequest'
            example:
              store_name: Toko Oleh-Oleh Haji Mabrur
              store_type: hajj_souvenir_store
              owner_name: Ahmad Subarkah
              legal_name: PT Mabrur Jaya
              responsible_person_name: Budi Santoso
              phone: "081234567890"
              email: toko.mabrur@example.com
              password: SecurePass123!
              bank_name: Bank Syariah Indonesia
              bank_account_number: "1234567890"
              bank_account_holder_name: Ahmad Subarkah
      responses:
        '201':
          description: Vendor berhasil didaftarkan. Response berisi ID vendor, ID user, JWT token, dan presigned upload URLs untuk dokumen.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessVendorRegisterEnvelope'
              example:
                success: true
                message: vendor registration successful
                data:
                  vendor_id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                  user_id: 7d2e9f31-09af-4d49-adf3-47bb2b9e2010
                  token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  upload_urls:
                    - doc_type: owner_ktp
                      upload_url: https://s3.ap-southeast-1.amazonaws.com/bucket/vendors/a1b2c3d4.../documents/owner_ktp/uuid?X-Amz-...
                      object_key: vendors/a1b2c3d4-e5f6-7890-abcd-ef1234567890/documents/owner_ktp/f1e2d3c4-b5a6-7890-abcd-ef1234567890
                    - doc_type: owner_passport
                      upload_url: https://s3.ap-southeast-1.amazonaws.com/bucket/vendors/a1b2c3d4.../documents/owner_passport/uuid?X-Amz-...
                      object_key: vendors/a1b2c3d4-e5f6-7890-abcd-ef1234567890/documents/owner_passport/a2b3c4d5-e6f7-8901-bcde-f12345678901
                    - doc_type: business_npwp
                      upload_url: https://s3.ap-southeast-1.amazonaws.com/bucket/vendors/a1b2c3d4.../documents/business_npwp/uuid?X-Amz-...
                      object_key: vendors/a1b2c3d4-e5f6-7890-abcd-ef1234567890/documents/business_npwp/b3c4d5e6-f7a8-9012-cdef-234567890123
                    - doc_type: store_photo
                      upload_url: https://s3.ap-southeast-1.amazonaws.com/bucket/vendors/a1b2c3d4.../documents/store_photo/uuid?X-Amz-...
                      object_key: vendors/a1b2c3d4-e5f6-7890-abcd-ef1234567890/documents/store_photo/c4d5e6f7-a8b9-0123-def0-345678901234
                    - doc_type: bank_account_proof
                      upload_url: https://s3.ap-southeast-1.amazonaws.com/bucket/vendors/a1b2c3d4.../documents/bank_account_proof/uuid?X-Amz-...
                      object_key: vendors/a1b2c3d4-e5f6-7890-abcd-ef1234567890/documents/bank_account_proof/d5e6f7a8-b9c0-1234-ef01-456789012345
                    - doc_type: business_logo
                      upload_url: https://s3.ap-southeast-1.amazonaws.com/bucket/vendors/a1b2c3d4.../documents/business_logo/uuid?X-Amz-...
                      object_key: vendors/a1b2c3d4-e5f6-7890-abcd-ef1234567890/documents/business_logo/e6f7a8b9-c0d1-2345-f012-567890123456
                    - doc_type: business_banner
                      upload_url: https://s3.ap-southeast-1.amazonaws.com/bucket/vendors/a1b2c3d4.../documents/business_banner/uuid?X-Amz-...
                      object_key: vendors/a1b2c3d4-e5f6-7890-abcd-ef1234567890/documents/business_banner/f7a8b9c0-d1e2-3456-0123-678901234567
                errors: null
                meta: null
        '400':
          description: Request tidak valid (validasi gagal).
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                validationFailed:
                  summary: Validasi payload gagal
                  value:
                    success: false
                    message: validation failed
                    data: null
                    errors: "Key: 'VendorRegisterRequest.Email' Error:Field validation for 'Email' failed on the 'required' tag"
                    meta: null
                invalidStoreType:
                  summary: Jenis toko tidak valid
                  value:
                    success: false
                    message: validation failed
                    data: null
                    errors: "Key: 'VendorRegisterRequest.StoreType' Error:Field validation for 'StoreType' failed on the 'oneof' tag"
                    meta: null
                passwordTooShort:
                  summary: Password kurang dari 8 karakter
                  value:
                    success: false
                    message: validation failed
                    data: null
                    errors: "Key: 'VendorRegisterRequest.Password' Error:Field validation for 'Password' failed on the 'min' tag"
                    meta: null
        '409':
          description: Konflik — email sudah terdaftar atau user sudah memiliki vendor.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                emailAlreadyRegistered:
                  summary: Email sudah terdaftar
                  value:
                    success: false
                    message: email already registered
                    data: null
                    errors: null
                    meta: null
                vendorAlreadyExists:
                  summary: User sudah memiliki vendor
                  value:
                    success: false
                    message: user already has a vendor
                    data: null
                    errors: null
                    meta: null
        '500':
          description: Internal server error.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: internal server error
                data: null
                errors: null
                meta: null
  /api/v1/vendors/login:
    post:
      tags:
        - Vendor Auth
      summary: Login vendor
      description: |
        Mengautentikasi vendor menggunakan email dan password.
        Mengembalikan JWT token yang berisi `user_id`, `email`, `roles`, dan `vendor_id` di claims.

        **Aturan akses:**
        - User harus memiliki role `umkm`.
        - User harus memiliki profil vendor yang terhubung.
        - Semua status vendor diizinkan login **kecuali `blocked`** (draft, submitted, active, rejected).
      operationId: loginVendor
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VendorLoginRequest'
            example:
              email: toko.mabrur@example.com
              password: SecurePass123!
      responses:
        '200':
          description: Login berhasil. Response berisi JWT token dan informasi vendor.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessVendorLoginEnvelope'
              example:
                success: true
                message: login successful
                data:
                  token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  vendor_id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                  vendor_status: active
                  display_name: Toko Oleh-Oleh Haji Mabrur
                errors: null
                meta: null
        '400':
          description: Request tidak valid (validasi gagal).
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: validation failed
                data: null
                errors: "Key: 'VendorLoginRequest.Email' Error:Field validation for 'Email' failed on the 'required' tag"
                meta: null
        '401':
          description: Email atau password salah.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: invalid email or password
                data: null
                errors: null
                meta: null
        '403':
          description: Akses ditolak — user bukan vendor, tidak memiliki profil vendor, atau akun vendor diblokir.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                vendorAccessRequired:
                  summary: User bukan vendor (tidak punya role umkm)
                  value:
                    success: false
                    message: vendor access required
                    data: null
                    errors: null
                    meta: null
                noVendorProfile:
                  summary: User tidak memiliki profil vendor
                  value:
                    success: false
                    message: no vendor profile found
                    data: null
                    errors: null
                    meta: null
                vendorBlocked:
                  summary: Akun vendor diblokir
                  value:
                    success: false
                    message: vendor account is blocked
                    data: null
                    errors: null
                    meta: null
        '500':
          description: Internal server error.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: internal server error
                data: null
                errors: null
                meta: null
  /api/v1/vendors/documents/confirm:
    post:
      tags:
        - Vendor Documents
      summary: Konfirmasi upload dokumen vendor
      description: |
        Mengkonfirmasi bahwa dokumen-dokumen vendor telah berhasil diupload ke S3 storage.
        Endpoint ini memverifikasi bahwa file benar-benar ada di S3, memeriksa ukuran dan MIME type,
        lalu memperbarui status dokumen di database.

        **Aturan:**
        - Memerlukan autentikasi dengan JWT token (role `umkm`).
        - Setiap dokumen divalidasi: file harus ada di S3, MIME type harus `image/jpeg`, `image/png`, `image/webp`, atau `application/pdf`.
        - Ukuran file maksimum 5 MB per dokumen.
        - Jika semua dokumen wajib (owner_ktp, store_photo, bank_account_proof) telah dikonfirmasi,
          status vendor akan otomatis berubah dari `draft` menjadi `submitted`.

        **Catatan:** `object_key` didapat dari response saat registrasi (`upload_urls[].object_key`).
      operationId: confirmVendorDocuments
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmDocumentsRequest'
            example:
              documents:
                - doc_type: owner_ktp
                  object_key: vendors/a1b2c3d4-e5f6-7890-abcd-ef1234567890/documents/owner_ktp/f1e2d3c4-b5a6-7890-abcd-ef1234567890
                - doc_type: store_photo
                  object_key: vendors/a1b2c3d4-e5f6-7890-abcd-ef1234567890/documents/store_photo/c4d5e6f7-a8b9-0123-def0-345678901234
                - doc_type: bank_account_proof
                  object_key: vendors/a1b2c3d4-e5f6-7890-abcd-ef1234567890/documents/bank_account_proof/d5e6f7a8-b9c0-1234-ef01-456789012345
      responses:
        '200':
          description: Dokumen berhasil dikonfirmasi.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessConfirmDocumentsEnvelope'
              example:
                success: true
                message: documents confirmed successfully
                data:
                  vendor_id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                  vendor_status: submitted
                  documents_confirmed: 3
                errors: null
                meta: null
        '400':
          description: Request tidak valid (validasi gagal, dokumen tidak ditemukan, file belum diupload, MIME type salah, atau file terlalu besar).
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                validationFailed:
                  summary: Validasi payload gagal
                  value:
                    success: false
                    message: validation failed
                    data: null
                    errors: "Key: 'ConfirmDocumentsRequest.Documents' Error:Field validation for 'Documents' failed on the 'required' tag"
                    meta: null
                documentNotFound:
                  summary: Dokumen tidak ditemukan untuk vendor ini
                  value:
                    success: false
                    message: "document not found for this vendor: owner_ktp"
                    data: null
                    errors: null
                    meta: null
                objectNotUploaded:
                  summary: File belum diupload ke S3
                  value:
                    success: false
                    message: "object not found in storage: vendors/a1b2c3d4/documents/owner_ktp/uuid"
                    data: null
                    errors: null
                    meta: null
                invalidMimeType:
                  summary: MIME type file tidak diizinkan
                  value:
                    success: false
                    message: "invalid document content type: text/plain"
                    data: null
                    errors: null
                    meta: null
                fileTooLarge:
                  summary: Ukuran file melebihi batas
                  value:
                    success: false
                    message: "document file size exceeds supported limit: 10485760 bytes"
                    data: null
                    errors: null
                    meta: null
        '401':
          description: Token tidak ada, format salah, atau token expired/invalid.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: invalid or expired token
                data: null
                errors: null
                meta: null
        '403':
          description: User tidak memiliki role umkm.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: insufficient permissions
                data: null
                errors: null
                meta: null
        '404':
          description: Vendor tidak ditemukan untuk user ini.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: vendor not found
                data: null
                errors: null
                meta: null
        '500':
          description: Internal server error.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: internal server error
                data: null
                errors: null
                meta: null
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  headers:
    RequestIDHeader:
      description: ID unik request dari middleware RequestID.
      schema:
        type: string
        example: 9e0d6f87-89ed-4ed5-bf74-b0c7610ce9cf
  schemas:
    VendorRegisterRequest:
      type: object
      required:
        - store_name
        - store_type
        - owner_name
        - responsible_person_name
        - phone
        - email
        - password
        - bank_name
        - bank_account_number
        - bank_account_holder_name
      properties:
        store_name:
          type: string
          maxLength: 120
          description: Nama toko yang akan ditampilkan (display_name).
          example: Toko Oleh-Oleh Haji Mabrur
        store_type:
          type: string
          description: Jenis toko.
          enum:
            - umrah_souvenir_store
            - hajj_souvenir_store
            - general_souvenir_store
          example: hajj_souvenir_store
        owner_name:
          type: string
          maxLength: 120
          description: Nama pemilik/pengelola toko. Akan disimpan sebagai nama lengkap user.
          example: Ahmad Subarkah
        legal_name:
          type: string
          maxLength: 160
          nullable: true
          description: Nama legal/badan usaha (opsional).
          example: PT Mabrur Jaya
        responsible_person_name:
          type: string
          maxLength: 120
          description: Nama penanggung jawab toko.
          example: Budi Santoso
        phone:
          type: string
          maxLength: 20
          description: Nomor telepon yang bisa dihubungi.
          example: "081234567890"
        email:
          type: string
          format: email
          maxLength: 255
          description: Email untuk login dan komunikasi. Harus unik.
          example: toko.mabrur@example.com
        password:
          type: string
          minLength: 8
          description: Kata sandi minimal 8 karakter.
          example: SecurePass123!
        bank_name:
          type: string
          maxLength: 120
          description: Nama bank untuk rekening penerima.
          example: Bank Syariah Indonesia
        bank_account_number:
          type: string
          maxLength: 60
          description: Nomor rekening bank.
          example: "1234567890"
        bank_account_holder_name:
          type: string
          maxLength: 160
          description: Nama pemilik rekening sesuai buku tabungan.
          example: Ahmad Subarkah
    VendorLoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: Email vendor yang terdaftar.
          example: toko.mabrur@example.com
        password:
          type: string
          description: Password akun vendor.
          example: SecurePass123!
    VendorLoginResponse:
      type: object
      required:
        - token
        - vendor_id
        - vendor_status
        - display_name
      properties:
        token:
          type: string
          description: |
            JWT token untuk autentikasi. Claims berisi `user_id`, `email`, `roles` (`["umkm"]`),
            dan `vendor_id`.
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        vendor_id:
          type: string
          format: uuid
          description: ID vendor.
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        vendor_status:
          type: string
          description: Status vendor saat ini.
          enum:
            - draft
            - submitted
            - active
            - rejected
          example: active
        display_name:
          type: string
          description: Nama toko yang ditampilkan.
          example: Toko Oleh-Oleh Haji Mabrur
    PresignedUploadInfo:
      type: object
      required:
        - doc_type
        - upload_url
        - object_key
      properties:
        doc_type:
          type: string
          description: Jenis dokumen.
          enum:
            - owner_ktp
            - owner_passport
            - business_npwp
            - store_photo
            - bank_account_proof
            - business_logo
            - business_banner
          example: owner_ktp
        upload_url:
          type: string
          format: uri
          description: |
            Presigned URL untuk upload file langsung ke S3 via HTTP PUT.
            Berlaku selama 30 menit. Gunakan `Content-Type` sesuai MIME file yang diunggah.
            MIME yang diizinkan: `image/jpeg`, `image/png`, `image/webp`, `application/pdf`.
          example: https://s3.ap-southeast-1.amazonaws.com/bucket/vendors/.../documents/owner_ktp/uuid?X-Amz-...
        object_key:
          type: string
          description: Object key di S3 storage. Simpan key ini untuk referensi saat mengkonfirmasi upload dokumen.
          example: vendors/a1b2c3d4-e5f6-7890-abcd-ef1234567890/documents/owner_ktp/f1e2d3c4-b5a6-7890-abcd-ef1234567890
    VendorRegisterResponse:
      type: object
      required:
        - vendor_id
        - user_id
        - token
        - upload_urls
      properties:
        vendor_id:
          type: string
          format: uuid
          description: ID vendor yang baru dibuat.
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        user_id:
          type: string
          format: uuid
          description: ID user yang baru dibuat.
          example: 7d2e9f31-09af-4d49-adf3-47bb2b9e2010
        token:
          type: string
          description: JWT token untuk autentikasi. Token berisi role `umkm`.
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        upload_urls:
          type: array
          description: Daftar presigned upload URL untuk setiap jenis dokumen.
          items:
            $ref: '#/components/schemas/PresignedUploadInfo'
    SuccessVendorRegisterEnvelope:
      type: object
      required:
        - success
        - message
        - data
        - errors
        - meta
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: vendor registration successful
        data:
          $ref: '#/components/schemas/VendorRegisterResponse'
        errors:
          nullable: true
          example: null
        meta:
          nullable: true
          example: null
    SuccessVendorLoginEnvelope:
      type: object
      required:
        - success
        - message
        - data
        - errors
        - meta
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: login successful
        data:
          $ref: '#/components/schemas/VendorLoginResponse'
        errors:
          nullable: true
          example: null
        meta:
          nullable: true
          example: null
    ErrorEnvelope:
      type: object
      required:
        - success
        - message
        - data
        - errors
        - meta
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: validation failed
        data:
          nullable: true
          example: null
        errors:
          nullable: true
          description: Detail error atau pesan validasi.
        meta:
          nullable: true
          example: null
    ConfirmDocumentItem:
      type: object
      required:
        - doc_type
        - object_key
      properties:
        doc_type:
          type: string
          description: Tipe dokumen yang dikonfirmasi.
          enum:
            - owner_ktp
            - owner_passport
            - business_npwp
            - store_photo
            - bank_account_proof
            - business_logo
            - business_banner
          example: owner_ktp
        object_key:
          type: string
          description: Object key di S3 yang didapat dari response registrasi (`upload_urls[].object_key`).
          example: vendors/a1b2c3d4-e5f6-7890-abcd-ef1234567890/documents/owner_ktp/f1e2d3c4-b5a6-7890-abcd-ef1234567890
    ConfirmDocumentsRequest:
      type: object
      required:
        - documents
      properties:
        documents:
          type: array
          minItems: 1
          description: Daftar dokumen yang akan dikonfirmasi.
          items:
            $ref: '#/components/schemas/ConfirmDocumentItem'
    ConfirmDocumentsResponse:
      type: object
      required:
        - vendor_id
        - vendor_status
        - documents_confirmed
      properties:
        vendor_id:
          type: string
          format: uuid
          description: ID vendor.
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        vendor_status:
          type: string
          description: Status vendor setelah konfirmasi. Berubah ke `submitted` jika semua dokumen wajib telah dikonfirmasi.
          enum:
            - draft
            - submitted
          example: submitted
        documents_confirmed:
          type: integer
          description: Jumlah dokumen yang berhasil dikonfirmasi.
          example: 3
    SuccessConfirmDocumentsEnvelope:
      type: object
      required:
        - success
        - message
        - data
        - errors
        - meta
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: documents confirmed successfully
        data:
          $ref: '#/components/schemas/ConfirmDocumentsResponse'
        errors:
          nullable: true
          example: null
        meta:
          nullable: true
          example: null
