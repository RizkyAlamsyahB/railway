    put:
      tags:
        - Vendor Products
      summary: Edit Product
      description: |
        Memperbarui data produk milik vendor yang sedang login (full-replace PUT semantics).

        **Alur gambar:**
        - `keep_image_ids` — array UUID gambar lama yang ingin **dipertahankan**. Gambar yang tidak disertakan akan **dihapus**.
        - `new_images` — gambar baru yang akan ditambahkan. Response berisi `new_upload_urls` (presigned URL) untuk upload ke S3.
        - Setelah upload, panggil `/api/v1/vendors/products/{id}/images/confirm` untuk mengkonfirmasi gambar baru.

        **Aturan:**
        - Memerlukan autentikasi JWT dengan role `umkm`.
        - Vendor harus berstatus `active`.
        - Produk harus milik vendor yang sedang login.
        - Default variant selalu diperbarui dari field `price`, `stock`, dan `weight_gram` di level atas (tidak melalui array `variants`).
        - Pada array `variants`: varian dengan `id` = update varian yang ada; varian tanpa `id` = buat varian baru. Varian lama yang tidak disertakan akan **dinonaktifkan** (soft-delete — tidak dihapus permanen).
        - Total gambar setelah update (dipertahankan + baru) tidak boleh melebihi **10**.
        - Slug hanya di-regenerate jika nama produk berubah.
        - `halal_ai_status` tidak di-reset saat update.
        - Presigned URL berlaku selama **30 menit**.
        - MIME gambar yang diizinkan: `image/jpeg`, `image/png`, `image/webp`.
      operationId: updateProduct
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID produk (UUID).
          schema:
            type: string
            format: uuid
          example: f1a2b3c4-d5e6-7890-abcd-ef1234567890
      requestBody:
