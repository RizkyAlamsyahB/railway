  /api/v1/vendors/withdrawals:
    get:
      tags:
        - Vendor Balance
      summary: Get Withdrawal History
      description: |
        Mengambil daftar riwayat withdrawal milik vendor yang sedang login.

        **Catatan tanggal payout:**
        - `payout_date` adalah waktu request withdrawal dibuat (`vendor_withdrawals.created_at`).
      operationId: listVendorWithdrawals
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
        - name: status
          in: query
          required: false
          description: Filter status withdrawal.
          schema:
            type: string
            enum:
              - pending
              - processing
              - completed
              - failed
      responses:
        "200":
          description: Riwayat withdrawal berhasil diambil.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessVendorWithdrawalListEnvelope"
              example:
                success: true
                message: vendor withdrawals retrieved successfully
                data:
                  - id: c1d2e3f4-a5b6-7890-cdef-1234567890ab
                    amount: 100000
                    status: processing
                    payout_date: "2026-04-07T10:00:00Z"
                errors: null
                meta:
                  page: 1
                  limit: 10
                  total_items: 1
                  total_pages: 1
        "400":
          description: Query parameter tidak valid.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Token tidak ada, format salah, atau token expired/invalid.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      tags:
        - Vendor Balance
      summary: Withdraw Balance
      description: |
        Menginisiasi penarikan saldo vendor ke rekening bank yang terdaftar melalui Xendit Payout API.

        **Alur:**
        1. Vendor mengirim `amount`, `channel_code`, dan `bank_account_id`.
        2. Sistem memvalidasi: vendor aktif, saldo mencukupi, minimum Rp 10.000, serta rekening milik vendor.
        3. Saldo dipindahkan dari `available_balance` ke `pending_balance`.
        4. Record `vendor_withdrawals` dibuat dengan status `pending`.
        5. Sistem memanggil Xendit Payout API.
        6. Jika berhasil, status diupdate ke `processing`.
        7. Jika gagal, saldo dikembalikan ke `available_balance` dan status menjadi `failed`.

        **Aturan:**
        - Memerlukan autentikasi JWT dengan role `umkm`.
        - Vendor harus berstatus `active` dan memiliki Xendit account.
        - Minimum penarikan: Rp 10.000.
        - Tidak ada cooldown antar penarikan.
        - Channel code harus valid sesuai daftar dari Xendit payout channels (IDR + BANK).
      operationId: requestVendorWithdrawal
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorWithdrawRequest"
            example:
              amount: 100000
              channel_code: ID_BCA
              bank_account_id: 1e2d3c4b-5a6f-7890-abcd-ef1234567890
      responses:
        "200":
          description: Penarikan berhasil disubmit ke Xendit.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessVendorWithdrawEnvelope"
              example:
                success: true
                message: withdrawal request submitted successfully
                data:
                  withdrawal_id: c1d2e3f4-a5b6-7890-cdef-1234567890ab
                  xendit_payout_id: dsbrs_a12b3c4d5e6f7890abcdef1234567890
                  status: processing
                  xendit_status: ACCEPTED
                  amount: 100000
                  channel_code: ID_BCA
                errors: null
                meta: null
        "400":
          description: Request tidak valid (validasi gagal, channel code tidak valid, saldo tidak cukup, atau di bawah minimum).
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                validationFailed:
                  summary: Validasi payload gagal
                  value:
                    success: false
                    message: validation failed
                    data: null
                    errors: "Key: 'VendorWithdrawRequest.Amount' Error:Field validation for 'Amount' failed on the 'required' tag"
                    meta: null
                invalidChannelCode:
                  summary: Channel code tidak valid
                  value:
                    success: false
                    message: invalid payout channel code
                    data: null
                    errors: null
                    meta: null
                insufficientBalance:
                  summary: Saldo tidak mencukupi
                  value:
                    success: false
                    message: insufficient available balance
                    data: null
                    errors: null
                    meta: null
                belowMinimum:
                  summary: Di bawah minimum penarikan Rp 10.000
                  value:
                    success: false
                    message: "amount is below minimum withdrawal of Rp 10.000"
                    data: null
                    errors: null
                    meta: null
        "401":
          description: Token tidak ada, format salah, atau token expired/invalid.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                message: invalid or expired token
                data: null
                errors: null
                meta: null
        "403":
          description: Vendor tidak aktif, user bukan vendor, atau rekening bukan milik vendor login.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                vendorNotActive:
                  summary: Vendor belum aktif
                  value:
                    success: false
                    message: vendor is not active
                    data: null
                    errors: null
                    meta: null
                bankNotOwned:
                  summary: Rekening bank bukan milik vendor login
                  value:
                    success: false
                    message: bank account does not belong to this vendor
                    data: null
