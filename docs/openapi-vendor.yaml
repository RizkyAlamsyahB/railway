          format: email
          example: toko.mabrur@example.com
    VendorLoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: Email vendor yang terdaftar.
          example: toko.mabrur@example.com
        password:
          type: string
          description: Password akun vendor.
          example: SecurePass123!
    VendorLoginResponse:
      type: object
      required:
        - access_token
        - vendor_id
        - email
        - vendor_status
      properties:
        access_token:
          type: string
          description: |
            JWT token untuk autentikasi. Claims berisi `user_id`, `email`, `roles` (`["umkm"]`),
            dan `vendor_id`.
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        vendor_id:
          type: string
          format: uuid
          description: ID vendor.
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        image_url:
          type: string
          nullable: true
          description: URL foto profil vendor yang diambil dari `users.image_url` milik owner vendor. Bernilai `null` jika belum ada foto profil.
          example: https://cdn.umrahmart.com/vendors/a1b2c3d4-e5f6-7890-abcd-ef1234567890/profile.jpg
        email:
          type: string
          format: email
          description: Email akun vendor.
          example: toko.mabrur@example.com
        store_name:
          type: string
          nullable: true
          description: Nama toko yang ditampilkan.
          example: null
        vendor_type:
          type: string
          nullable: true
          description: Jenis vendor.
          enum:
            - souvenir_store
            - ppiu
            - hajj_dormitory
          example: souvenir_store
        vendor_status:
          type: string
          description: Status vendor saat ini.
          enum:
            - draft
            - submitted
            - active
            - rejected
          example: active
    VendorMeResponse:
      type: object
      required:
        - vendor_id
        - email
        - vendor_status
      properties:
        vendor_id:
          type: string
          format: uuid
          description: ID vendor.
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        image_url:
          type: string
          nullable: true
          description: URL foto profil vendor yang diambil dari `users.image_url` milik owner vendor. Bernilai `null` jika belum ada foto profil.
          example: https://cdn.umrahmart.com/vendors/a1b2c3d4-e5f6-7890-abcd-ef1234567890/profile.jpg
        email:
          type: string
          format: email
          description: Email akun owner vendor.
          example: toko.mabrur@example.com
        store_name:
          type: string
          nullable: true
          description: Nama toko yang ditampilkan.
