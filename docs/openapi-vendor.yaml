        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationIDParam"
      responses:
        "200":
          description: Messages marked as read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEmptyEnvelope"
              example:
                success: true
                message: messages marked as read
                data: null
                errors: null
                meta: null
        "400":
          description: Invalid conversation ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: User is not a participant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Conversation not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  headers:
    RequestIDHeader:
      description: ID unik request dari middleware RequestID.
      schema:
        type: string
        example: 9e0d6f87-89ed-4ed5-bf74-b0c7610ce9cf
  parameters:
    AddressIDParam:
      name: id
      in: path
      required: true
      description: UUID address.
      schema:
        type: string
        format: uuid
    BannerIDParam:
      name: id
      in: path
      required: true
      description: UUID banner.
      schema:
        type: string
        format: uuid
    VendorIDParam:
      name: id
      in: path
      required: true
      description: UUID vendor.
      schema:
        type: string
        format: uuid
    OrderIDParam:
      name: orderId
      in: path
      required: true
      description: UUID order.
      schema:
        type: string
        format: uuid
    ConversationIDParam:
      name: conversationId
      in: path
      required: true
      description: UUID conversation.
      schema:
        type: string
        format: uuid
    CourierIDParam:
      name: courierId
      in: path
      required: true
      description: Integer courier ID.
      schema:
        type: integer
    VendorBankAccountIDParam:
      name: id
      in: path
      required: true
      description: UUID rekening bank vendor.
      schema:
        type: string
        format: uuid
  schemas:
    # --- Envelope wrappers ---
    SuccessEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          description: Response payload (varies per endpoint).
        errors:
          type: object
          nullable: true
          example: null
        meta:
          type: object
          nullable: true
          description: Metadata paginasi (jika ada).

    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10
        total_items:
          type: integer
          example: 25
        total_pages:
          type: integer
          example: 3

    # --- Vendor Report / Laporan Pendapatan ---
    VendorReportResponse:
      type: object
      properties:
        summary:
          $ref: "#/components/schemas/VendorReportSummary"
        items:
          type: array
          items:
            $ref: "#/components/schemas/VendorReportDailyItem"

    VendorReportSummary:
      type: object
      properties:
        success_transaction_rate:
          type: number
          format: double
          description: Persentase transaksi yang berhasil (paid & non-refunded) terhadap total transaksi.
          example: 82.0
        total_transactions:
          type: integer
          format: int64
          description: Jumlah total transaksi (semua status) pada periode yang dipilih.
          example: 8
        gross_revenue:
          type: number
          format: double
          description: "Pendapatan kotor (grand_total) dari transaksi yang berhasil."
          example: 485000000
        net_revenue:
          type: number
          format: double
          description: "Pendapatan bersih (grand_total - platform_fee) dari transaksi yang berhasil."
          example: 430000000

    VendorReportDailyItem:
      type: object
      properties:
        date:
          type: string
          format: date
          description: Tanggal transaksi (YYYY-MM-DD).
          example: "2026-04-07"
        transaction_count:
          type: integer
          format: int64
          description: Jumlah transaksi di hari ini.
          example: 3
        gross_revenue:
          type: number
          format: double
          description: Total pendapatan kotor di hari ini.
          example: 4000000
        platform_commission:
          type: number
          format: double
          description: Total komisi platform di hari ini.
          example: 200000
        net_revenue:
          type: number
          format: double
          description: Total pendapatan bersih di hari ini.
          example: 3800000

    # --- Vendor Dashboard ---
    VendorDashboardResponse:
      type: object
      properties:
        month:
          type: string
          description: "Bulan dalam format YYYY-MM."
          example: "2026-04"
        year:
          type: integer
          example: 2026
        summary:
          $ref: "#/components/schemas/VendorDashboardSummary"
        today_transactions:
          type: array
          items:
            $ref: "#/components/schemas/VendorDashboardTransaction"
        recent_notifications:
          type: array
          items:
            $ref: "#/components/schemas/VendorNotificationItem"
        payment_flow:
          type: array
          items:
            $ref: "#/components/schemas/VendorPaymentFlowItem"

    VendorDashboardSummary:
      type: object
      properties:
        total_transactions:
          type: integer
          format: int64
          description: Total jumlah transaksi di bulan yang dipilih.
          example: 15
        successful_transaction_percent:
          type: number
          format: double
          description: Persentase transaksi yang berhasil (completed/received).
          example: 73.33
        revenue:
          type: number
          format: double
          description: Total pendapatan dari transaksi yang berhasil.
          example: 4500000
        pending_settlement:
          type: number
          format: double
          description: Saldo yang masih pending (menunggu settlement).
          example: 1200000

    VendorDashboardTransaction:
      type: object
      properties:
        date_time:
          type: string
          format: date-time
          description: Waktu transaksi.
          example: "2026-04-07T10:30:00+07:00"
        invoice:
          type: string
          description: Nomor invoice / order number.
          example: "INV-20260407-001"
        product_name:
          type: string
          description: Nama produk pertama di order.
          example: "Sajadah Premium"
        category:
          type: string
          description: Kategori produk.
          example: "Perlengkapan Sholat"
        price:
          type: number
          format: double
          description: Grand total order.
          example: 150000
        status:
          type: string
          description: Status order saat ini.
          example: "paid"

    VendorNotificationItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          description: Tipe notifikasi (order, payout, system, dll).
          example: "order"
        title:
          type: string
          example: "Pesanan baru masuk"
        message:
          type: string
          example: "Pesanan INV-20260407-001 telah dibayar"
        created_at:
          type: string
          format: date-time
        read_at:
          type: string
          format: date-time
          nullable: true

    VendorPaymentFlowItem:
      type: object
      properties:
        label:
          type: string
          description: Label status (Selesai, Dalam Proses, Dibatalkan, Menunggu Pembayaran).
          example: "Selesai"
        value:
          type: number
          format: double
          description: Persentase dari total order.
          example: 73.33

    VendorRegisterOTPRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          example: toko.mabrur@example.com
    VendorRegisterOTPResponse:
      type: object
