  # ── Vendor Dashboard ──────────────────────────────────────────
  /api/v1/vendors/dashboard:
    get:
      tags:
        - Vendor Dashboard
      summary: Get Vendor Seller Dashboard
      description: |
        Menampilkan ringkasan dashboard vendor untuk bulan tertentu:
        - **summary**: total transaksi, persentase sukses, revenue, pending settlement.
        - **today_transactions**: hingga 5 transaksi terakhir hari ini.
        - **recent_notifications**: hingga 5 notifikasi terbaru.
        - **payment_flow**: distribusi persentase status order 30 hari terakhir (donut chart).
      operationId: getVendorDashboard
      security:
        - BearerAuth: []
      parameters:
        - name: month
          in: query
          description: Bulan (1-12). Default bulan sekarang.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 12
            example: 4
        - name: year
          in: query
          description: Tahun (2000-2100). Default tahun sekarang.
          required: false
          schema:
            type: integer
            minimum: 2000
            maximum: 2100
            example: 2026
      responses:
        "200":
          description: Dashboard berhasil diambil.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/VendorDashboardResponse"
              example:
                success: true
                message: vendor dashboard retrieved successfully
                data:
                  month: "2026-04"
                  year: 2026
                  summary:
                    total_transactions: 15
                    successful_transaction_percent: 73.33
                    revenue: 4500000
                    pending_settlement: 1200000
                  today_transactions:
                    - date_time: "2026-04-07T10:30:00+07:00"
                      invoice: "INV-20260407-001"
                      product_name: "Sajadah Premium"
                      category: "Perlengkapan Sholat"
                      price: 150000
                      status: "paid"
                    - date_time: "2026-04-07T09:15:00+07:00"
                      invoice: "INV-20260407-002"
                      product_name: "Mukena Travel"
                      category: "Perlengkapan Ibadah"
                      price: 250000
                      status: "processing"
                  recent_notifications:
                    - id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                      type: "order"
                      title: "Pesanan baru masuk"
                      message: "Pesanan INV-20260407-001 telah dibayar"
                      created_at: "2026-04-07T10:30:00+07:00"
                  payment_flow:
                    - label: "Selesai"
                      value: 73.33
                    - label: "Dalam Proses"
                      value: 13.33
                    - label: "Dibatalkan"
                      value: 6.67
                    - label: "Menunggu Pembayaran"
                      value: 6.67
                errors: null
                meta: null
        "400":
          description: Parameter tidak valid (month/year di luar range).
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Token tidak valid atau kadaluarsa.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  # ── Vendor Report / Laporan Pendapatan ──────────────────────────
  /api/v1/vendors/reports:
    get:
      tags:
        - Vendor Report
      summary: Get Laporan Pendapatan
      description: |
        Menampilkan laporan pendapatan vendor untuk periode bulan tertentu:
        - **summary**: KPI cards (persentase transaksi berhasil, total transaksi, pendapatan kotor, pendapatan bersih).
        - **items**: rincian pendapatan harian yang dipaginasi.

        Hanya transaksi yang sudah dibayar dan belum di-refund yang dihitung dalam rincian dan revenue.
        Sementara persentase transaksi berhasil dihitung terhadap seluruh transaksi (termasuk gagal/expired).

        Mendukung pencarian berdasarkan tanggal dan filter date range dalam satu bulan.
      operationId: getVendorReport
      security:
        - BearerAuth: []
      parameters:
        - name: month
          in: query
          description: |
            Periode bulan dalam format `YYYY-MM`.
            Default: bulan berjalan.
          required: false
          schema:
            type: string
            example: "2026-04"
        - name: date_from
          in: query
          description: |
            Opsional. Filter mulai tanggal (format `YYYY-MM-DD`).
            Harus berada dalam range bulan yang dipilih.
          required: false
          schema:
            type: string
            format: date
            example: "2026-04-01"
        - name: date_to
          in: query
          description: |
            Opsional. Filter sampai tanggal (format `YYYY-MM-DD`, inclusive).
            Harus berada dalam range bulan yang dipilih.
          required: false
          schema:
            type: string
            format: date
            example: "2026-04-15"
        - name: page
          in: query
          description: Halaman yang diminta (default 1).
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: limit
          in: query
          description: Jumlah item per halaman (default 10, max 100).
          required: false
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
        - name: search
          in: query
          description: |
            Pencarian berdasarkan tanggal (partial match terhadap kolom tanggal, misal: `2026-04-01` atau `2026-04`).
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Laporan pendapatan berhasil diambil.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/VendorReportResponse"
                      meta:
                        $ref: "#/components/schemas/PaginationMeta"
              example:
                success: true
                message: vendor report retrieved successfully
                data:
                  summary:
                    success_transaction_rate: 82.0
                    total_transactions: 8
                    gross_revenue: 485000000
                    net_revenue: 430000000
                  items:
                    - date: "2026-04-07"
                      transaction_count: 3
                      gross_revenue: 4000000
                      platform_commission: 200000
                      net_revenue: 3800000
                    - date: "2026-04-06"
                      transaction_count: 5
                      gross_revenue: 7500000
                      platform_commission: 375000
                      net_revenue: 7125000
                errors: null
                meta:
                  page: 1
                  limit: 10
                  total_items: 30
                  total_pages: 3
        "400":
          description: Parameter tidak valid (format bulan salah, date range tidak valid).
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                invalidMonth:
                  summary: Format bulan salah
                  value:
                    success: false
                    message: "invalid month format, expected YYYY-MM"
                    data: null
                    errors: null
                    meta: null
                invalidDate:
                  summary: Format tanggal salah
                  value:
                    success: false
                    message: "invalid date format, expected YYYY-MM-DD"
                    data: null
                    errors: null
                    meta: null
                invalidDateRange:
                  summary: Date range tidak valid
                  value:
                    success: false
                    message: "invalid date range: date_from must be before or equal to date_to"
                    data: null
                    errors: null
                    meta: null
        "401":
          description: Token tidak valid atau kadaluarsa.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: User tidak memiliki role vendor.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Internal server error.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

