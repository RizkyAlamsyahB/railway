  /api/v1/vendors/products/{id}/images/confirm:
    post:
      tags:
        - Vendor Products
      summary: Konfirmasi upload gambar produk
      description: |
        Mengkonfirmasi bahwa gambar-gambar produk telah berhasil diupload ke S3 storage.
        Endpoint ini memverifikasi bahwa file benar-benar ada di S3 via HeadObject,
        memeriksa MIME type, lalu memperbarui metadata gambar di database.

        **Aturan:**
        - Memerlukan autentikasi JWT dengan role `umkm`.
        - Produk harus milik vendor yang sedang login.
        - Setiap gambar divalidasi: file harus ada di S3, MIME type harus `image/jpeg`, `image/png`, atau `image/webp`.
        - `image_id` dan `object_key` didapat dari response saat membuat produk (`upload_urls[]`).
      operationId: confirmProductImages
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID produk (UUID).
          schema:
            type: string
            format: uuid
          example: f1a2b3c4-d5e6-7890-abcd-ef1234567890
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmProductImagesRequest'
            example:
              images:
                - image_id: dd44ee55-ff66-7788-9900-112233445566
                  object_key: products/f1a2b3c4-d5e6-7890-abcd-ef1234567890/images/dd44ee55-ff66-7788-9900-112233445566/sajadah-depan.jpg
                - image_id: ee55ff66-7788-9900-1122-334455667788
                  object_key: products/f1a2b3c4-d5e6-7890-abcd-ef1234567890/images/ee55ff66-7788-9900-1122-334455667788/sajadah-belakang.jpg
      responses:
        '200':
          description: Gambar berhasil dikonfirmasi.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessConfirmProductImagesEnvelope'
              example:
                success: true
                message: images confirmed successfully
                data:
                  product_id: f1a2b3c4-d5e6-7890-abcd-ef1234567890
                  images_confirmed: 2
                errors: null
                meta: null
        '400':
          description: Request tidak valid (validasi gagal, gambar tidak ditemukan, file belum diupload, atau MIME type salah).
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                validationFailed:
                  summary: Validasi payload gagal
                  value:
                    success: false
                    message: validation failed
                    data: null
                    errors: "Key: 'ConfirmProductImagesRequest.Images' Error:Field validation for 'Images' failed on the 'required' tag"
                    meta: null
                imageNotFound:
                  summary: Gambar tidak ditemukan untuk produk ini
                  value:
                    success: false
                    message: "image not found for this product: dd44ee55-ff66-7788-9900-112233445566"
                    data: null
                    errors: null
                    meta: null
                imageNotUploaded:
                  summary: File belum diupload ke S3
                  value:
                    success: false
                    message: "image not found in storage: products/f1a2b3c4.../images/dd44ee55.../sajadah-depan.jpg"
                    data: null
                    errors: null
                    meta: null
                invalidMimeType:
                  summary: MIME type gambar tidak diizinkan
                  value:
                    success: false
                    message: "invalid image content type: dd44ee55-ff66-7788-9900-112233445566 (text/plain)"
                    data: null
                    errors: null
                    meta: null
                invalidProductId:
                  summary: ID produk bukan UUID yang valid
                  value:
                    success: false
                    message: invalid product ID
                    data: null
                    errors: id must be a valid UUID
                    meta: null
        '401':
          description: Token tidak ada, format salah, atau token expired/invalid.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: invalid or expired token
                data: null
                errors: null
                meta: null
        '403':
          description: Produk bukan milik vendor ini atau user tidak memiliki role umkm.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                productNotOwned:
                  summary: Produk bukan milik vendor yang login
                  value:
                    success: false
                    message: product does not belong to this vendor
                    data: null
                    errors: null
                    meta: null
                insufficientPermissions:
                  summary: User tidak memiliki role umkm
                  value:
                    success: false
                    message: insufficient permissions
                    data: null
                    errors: null
                    meta: null
        '404':
          description: Produk tidak ditemukan.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: product not found
                data: null
                errors: null
                meta: null
        '500':
          description: Internal server error.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: internal server error
                data: null
                errors: null
                meta: null
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  headers:
    RequestIDHeader:
      description: ID unik request dari middleware RequestID.
      schema:
        type: string
        example: 9e0d6f87-89ed-4ed5-bf74-b0c7610ce9cf
  schemas:
    VendorRegisterRequest:
      type: object
      required:
        - store_name
        - store_type
        - owner_name
        - responsible_person_name
        - phone
        - email
        - password
        - bank_name
        - bank_account_number
        - bank_account_holder_name
      properties:
        store_name:
          type: string
          maxLength: 120
          description: Nama toko yang akan ditampilkan (display_name).
          example: Toko Oleh-Oleh Haji Mabrur
        store_type:
          type: string
          description: Jenis toko.
          enum:
            - umrah_souvenir_store
            - hajj_souvenir_store
            - general_souvenir_store
          example: hajj_souvenir_store
        owner_name:
          type: string
          maxLength: 120
          description: Nama pemilik/pengelola toko. Akan disimpan sebagai nama lengkap user.
          example: Ahmad Subarkah
        legal_name:
          type: string
          maxLength: 160
          nullable: true
          description: Nama legal/badan usaha (opsional).
          example: PT Mabrur Jaya
        responsible_person_name:
          type: string
          maxLength: 120
          description: Nama penanggung jawab toko.
          example: Budi Santoso
        phone:
          type: string
          maxLength: 20
          description: Nomor telepon yang bisa dihubungi.
          example: "081234567890"
        email:
          type: string
          format: email
          maxLength: 255
          description: Email untuk login dan komunikasi. Harus unik.
          example: toko.mabrur@example.com
        password:
          type: string
          minLength: 8
          description: Kata sandi minimal 8 karakter.
          example: SecurePass123!
        bank_name:
          type: string
          maxLength: 120
          description: Nama bank untuk rekening penerima.
          example: Bank Syariah Indonesia
        bank_account_number:
          type: string
          maxLength: 60
          description: Nomor rekening bank.
          example: "1234567890"
        bank_account_holder_name:
          type: string
          maxLength: 160
          description: Nama pemilik rekening sesuai buku tabungan.
          example: Ahmad Subarkah
    VendorLoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: Email vendor yang terdaftar.
          example: toko.mabrur@example.com
        password:
          type: string
          description: Password akun vendor.
          example: SecurePass123!
    VendorLoginResponse:
      type: object
      required:
        - token
        - vendor_id
        - vendor_status
        - display_name
      properties:
        token:
          type: string
          description: |
            JWT token untuk autentikasi. Claims berisi `user_id`, `email`, `roles` (`["umkm"]`),
            dan `vendor_id`.
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        vendor_id:
          type: string
          format: uuid
          description: ID vendor.
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        vendor_status:
          type: string
          description: Status vendor saat ini.
          enum:
            - draft
            - submitted
            - active
            - rejected
          example: active
        display_name:
          type: string
          description: Nama toko yang ditampilkan.
          example: Toko Oleh-Oleh Haji Mabrur
    PresignedUploadInfo:
      type: object
      required:
        - doc_type
        - upload_url
        - object_key
      properties:
        doc_type:
          type: string
          description: Jenis dokumen.
          enum:
            - owner_ktp
            - owner_passport
            - business_npwp
            - store_photo
            - bank_account_proof
            - business_logo
            - business_banner
          example: owner_ktp
        upload_url:
          type: string
          format: uri
          description: |
            Presigned URL untuk upload file langsung ke S3 via HTTP PUT.
            Berlaku selama 30 menit. Gunakan `Content-Type` sesuai MIME file yang diunggah.
            MIME yang diizinkan: `image/jpeg`, `image/png`, `image/webp`, `application/pdf`.
          example: https://s3.ap-southeast-1.amazonaws.com/bucket/vendors/.../documents/owner_ktp/uuid?X-Amz-...
        object_key:
          type: string
          description: Object key di S3 storage. Simpan key ini untuk referensi saat mengkonfirmasi upload dokumen.
          example: vendors/a1b2c3d4-e5f6-7890-abcd-ef1234567890/documents/owner_ktp/f1e2d3c4-b5a6-7890-abcd-ef1234567890
    VendorRegisterResponse:
      type: object
      required:
        - vendor_id
        - user_id
        - token
        - upload_urls
      properties:
        vendor_id:
          type: string
          format: uuid
          description: ID vendor yang baru dibuat.
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        user_id:
          type: string
          format: uuid
          description: ID user yang baru dibuat.
          example: 7d2e9f31-09af-4d49-adf3-47bb2b9e2010
        token:
          type: string
          description: JWT token untuk autentikasi. Token berisi role `umkm`.
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        upload_urls:
          type: array
          description: Daftar presigned upload URL untuk setiap jenis dokumen.
          items:
            $ref: '#/components/schemas/PresignedUploadInfo'
    SuccessVendorRegisterEnvelope:
      type: object
      required:
        - success
        - message
        - data
        - errors
        - meta
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: vendor registration successful
        data:
          $ref: '#/components/schemas/VendorRegisterResponse'
        errors:
          nullable: true
          example: null
        meta:
          nullable: true
          example: null
    SuccessVendorLoginEnvelope:
      type: object
      required:
        - success
        - message
        - data
        - errors
        - meta
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: login successful
        data:
          $ref: '#/components/schemas/VendorLoginResponse'
        errors:
          nullable: true
          example: null
        meta:
          nullable: true
          example: null
    ErrorEnvelope:
      type: object
      required:
        - success
        - message
        - data
        - errors
        - meta
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: validation failed
        data:
          nullable: true
          example: null
        errors:
          nullable: true
          description: Detail error atau pesan validasi.
        meta:
          nullable: true
          example: null
    ConfirmDocumentItem:
      type: object
      required:
        - doc_type
        - object_key
      properties:
        doc_type:
          type: string
          description: Tipe dokumen yang dikonfirmasi.
          enum:
            - owner_ktp
            - owner_passport
            - business_npwp
            - store_photo
            - bank_account_proof
            - business_logo
            - business_banner
          example: owner_ktp
        object_key:
          type: string
          description: Object key di S3 yang didapat dari response registrasi (`upload_urls[].object_key`).
          example: vendors/a1b2c3d4-e5f6-7890-abcd-ef1234567890/documents/owner_ktp/f1e2d3c4-b5a6-7890-abcd-ef1234567890
    ConfirmDocumentsRequest:
      type: object
      required:
        - documents
      properties:
        documents:
          type: array
          minItems: 1
          description: Daftar dokumen yang akan dikonfirmasi.
          items:
            $ref: '#/components/schemas/ConfirmDocumentItem'
    ConfirmDocumentsResponse:
      type: object
      required:
        - vendor_id
        - vendor_status
        - documents_confirmed
      properties:
        vendor_id:
          type: string
          format: uuid
          description: ID vendor.
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        vendor_status:
          type: string
          description: Status vendor setelah konfirmasi. Berubah ke `submitted` jika semua dokumen wajib telah dikonfirmasi.
          enum:
            - draft
            - submitted
          example: submitted
        documents_confirmed:
          type: integer
          description: Jumlah dokumen yang berhasil dikonfirmasi.
          example: 3
    SuccessConfirmDocumentsEnvelope:
      type: object
      required:
        - success
        - message
        - data
        - errors
        - meta
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: documents confirmed successfully
        data:
          $ref: '#/components/schemas/ConfirmDocumentsResponse'
        errors:
          nullable: true
          example: null
        meta:
          nullable: true
          example: null
    CreateProductImageInput:
      type: object
      required:
        - file_name
        - content_type
      properties:
        file_name:
          type: string
          maxLength: 255
          description: Nama file gambar yang akan diupload.
          example: sajadah-depan.jpg
        content_type:
          type: string
          description: MIME type gambar.
          enum:
            - image/jpeg
            - image/png
            - image/webp
          example: image/jpeg
        is_primary:
          type: boolean
          description: Tandai gambar ini sebagai gambar utama/primary. Tepat 1 gambar harus primary.
          default: false
          example: true
    CreateProductVariantInput:
      type: object
      required:
        - variant_name
        - price
      properties:
        variant_name:
          type: string
          maxLength: 120
          description: Nama varian produk.
          example: Merah
        price:
          type: number
          format: double
          minimum: 0.01
          description: Harga varian dalam Rupiah (IDR). Harus lebih besar dari 0.
          example: 150000
        stock:
          type: integer
          minimum: 0
          description: Jumlah stok tersedia untuk varian ini.
          default: 0
          example: 30
        weight_gram:
          type: integer
          minimum: 0
          nullable: true
          description: Berat varian dalam gram (opsional).
          example: 500
        is_active:
          type: boolean
          description: Status aktif varian.
          default: false
          example: true
    CreateProductRequest:
      type: object
      required:
        - name
        - category_id
        - description
        - price
        - shipping_service_ids
      properties:
        name:
          type: string
          maxLength: 180
          description: Nama produk.
          example: Sajadah Premium Madinah
        category_id:
          type: string
          format: uuid
          description: ID kategori produk. Harus kategori yang aktif.
          example: c1d2e3f4-a5b6-7890-cdef-1234567890ab
        description:
          type: string
          description: Deskripsi lengkap produk.
          example: Sajadah premium kualitas terbaik langsung dari Madinah.
        price:
          type: number
          format: double
          minimum: 0.01
          description: Harga produk (default variant) dalam Rupiah (IDR). Harus lebih besar dari 0.
          example: 150000
        stock:
          type: integer
          minimum: 0
          description: Jumlah stok tersedia (default variant).
          default: 0
          example: 50
        weight_gram:
          type: integer
          minimum: 0
          nullable: true
          description: Berat produk dalam gram (opsional, untuk default variant).
          example: 500
        is_active:
          type: boolean
          description: |
            Toggle untuk mengaktifkan produk.
            - `true` → status produk menjadi `published` (langsung tampil di katalog).
            - `false` → status produk menjadi `draft` (belum tampil).
          default: false
          example: false
        shipping_service_ids:
          type: array
          minItems: 1
          description: Daftar ID shipping service yang tersedia untuk produk ini. Minimal 1 wajib dipilih.
          items:
            type: string
            format: uuid
          example:
            - d1e2f3a4-b5c6-7890-def0-234567890abc
            - e2f3a4b5-c6d7-8901-ef01-345678901bcd
        variants:
          type: array
          maxItems: 20
          description: |
            Daftar varian tambahan (opsional). Setiap produk otomatis memiliki satu **default variant**
            dari field `price`, `stock`, dan `weight_gram` di level atas.
            Varian di sini adalah varian tambahan selain default.
          items:
            $ref: '#/components/schemas/CreateProductVariantInput'
        images:
          type: array
          minItems: 1
          maxItems: 10
          description: |
            Daftar gambar produk (opsional, maksimal 10).
            Tepat 1 gambar harus ditandai sebagai `is_primary: true`.
            Response akan berisi presigned upload URL untuk setiap gambar.
          items:
            $ref: '#/components/schemas/CreateProductImageInput'
    ProductImageUploadInfo:
      type: object
      required:
        - image_id
        - upload_url
        - object_key
        - sort_order
        - is_primary
      properties:
        image_id:
          type: string
          format: uuid
          description: ID gambar yang di-generate. Gunakan ID ini saat mengkonfirmasi upload.
          example: dd44ee55-ff66-7788-9900-112233445566
        upload_url:
          type: string
          format: uri
          description: |
            Presigned URL untuk upload gambar langsung ke S3 via HTTP PUT.
            Berlaku selama 30 menit. Gunakan `Content-Type` sesuai MIME yang dikirim di request.
          example: https://s3.ap-southeast-1.amazonaws.com/bucket/products/.../images/uuid/file.jpg?X-Amz-...
        object_key:
          type: string
          description: Object key di S3 storage. Simpan key ini untuk referensi saat mengkonfirmasi upload gambar.
          example: products/f1a2b3c4-d5e6-7890-abcd-ef1234567890/images/dd44ee55-ff66-7788-9900-112233445566/sajadah-depan.jpg
        sort_order:
          type: integer
          description: Urutan tampilan gambar (0-based).
          example: 0
        is_primary:
          type: boolean
          description: Apakah gambar ini adalah gambar utama.
          example: true
    ProductVariantResponse:
      type: object
      required:
        - id
        - sku
        - variant_name
        - price
        - currency
        - stock_on_hand
        - is_default
        - is_active
      properties:
        id:
          type: string
          format: uuid
          description: ID varian.
          example: aa11bb22-cc33-dd44-ee55-ff6677889900
        sku:
          type: string
          description: SKU (Stock Keeping Unit), di-generate otomatis oleh sistem.
          example: TOKOO-SAJAD000-00
        variant_name:
          type: string
          description: Nama varian. Default variant bernama "Default".
          example: Default
        price:
          type: number
          format: double
          description: Harga varian dalam Rupiah (IDR).
          example: 150000
        currency:
          type: string
          description: Mata uang.
          example: IDR
        stock_on_hand:
          type: integer
          description: Jumlah stok tersedia.
          example: 50
        weight_gram:
          type: integer
          nullable: true
          description: Berat dalam gram (null jika tidak diisi).
          example: 500
        is_default:
          type: boolean
          description: Apakah ini default variant (dibuat dari harga/stok di level produk).
          example: true
        is_active:
          type: boolean
          description: Status aktif varian.
          example: true
    CreateProductResponse:
      type: object
      required:
        - id
        - vendor_id
        - category_id
        - name
        - slug
        - description
        - status
        - halal_ai_status
        - variants
        - created_at
      properties:
        id:
          type: string
          format: uuid
          description: ID produk yang baru dibuat.
          example: f1a2b3c4-d5e6-7890-abcd-ef1234567890
        vendor_id:
          type: string
          format: uuid
          description: ID vendor pemilik produk.
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        category_id:
          type: string
          format: uuid
          description: ID kategori produk.
          example: c1d2e3f4-a5b6-7890-cdef-1234567890ab
        name:
          type: string
          description: Nama produk.
          example: Sajadah Premium Madinah
        slug:
          type: string
          description: URL-friendly slug, di-generate otomatis dari nama produk.
          example: sajadah-premium-madinah
        description:
          type: string
          description: Deskripsi produk.
          example: Sajadah premium kualitas terbaik langsung dari Madinah.
        status:
          type: string
          description: Status produk.
          enum:
            - draft
            - published
          example: draft
        halal_ai_status:
          type: string
          description: Status verifikasi AI halal. Default `pending` saat produk baru dibuat.
          enum:
            - pending
            - passed
            - failed
          example: pending
        variants:
          type: array
          description: Daftar semua varian produk (termasuk default variant).
          items:
            $ref: '#/components/schemas/ProductVariantResponse'
        upload_urls:
          type: array
          nullable: true
          description: Daftar presigned upload URL untuk gambar produk. Null jika tidak ada gambar.
          items:
            $ref: '#/components/schemas/ProductImageUploadInfo'
        created_at:
          type: string
          format: date-time
