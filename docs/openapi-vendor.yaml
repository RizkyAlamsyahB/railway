          format: uuid
        order_status:
          type: string
          description: Status baru pesanan setelah aksi.
          enum: [processing, canceled]
        updated_at:
          type: string
          format: date-time
        refund_info:
          type: object
          nullable: true
          description: |
            Informasi refund otomatis. Hanya muncul saat reject order yang sudah dibayar.
