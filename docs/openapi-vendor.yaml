        - sort_order
        - is_primary
      properties:
        image_id:
          type: string
          format: uuid
          description: ID gambar yang di-generate. Gunakan ID ini saat mengkonfirmasi upload.
          example: dd44ee55-ff66-7788-9900-112233445566
        upload_url:
          type: string
          format: uri
          description: |
            Presigned URL untuk upload gambar langsung ke S3 via HTTP PUT.
            Berlaku selama 30 menit. Gunakan `Content-Type` sesuai MIME yang dikirim di request.
          example: https://s3.ap-southeast-1.amazonaws.com/bucket/products/.../images/uuid/file.jpg?X-Amz-...
        object_key:
          type: string
          description: Object key di S3 storage. Simpan key ini untuk referensi saat mengkonfirmasi upload gambar.
          example: products/f1a2b3c4-d5e6-7890-abcd-ef1234567890/images/dd44ee55-ff66-7788-9900-112233445566/sajadah-depan.jpg
        sort_order:
          type: integer
          description: Urutan tampilan gambar (0-based).
          example: 0
        is_primary:
          type: boolean
          description: Apakah gambar ini adalah gambar utama.
          example: true
    ProductVariantResponse:
      type: object
      required:
        - id
        - sku
        - variant_name
        - price
        - currency
        - stock_on_hand
        - is_default
        - is_active
      properties:
        id:
          type: string
          format: uuid
          description: ID varian.
          example: aa11bb22-cc33-dd44-ee55-ff6677889900
        sku:
          type: string
          description: SKU (Stock Keeping Unit), di-generate otomatis oleh sistem.
          example: TOKOO-SAJAD000-00
        variant_name:
          type: string
          description: Nama varian. Default variant bernama "Default".
          example: Default
        price:
          type: number
          format: double
          description: Harga varian dalam Rupiah (IDR).
          example: 150000
        currency:
          type: string
          description: Mata uang.
          example: IDR
        stock_on_hand:
          type: integer
          description: Jumlah stok tersedia.
          example: 50
        weight_gram:
          type: integer
          nullable: true
          description: Berat dalam gram (null jika tidak diisi).
          example: 500
        is_default:
          type: boolean
          description: Apakah ini default variant (dibuat dari harga/stok di level produk).
          example: true
        is_active:
          type: boolean
          description: Status aktif varian.
          example: true
    CreateProductResponse:
      type: object
      required:
        - id
        - vendor_id
        - category_id
        - name
        - slug
        - description
        - status
        - halal_ai_status
        - variants
        - created_at
      properties:
        id:
          type: string
          format: uuid
          description: ID produk yang baru dibuat.
          example: f1a2b3c4-d5e6-7890-abcd-ef1234567890
        vendor_id:
          type: string
          format: uuid
          description: ID vendor pemilik produk.
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        category_id:
          type: string
          format: uuid
          description: ID kategori produk.
          example: c1d2e3f4-a5b6-7890-cdef-1234567890ab
        name:
          type: string
          description: Nama produk.
          example: Sajadah Premium Madinah
        slug:
          type: string
          description: URL-friendly slug, di-generate otomatis dari nama produk.
          example: sajadah-premium-madinah
        description:
          type: string
          description: Deskripsi produk.
          example: Sajadah premium kualitas terbaik langsung dari Madinah.
        status:
          type: string
          description: Status produk.
          enum:
            - draft
            - published
          example: draft
        halal_ai_status:
          type: string
          description: Status verifikasi AI halal. Default `pending` saat produk baru dibuat.
          enum:
            - pending
            - passed
            - failed
          example: pending
        variants:
          type: array
          description: Daftar semua varian produk (termasuk default variant).
          items:
            $ref: '#/components/schemas/ProductVariantResponse'
        upload_urls:
          type: array
          nullable: true
          description: Daftar presigned upload URL untuk gambar produk. Null jika tidak ada gambar.
          items:
            $ref: '#/components/schemas/ProductImageUploadInfo'
        created_at:
          type: string
          format: date-time
          description: Waktu pembuatan produk.
          example: "2026-02-13T10:30:00Z"
    ConfirmProductImageItem:
      type: object
      required:
        - image_id
        - object_key
