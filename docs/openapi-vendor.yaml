          example: dd44ee55-ff66-7788-9900-112233445566
        object_key:
          type: string
          description: Object key di S3 yang didapat dari response create product (`upload_urls[].object_key`).
          example: products/f1a2b3c4-d5e6-7890-abcd-ef1234567890/images/dd44ee55-ff66-7788-9900-112233445566/sajadah-depan.jpg
    ConfirmProductImagesRequest:
