        - vendor_status
        - display_name
      properties:
        vendor_id:
          type: string
          format: uuid
          description: ID vendor.
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        image_url:
          type: string
          description: URL foto profil vendor yang diambil dari `users.image_url` milik owner vendor. Bernilai string kosong jika belum ada foto profil.
          example: https://cdn.umrahmart.com/vendors/a1b2c3d4-e5f6-7890-abcd-ef1234567890/profile.jpg
        email:
          type: string
          format: email
          description: Email akun owner vendor.
          example: toko.mabrur@example.com
        name:
          type: string
          description: Nama lengkap owner user vendor.
          example: Abu Bakar Shidiq Basalamah
        vendor_type:
          type: string
          description: Jenis vendor.
          enum:
            - souvenir_store
            - ppiu
            - hajj_dormitory
