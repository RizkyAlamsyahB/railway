          description: Nama varian produk.
          example: Merah
        price:
          type: number
          format: double
          minimum: 0.01
          description: Harga varian dalam Rupiah (IDR). Harus lebih besar dari 0.
          example: 150000
        stock:
          type: integer
          minimum: 0
          description: Jumlah stok tersedia untuk varian ini.
          default: 0
          example: 30
        weight_gram:
          type: integer
          minimum: 0
          nullable: true
          description: Berat varian dalam gram (opsional).
          example: 500
        is_active:
          type: boolean
          description: Status aktif varian.
          default: false
          example: true
    CreateProductRequest:
      type: object
      required:
        - name
        - category_id
        - description
        - price
        - shipping_service_ids
      properties:
        name:
          type: string
          maxLength: 180
          description: Nama produk.
          example: Sajadah Premium Madinah
        category_id:
          type: string
          format: uuid
          description: ID kategori produk. Harus kategori yang aktif.
          example: c1d2e3f4-a5b6-7890-cdef-1234567890ab
        description:
          type: string
          description: Deskripsi lengkap produk.
          example: Sajadah premium kualitas terbaik langsung dari Madinah.
        price:
          type: number
          format: double
          minimum: 0.01
          description: Harga produk (default variant) dalam Rupiah (IDR). Harus lebih besar dari 0.
          example: 150000
        stock:
          type: integer
          minimum: 0
          description: Jumlah stok tersedia (default variant).
          default: 0
          example: 50
        weight_gram:
          type: integer
          minimum: 0
          nullable: true
          description: Berat produk dalam gram (opsional, untuk default variant).
          example: 500
        is_active:
          type: boolean
          description: |
            Toggle untuk mengaktifkan produk.
            - `true` → status produk menjadi `published` (langsung tampil di katalog).
            - `false` → status produk menjadi `draft` (belum tampil).
          default: false
          example: false
        shipping_service_ids:
          type: array
          minItems: 1
          description: Daftar ID shipping service yang tersedia untuk produk ini. Minimal 1 wajib dipilih.
          items:
            type: string
            format: uuid
          example:
            - d1e2f3a4-b5c6-7890-def0-234567890abc
            - e2f3a4b5-c6d7-8901-ef01-345678901bcd
        variants:
          type: array
          maxItems: 20
          description: |
            Daftar varian tambahan (opsional). Setiap produk otomatis memiliki satu **default variant**
            dari field `price`, `stock`, dan `weight_gram` di level atas.
            Varian di sini adalah varian tambahan selain default.
          items:
            $ref: '#/components/schemas/CreateProductVariantInput'
        images:
          type: array
          minItems: 1
          maxItems: 10
          description: |
            Daftar gambar produk (opsional, maksimal 10).
            Tepat 1 gambar harus ditandai sebagai `is_primary: true`.
            Response akan berisi presigned upload URL untuk setiap gambar.
          items:
            $ref: '#/components/schemas/CreateProductImageInput'
