  /api/v1/vendors/orders:
    get:
      tags:
        - Vendor Orders
      summary: List vendor orders
      description: |
        Mengambil daftar pesanan untuk vendor yang sedang login, dengan opsi filter berdasarkan status, pencarian, rentang tanggal, sorting, dan paginasi.

        Status yang valid untuk filter: `paid`, `processing`, `shipped`, `delivered`, `completed`, `canceled`.
      operationId: listVendorOrders
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
            minimum: 1
        - name: status
          in: query
          schema:
            type: string
            enum: [paid, processing, shipped, delivered, completed, canceled]
        - name: search
          in: query
          description: Search by order number or customer name.
          schema:
            type: string
        - name: date_from
          in: query
          description: Format `YYYY-MM-DD`.
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          description: Format `YYYY-MM-DD`.
          schema:
            type: string
            format: date
        - name: sort_by
          in: query
          schema:
            type: string
            enum: [order_date, customer_name, total_payment]
        - name: sort_order
          in: query
          schema:
            type: string
            enum: [asc, desc]
      responses:
        "200":
          description: Vendor orders retrieved successfully.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/VendorOrderListItem"
                      meta:
                        $ref: "#/components/schemas/PaginationMeta"
              example:
                success: true
                message: vendor orders retrieved successfully
                data:
                  - order_id: "4354c494-d5a1-4f00-b120-abcdef123456"
                    order_no: "ORD-20260301-ABC1"
                    order_date: "2026-03-01T10:30:00Z"
                    customer_name: "Ahmad Rizky"
                    items:
                      - product_name: "Kain Ihram Premium"
                        selected_variant: "Putih - L"
                        qty: 2
                        unit_price: 150000
                        line_total: 300000
                    total_payment: 325000
                    status: "paid"
                errors: null
                meta:
                  page: 1
                  limit: 10
                  total_items: 3
                  total_pages: 1
        "400":
          description: Invalid query values.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
