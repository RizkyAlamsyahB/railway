openapi: 3.0.3
info:
  title: Vendor API
  version: 1.0.0
  description: Dokumentasi OpenAPI 3 untuk modul vendor/seller (UMKM), termasuk pendaftaran, autentikasi, produk, voucher, saldo, pengiriman, alamat gudang, kurir, order, banner toko, laporan pendapatan, dan chat.
servers:
  - url: https://haji-umroh-store-api.jauhar.id
    description: Local development server
tags:
  - name: Vendor Registration
    description: Operasi pendaftaran UMKM baru.
  - name: Vendor Auth
    description: Autentikasi vendor.
  - name: Vendor Documents
    description: Manajemen dokumen vendor.
  - name: Vendor Products
    description: Manajemen produk vendor.
  - name: Vendor Vouchers
    description: CRUD voucher diskon nominal per item (produk milik vendor).
  - name: Vendor Balance
    description: Operasi saldo dan penarikan vendor (Tokopedia-style self-service).
  - name: Vendor Bank Accounts
    description: Manajemen rekening bank vendor untuk payout dan penarikan saldo.
  - name: Vendor Shipping
    description: Lookup lokasi pengiriman dan master kurir untuk kebutuhan vendor.
  - name: Vendor Locations
    description: Lookup wilayah Indonesia untuk form alamat umum dan profil vendor.
  - name: Vendor Addresses
    description: Manajemen alamat vendor/customer yang dipakai sebagai alamat gudang.
  - name: Vendor Couriers
    description: Manajemen kurir aktif yang dipilih vendor.
  - name: Vendor Orders
    description: Kelola order vendor, invoice, shipping, export, dan tracking.
  - name: Vendor Banners
    description: Manajemen banner toko vendor dan endpoint banner publik toko.
  - name: Vendor Dashboard
    description: Dashboard ringkasan penjualan, transaksi hari ini, notifikasi, dan alur pembayaran vendor.
  - name: Vendor Report
    description: Laporan pendapatan vendor — KPI summary dan rincian pendapatan harian dengan export CSV.
  - name: Vendor Chat
    description: Pencarian user, percakapan, pesan, attachment, dan read state untuk alur chat vendor.
  - name: Xendit Webhook
    description: Endpoint callback webhook dari Xendit.
paths:
  /api/v1/vendors/register/request-otp:
    post:
      tags:
        - Vendor Registration
      summary: 1. Request OTP
      description: Memulai flow onboarding vendor dengan mengirim OTP ke email vendor.
      operationId: requestVendorRegistrationOTP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorRegisterOTPRequest"
            example:
              email: toko.mabrur@example.com
      responses:
        "201":
          description: OTP berhasil dibuat dan dikirim.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessVendorRegisterOTPEnvelope"
        "400":
          description: Request tidak valid.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Email sudah terpakai atau sudah punya profil vendor.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: OTP diminta terlalu cepat.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/vendors/register/verify-otp:
    post:
      tags:
        - Vendor Registration
      summary: 2. Verify OTP
      description: Memverifikasi OTP dan mengembalikan `email_token` untuk step register vendor berikutnya.
      operationId: verifyVendorRegistrationOTP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorVerifyRegistrationOTPRequest"
            example:
              email: toko.mabrur@example.com
              code: "123456"
      responses:
        "200":
          description: OTP valid dan `email_token` diterbitkan.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessVendorVerifyRegistrationOTPEnvelope"
        "400":
          description: OTP salah atau payload tidak valid.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Token tidak valid atau expired.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Email sudah terpakai akun vendor.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: OTP terlalu banyak salah atau expired.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/vendors/register/password:
    post:
      tags:
        - Vendor Registration
      summary: 3. Set Password
      operationId: saveVendorRegistrationPassword
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorRegistrationPasswordRequest"
      responses:
        "200":
          description: Registrasi vendor selesai dan auth token diterbitkan.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessVendorLoginEnvelope"
              example:
                success: true
                message: vendor registration completed
                data:
                  access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  vendor_id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                  email: toko.mabrur@example.com
                  image_url: null
                  store_name: null
                  vendor_type: null
                  vendor_status: draft
                errors: null
                meta: null
        "400":
          description: Step onboarding tidak valid atau payload tidak valid.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Email token tidak valid atau expired.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Internal server error.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/vendors/login:
    post:
      tags:
        - Vendor Auth
      summary: Login vendor
      description: |
        Mengautentikasi vendor menggunakan email dan password.
        Mengembalikan JWT token yang berisi `user_id`, `email`, `roles`, dan `vendor_id` di claims.

        **Aturan akses:**
        - User harus memiliki role `umkm`.
        - User harus memiliki profil vendor yang terhubung.
        - Semua status vendor diizinkan login **kecuali `blocked`** (draft, submitted, active, rejected).
      operationId: loginVendor
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorLoginRequest"
            example:
              email: toko.mabrur@example.com
              password: SecurePass123!
      responses:
        "200":
          description: Login berhasil. Response berisi JWT token dan informasi vendor.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessVendorLoginEnvelope"
              example:
                success: true
                message: login successful
                data:
                  access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  vendor_id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                  image_url: null
                  email: toko.mabrur@example.com
                  store_name: Toko Oleh-Oleh Haji Mabrur
                  vendor_type: null
                  vendor_status: active
                errors: null
                meta: null
        "400":
          description: Request tidak valid (validasi gagal).
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                message: validation failed
                data: null
                errors: "Key: 'VendorLoginRequest.Email' Error:Field validation for 'Email' failed on the 'required' tag"
                meta: null
        "401":
          description: Email atau password salah.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                message: invalid email or password
                data: null
                errors: null
                meta: null
        "403":
          description: Akses ditolak — user bukan vendor, tidak memiliki profil vendor, atau akun vendor diblokir.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                vendorAccessRequired:
                  summary: User bukan vendor (tidak punya role umkm)
                  value:
                    success: false
                    message: vendor access required
                    data: null
                    errors: null
                    meta: null
                noVendorProfile:
                  summary: User tidak memiliki profil vendor
                  value:
                    success: false
                    message: no vendor profile found
                    data: null
                    errors: null
                    meta: null
                vendorBlocked:
                  summary: Akun vendor diblokir
                  value:
                    success: false
                    message: vendor account is blocked
                    data: null
                    errors: null
                    meta: null
        "500":
          description: Internal server error.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                message: internal server error
                data: null
                errors: null
                meta: null
  /api/v1/vendors/me:
    get:
      tags:
        - Vendor Auth
      summary: Get Profile Vendor
      description: |
        Mengembalikan profil vendor berdasarkan `vendor_id` yang sudah diekstrak middleware
        dari Bearer token.

        **Autentikasi:**
        - Wajib menyertakan header `Authorization: Bearer <token>`.
        - Token harus valid dan memiliki role `umkm`.
        - `vendor_id` dibaca dari claims token oleh middleware auth.
      operationId: getVendorMe
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Profil vendor berhasil diambil.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessVendorMeEnvelope"
              example:
                success: true
                message: vendor profile retrieved successfully
                data:
                  vendor_id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                  image_url: https://cdn.umrahmart.com/vendors/a1b2c3d4-e5f6-7890-abcd-ef1234567890/profile.jpg
                  email: toko.mabrur@example.com
                  store_name: Toko Oleh-Oleh Haji Mabrur
                  vendor_type: null
                  vendor_status: active
                  status_reason: null
                errors: null
                meta: null
        "400":
          description: "`vendor_id` pada context auth tidak tersedia atau tidak valid."
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                message: invalid vendor ID in token
                data: null
                errors: null
                meta: null
        "401":
          description: Token tidak diberikan, tidak valid, atau sudah expired.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                missingHeader:
                  summary: Header Authorization tidak ada
                  value:
                    success: false
                    message: missing authorization header
                    data: null
                    errors: null
                    meta: null
                invalidToken:
                  summary: Token tidak valid atau expired
                  value:
                    success: false
                    message: invalid or expired token
                    data: null
                    errors: null
                    meta: null
        "403":
          description: User tidak memiliki role yang diizinkan.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                message: insufficient permissions
                data: null
                errors: null
                meta: null
        "404":
          description: Vendor atau owner user tidak ditemukan.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                vendorNotFound:
                  summary: Vendor tidak ditemukan
                  value:
                    success: false
                    message: vendor not found
                    data: null
                    errors: null
                    meta: null
                userNotFound:
                  summary: Owner user tidak ditemukan
                  value:
                    success: false
                    message: user not found
                    data: null
                    errors: null
                    meta: null
        "500":
          description: Internal server error.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                message: internal server error
                data: null
                errors: null
                meta: null
  /api/v1/vendors/me/profile:
    put:
      tags:
        - Vendor Auth
      summary: Update Profile Vendor
      description: |
        Memperbarui profil vendor (saat ini mendukung pembaruan nama toko dan deskripsi).

        **Autentikasi:**
        - Wajib menyertakan header `Authorization: Bearer <token>`.
        - Token harus valid dan memiliki role `umkm`.
      operationId: updateVendorProfile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorUpdateProfileRequest"
            example:
              store_name: "Toko Baru Mekkah"
              store_description: "Toko oleh-oleh haji dan umrah terlengkap di Jakarta."
      responses:
        "200":
          description: Profil vendor berhasil diperbarui. Mengembalikan data profil terbaru.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessVendorMeEnvelope"
        "400":
          description: Payload tidak valid (misal, `store_name` kosong atau terlalu panjang).
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Token tidak valid atau expired.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: User tidak memiliki akses sebagai vendor.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Vendor tidak ditemukan.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Internal server error.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/vendors/register/propose/souvenir_store/presign:
    post:
      tags:
        - Vendor Registration
      summary: Presign dokumen proposal souvenir store
      description: |
        Menghasilkan `object_id` dan `presigned_url` untuk upload 3 dokumen proposal vendor souvenir store:
        KTP penanggung jawab, NIB, dan sertifikat halal.

        Endpoint ini hanya membuat URL upload ke storage dan belum menyimpan metadata dokumen ke database.
        `object_id` yang diterima dari response harus dipakai kembali pada endpoint submit proposal.

        **Autentikasi:**
        - Wajib menyertakan header `Authorization: Bearer <token>`.
        - Token harus valid dan memiliki role `umkm`.
        - Vendor harus milik user login dan berada pada status yang diizinkan untuk melengkapi proposal.

        **Aturan MIME:**
        - Setiap field menerima MIME dokumen yang diizinkan sistem, misalnya `image/jpeg`, `image/png`, `image/webp`, atau `application/pdf`.
      operationId: presignVendorSouvenirStoreProposalDocuments
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorSouvenirStoreProposalPresignRequest"
            example:
              responsible_person_ktp: image/png
              nib: image/jpeg
              halal_certificate: application/pdf
      responses:
        "200":
          description: Presigned upload URL berhasil dibuat.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessVendorSouvenirStoreProposalPresignEnvelope"
              example:
                success: true
                message: presigned upload URL generated
                data:
                  responsible_person_ktp:
                    object_id: vendors/a1b2c3d4-e5f6-7890-abcd-ef1234567890/documents/owner_document_id/8df7708e-fba2-4f2d-9300-3a441a9365c6
                    presigned_url: https://s3.amazonaws.com/bucket/vendors/a1b2c3d4-e5f6-7890-abcd-ef1234567890/documents/owner_document_id/8df7708e-fba2-4f2d-9300-3a441a9365c6?X-Amz-Signature=...
                  nib:
                    object_id: vendors/a1b2c3d4-e5f6-7890-abcd-ef1234567890/documents/business_nib/6c6e6c5d-1cec-4e7f-b676-f8756024d50c
                    presigned_url: https://s3.amazonaws.com/bucket/vendors/a1b2c3d4-e5f6-7890-abcd-ef1234567890/documents/business_nib/6c6e6c5d-1cec-4e7f-b676-f8756024d50c?X-Amz-Signature=...
                  halal_certificate:
                    object_id: vendors/a1b2c3d4-e5f6-7890-abcd-ef1234567890/documents/halal_certificate/72d95895-02cf-4344-b855-7dd7952eb6b1
                    presigned_url: https://s3.amazonaws.com/bucket/vendors/a1b2c3d4-e5f6-7890-abcd-ef1234567890/documents/halal_certificate/72d95895-02cf-4344-b855-7dd7952eb6b1?X-Amz-Signature=...
                errors: null
                meta: null
        "400":
          description: Request tidak valid atau MIME type dokumen tidak didukung.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Token tidak diberikan, tidak valid, atau sudah expired.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Vendor tidak dimiliki user login atau status vendor tidak mengizinkan pengajuan.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Vendor tidak ditemukan.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Internal server error.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/vendors/register/propose/souvenir_store:
    post:
      tags:
        - Vendor Registration
      summary: Submit proposal souvenir store
      description: |
        Mengirim data profil dan dokumen proposal vendor souvenir store untuk diajukan ke review admin.

        Endpoint ini akan:
        - memperbarui profil toko vendor,
        - memperbarui kontak owner user,
        - menyimpan NIK penanggung jawab,
        - menyimpan referensi dokumen KTP, NIB, dan sertifikat halal,
        - lalu mengubah status vendor menjadi `submitted`.
      operationId: submitVendorSouvenirStoreProposal
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorSouvenirStoreProposalRequest"
            example:
              store_name: Toko Oleh-Oleh Haji Mabrur
              store_description: Menjual aneka oleh-oleh haji dan umrah.
              address:
                province_id: "31"
                city_id: "3171"
                district_id: "317101"
                subdistrict_id: "3171011001"
                postal_code: "10320"
                address_line: Jl. Pegangsaan Barat No. 12
              responsible_person:
                name: Ahmad Fauzi
                phone: "+6281234567890"
                email: toko.mabrur@example.com
                nik: "3175090901010001"
                ktp_object_id: vendors/a1b2c3d4-e5f6-7890-abcd-ef1234567890/documents/owner_document_id/8df7708e-fba2-4f2d-9300-3a441a9365c6
              other_documents:
                nib_object_id: vendors/a1b2c3d4-e5f6-7890-abcd-ef1234567890/documents/business_nib/6c6e6c5d-1cec-4e7f-b676-f8756024d50c
                halal_certificate_object_id: vendors/a1b2c3d4-e5f6-7890-abcd-ef1234567890/documents/halal_certificate/72d95895-02cf-4344-b855-7dd7952eb6b1
      responses:
        "200":
          description: Proposal vendor berhasil dikirim.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessVendorSouvenirStoreProposalEnvelope"
              example:
                success: true
                message: vendor proposal submitted successfully
                data:
                  vendor_id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                  status: submitted
                errors: null
                meta: null
        "400":
          description: Request tidak valid atau data dokumen tidak sesuai.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Token tidak diberikan, tidak valid, atau sudah expired.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
