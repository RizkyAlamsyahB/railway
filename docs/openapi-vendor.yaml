          example: https://cdn.umrahmart.com/vendors/a1b2c3d4-e5f6-7890-abcd-ef1234567890/profile.jpg
        email:
          type: string
          format: email
          description: Email akun vendor.
          example: toko.mabrur@example.com
        name:
          type: string
          description: Nama lengkap user pemilik akun vendor.
