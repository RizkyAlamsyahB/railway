        vendor_status:
          type: string
          description: Status vendor saat ini.
          enum:
            - draft
            - submitted
            - active
            - rejected
            - blocked
          example: active
        display_name:
          type: string
          description: Nama toko yang ditampilkan.
          example: Toko Oleh-Oleh Haji Mabrur
    PresignedUploadInfo:
      type: object
