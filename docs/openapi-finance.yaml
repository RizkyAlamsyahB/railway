  /api/v1/webhooks/xendit/refund-payout:
    post:
      tags:
        - Xendit Webhook
      summary: Xendit Refund Payout Webhook Callback
      description: |
        Endpoint callback dari Xendit untuk update status payout refund (disbursement).

        Dipanggil otomatis setelah finance memproses refund ke status `processed`
        dan Xendit menyelesaikan transfer disbursement ke rekening customer.

        **Event yang diproses:**
        - `payout.succeeded` — transfer refund berhasil, status refund → `processed`.
        - `payout.failed` — transfer gagal, status refund ditandai failed.
        - `payout.reversed` — transfer dibatalkan oleh bank, status refund ditandai failed.

        **Catatan penting:**
        - Endpoint ini public (tanpa JWT), diverifikasi menggunakan header `x-callback-token`.
        - `data.reference_id` harus berisi format `refund-{refund_id}`.
        - Handler bersifat idempotent untuk event duplicate/retry.
      operationId: xenditRefundPayoutWebhook
      security: []
      parameters:
        - in: header
          name: x-callback-token
          required: true
          schema:
            type: string
          description: Token verifikasi webhook dari Xendit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/XenditPayoutWebhookPayload"
            example:
              business_id: 62c589ea1f995274c6fd8f47
              event: payout.succeeded
              data:
                id: p-out-f1f6b6a7-c307-4ea8-b650-7499888cf646
                reference_id: refund-62fe8a4b-52dd-48e4-9b98-7dc99fa288f0
                amount: 330000
                currency: IDR
                status: SUCCEEDED
                channel_code: ID_BCA
                failure_code: ""
                created: "2026-04-01T08:00:00Z"
                updated: "2026-04-01T08:00:05Z"
      responses:
        "200":
          description: Webhook diterima dan diproses (termasuk no-op/idempotent).
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/XenditWebhookResponse"
              examples:
                processed:
                  summary: Berhasil diproses
                  value:
                    message: webhook processed
                processedWithErrors:
                  summary: Diterima tapi ada error bisnis/internal
                  value:
                    message: webhook received with errors
                    error: failed to apply refund payout webhook update
        "400":
          description: Payload tidak valid.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/XenditWebhookResponse"
              example:
                message: invalid payload
        "401":
          description: Callback token tidak valid.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/XenditWebhookResponse"
              example:
                message: invalid callback token
  /api/v1/webhooks/xendit/refund:
    post:
      tags:
        - Xendit Webhook
      summary: Xendit Refund Gateway Webhook Callback
      description: |
        Endpoint callback dari Xendit untuk update status refund gateway (bukan disbursement).

        Dipanggil otomatis oleh Xendit saat refund via gateway (contoh: VA, QRIS)
        berhasil atau gagal diproses.

        **Event yang diproses:**
        - `refund.succeeded` — refund gateway berhasil, payment_status order → `refunded`.
        - `refund.failed` — refund gateway gagal, ditandai failed dengan `failure_code`.

        **Catatan penting:**
        - Endpoint ini public (tanpa JWT), diverifikasi menggunakan header `x-callback-token`.
        - `data.reference_id` harus berisi format `refund-{refund_id}`.
        - Handler bersifat idempotent.
        - Jika refund berhasil, backend juga mengupdate `payment_status` order menjadi `refunded`.
      operationId: xenditRefundGatewayWebhook
      security: []
      parameters:
        - in: header
          name: x-callback-token
          required: true
          schema:
            type: string
          description: Token verifikasi webhook dari Xendit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/XenditRefundWebhookPayload"
            example:
              event: refund.succeeded
              business_id: 62c589ea1f995274c6fd8f47
              created: "2026-04-01T10:00:00Z"
              data:
                id: rfd_abc123def456
                payment_id: pymnt_abc123
                invoice_id: inv_abc123
                amount: 114000
                payment_method_type: VIRTUAL_ACCOUNT
                channel_code: BCA
                currency: IDR
                status: SUCCEEDED
                reason: REQUESTED_BY_CUSTOMER
                reference_id: refund-53c9f7e8-2973-4972-9876-c044de07902f
                failure_code: ""
                created: "2026-04-01T09:30:00Z"
                updated: "2026-04-01T10:00:00Z"
      responses:
        "200":
          description: Webhook diterima dan diproses.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/XenditWebhookResponse"
              examples:
                processed:
                  summary: Berhasil diproses
                  value:
                    message: webhook processed
                processedWithErrors:
                  summary: Diterima tapi ada error
                  value:
                    message: webhook received with errors
                    error: failed to apply refund gateway webhook
        "400":
          description: Payload tidak valid.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/XenditWebhookResponse"
              example:
                message: invalid payload
        "401":
          description: Callback token tidak valid.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/XenditWebhookResponse"
              example:
                message: invalid callback token
