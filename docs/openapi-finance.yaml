openapi: 3.0.3
info:
  title: UmrahMart - Finance API
  version: 1.0.0
  description: Dokumentasi OpenAPI 3 untuk endpoint finance dan chat operasional yang digunakan role finance.
servers:
  - url: https://haji-umroh-store-api.jauhar.id
    description: Local development server
tags:
  - name: Finance Auth
    description: Autentikasi untuk role finance.
  - name: Finance Dashboard
    description: Ringkasan metrik keuangan dan transaksi hari ini.
  - name: Finance Transactions
    description: Transaksi dan pembayaran.
  - name: Finance Payouts
    description: Settlement dan payout vendor.
  - name: Finance Refunds
    description: Refund dan dispute.
  - name: Finance Reports
    description: Laporan keuangan bulanan.
  - name: Finance Chat
    description: Chat operasional finance untuk komunikasi dengan admin, CS, dan UMKM.
  - name: Xendit Webhook
    description: Endpoint callback webhook dari Xendit.
security:
  - BearerAuth: []
paths:
  /api/v1/users/login:
    post:
      tags:
        - Finance Auth
      summary: Login finance
      description: |
        Autentikasi user dengan role `finance` menggunakan endpoint user login.
        Mengembalikan JWT token dan data user.
      operationId: loginFinance
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserLoginRequest"
            example:
              email: finance@dev.local
              password: Password123!
      responses:
        "200":
          description: Login berhasil.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessUserLoginEnvelope"
              example:
                success: true
                message: login successful
                data:
                  token: <JWT_TOKEN>
                  user:
                    id: 7d2e9f31-09af-4d49-adf3-47bb2b9e2010
                    email: finance@dev.local
                    full_name: Dev Finance
                    birth_date: null
                    phone: "081200000004"
                    status: active
                    email_verified_at: "2026-02-10T10:20:30Z"
                    role: finance
                    created_at: "2026-02-10T10:20:30Z"
                    updated_at: "2026-02-10T10:20:30Z"
                errors: null
                meta: null
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
  /api/v1/users/orders/{orderId}/refunds:
    post:
      tags:
        - Finance Refunds
      summary: Ajukan refund oleh customer
      description: |
        Customer mengajukan refund untuk order miliknya dengan:
        - memilih alasan refund dari master `return_reasons` (`return_reason_id`),
        - menyertakan rekening tujuan,
        - opsional melampirkan bukti (maks. 5 foto + 1 video) via object key hasil presign upload.

        Data rekening ini akan disimpan dan digunakan saat finance memproses refund ke status `processed`.
      operationId: requestOrderRefundByCustomer
      parameters:
        - name: orderId
          in: path
          required: true
          description: ID order (UUID).
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRefundRequest"
      responses:
        "200":
          description: Permintaan refund berhasil dibuat.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessCreateOrderRefundEnvelope"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "409":
          description: Sudah ada refund aktif untuk order ini.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                message: refund request already exists for this order
                data: null
                errors: null
                meta: null
        "422":
          description: Order tidak eligible untuk pengajuan refund.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                message: order is not eligible for refund request
                data: null
                errors: null
                meta: null
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
  /api/v1/users/orders/{orderId}/refunds/evidence/presign:
    post:
      tags:
        - Finance Refunds
      summary: Presign upload bukti refund oleh customer
      description: |
        Membuat URL upload ter-sign untuk bukti refund (foto/video) sebelum submit refund request.
      operationId: presignOrderRefundEvidenceByCustomer
      parameters:
        - name: orderId
          in: path
          required: true
          description: ID order (UUID).
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresignRefundEvidenceRequest"
      responses:
        "200":
          description: Presigned URL berhasil dibuat.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessPresignRefundEvidenceEnvelope"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "422":
          description: Content-Type evidence tidak didukung.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                message: invalid refund evidence content type
                data: null
                errors: null
                meta: null
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
  /api/v1/users/orders/{orderId}/refunds/destination:
    post:
      tags:
        - Finance Refunds
      summary: Submit rekening tujuan refund oleh customer
      description: |
        Customer menyerahkan atau memperbarui data rekening bank tujuan refund.

        Endpoint ini digunakan saat refund method = `disbursement` (karena gateway tidak support
        refund otomatis, contoh: e-wallet) dan status refund masih `awaiting_destination`.

        Customer bisa menggunakan rekening yang sudah tersimpan (`user_bank_account_id`)
        atau memasukkan data rekening baru secara manual. Jika `save_bank_account: true`,
        rekening baru akan otomatis disimpan ke profil customer.
      operationId: submitRefundDestinationByCustomer
      parameters:
        - name: orderId
          in: path
          required: true
          description: ID order (UUID).
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitRefundDestinationRequest"
            example:
              user_bank_account_id: null
              destination_channel_code: ID_BCA
              destination_bank_name: Bank Central Asia
              destination_account_number: "1234567890"
              destination_account_holder_name: Budi Santoso
              save_bank_account: true
      responses:
        "200":
          description: Rekening tujuan refund berhasil disimpan.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessSubmitRefundDestinationEnvelope"
              example:
                success: true
                message: refund destination submitted successfully
                data:
                  refund_id: 53c9f7e8-2973-4972-9876-c044de07902f
                  status: requested
                  message: Data rekening tujuan refund berhasil disimpan. Tim finance akan memproses refund Anda.
                errors: null
                meta: null
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "409":
          description: Refund sudah memiliki rekening tujuan atau sudah diproses.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                message: refund destination already submitted
                data: null
                errors: null
                meta: null
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
  /api/v1/finance/dashboard:
    get:
      tags:
        - Finance Dashboard
      summary: Dashboard keuangan
      operationId: financeDashboard
      parameters:
        - name: month
          in: query
          description: Bulan dalam format YYYY-MM (UTC). Default bulan sekarang.
          required: false
          schema:
            type: string
            example: "2026-01"
      responses:
        "200":
          description: Dashboard keuangan berhasil diambil.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessFinanceDashboardEnvelope"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
  /api/v1/finance/transactions:
    get:
      tags:
        - Finance Transactions
      summary: Daftar transaksi & pembayaran
      operationId: listFinanceTransactions
      parameters:
        - $ref: "#/components/parameters/MonthParam"
        - $ref: "#/components/parameters/DateFromParam"
        - $ref: "#/components/parameters/DateToParam"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/SearchParam"
        - name: status
          in: query
          description: Filter status pembayaran.
          required: false
          schema:
            type: string
            enum:
              - pending
              - paid
              - failed
              - expired
              - refunded
      responses:
        "200":
          description: Transaksi berhasil diambil.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessFinanceTransactionListEnvelope"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
  /api/v1/finance/transactions/export:
