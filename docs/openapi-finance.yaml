components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  headers:
    RequestIDHeader:
      description: ID unik request dari middleware RequestID.
      schema:
        type: string
        example: 9e0d6f87-89ed-4ed5-bf74-b0c7610ce9cf
  parameters:
    MonthParam:
      name: month
      in: query
      description: Bulan dalam format YYYY-MM (WIB/UTC+7). Default bulan sekarang.
      required: false
      schema:
        type: string
        example: "2026-01"
    DateFromParam:
      name: date_from
      in: query
      description: Tanggal awal filter dalam format YYYY-MM-DD (WIB/UTC+7, inklusif).
      required: false
      schema:
        type: string
        format: date
        example: "2026-01-10"
    DateToParam:
      name: date_to
      in: query
      description: Tanggal akhir filter dalam format YYYY-MM-DD (WIB/UTC+7, inklusif).
      required: false
      schema:
        type: string
        format: date
        example: "2026-01-20"
    PageParam:
      name: page
      in: query
      description: Nomor halaman (default 1).
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 1
    LimitParam:
      name: limit
      in: query
      description: Jumlah item per halaman (default 10). Nilai <1 atau >100 akan dinormalisasi server menjadi 10.
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 10
    SearchParam:
      name: search
      in: query
      description: Pencarian case-insensitive.
      required: false
      schema:
        type: string
    ConversationIDParam:
      name: conversationId
      in: path
      description: UUID conversation.
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequestResponse:
      description: Request tidak valid.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestIDHeader"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            success: false
            message: validation failed
            data: null
            errors: invalid status
            meta: null
    UnauthorizedResponse:
      description: Token tidak valid atau tidak ada.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestIDHeader"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            success: false
            message: invalid or expired token
            data: null
            errors: null
            meta: null
    ForbiddenResponse:
      description: User tidak memiliki izin role finance.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestIDHeader"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            success: false
            message: insufficient permissions
            data: null
            errors: null
            meta: null
    NotFoundResponse:
      description: Data tidak ditemukan.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestIDHeader"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            success: false
            message: not found
            data: null
            errors: null
            meta: null
    InternalServerErrorResponse:
      description: Internal server error.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestIDHeader"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            success: false
            message: internal server error
            data: null
            errors: null
            meta: null
