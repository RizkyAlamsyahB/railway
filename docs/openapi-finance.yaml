  /api/v1/finance/refunds/{id}/status:
    patch:
      tags:
        - Finance Refunds
      summary: Update status refund (approve / reject / process)
      description: |
        Mengubah status refund oleh finance. Transisi yang diizinkan:

        | Status Awal   | Status Baru   | Aksi                                       |
        |---------------|---------------|--------------------------------------------|
        | `requested`   | `approved`    | Menyetujui refund, menunggu proses transfer |
        | `requested`   | `rejected`    | Menolak pengajuan refund                    |
        | `approved`    | `processed`   | Menginisiasi transfer refund via Xendit     |

        **Flow Approved → Processed (trigger Xendit disbursement):**

        Saat status diubah ke `processed`, backend akan:
        1. Mengecek apakah settlement order sudah completed — jika ya, return error 409.
        2. Mengecek refund strategy berdasarkan `payment_method` dan `payment_channel`.
        3. Menentukan data rekening tujuan (dari request override atau dari data refund yang ada).
        4. Menginisiasi **Xendit Payout** (disbursement) ke rekening tujuan.
        5. Status refund tetap `approved` sampai webhook Xendit mengkonfirmasi.

        **Override data rekening tujuan (opsional untuk status=processed):**
        - `destination_channel_code` — kode channel Xendit (contoh: `ID_BCA`, `ID_MANDIRI`).
        - `destination_bank_name` — nama bank.
        - `destination_account_number` — nomor rekening.
        - `destination_account_holder_name` — nama pemilik rekening.
        Jika tidak diisi, menggunakan data rekening yang sudah ada di refund record.

        **Disbursement fallback options:**
        - `use_disbursement_fallback_for_qr` (default: `true`) — QR refund fallback ke bank disbursement.
        - `use_disbursement_fallback_for_ewallet` (default: `true`) — e-wallet refund fallback ke bank disbursement.
      operationId: updateFinanceRefundStatus
      parameters:
        - name: id
          in: path
          description: ID refund (UUID).
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRefundStatusRequest"
            examples:
              approve:
                summary: Approve refund
                value:
                  status: approved
              reject:
                summary: Reject refund
                value:
                  status: rejected
              process_with_existing_account:
                summary: Process refund (gunakan rekening yang sudah ada)
                value:
                  status: processed
              process_with_override:
                summary: Process refund (override rekening tujuan)
                value:
                  status: processed
                  destination_channel_code: ID_BCA
                  destination_bank_name: Bank Central Asia
                  destination_account_number: "1234567890"
                  destination_account_holder_name: Budi Santoso
      responses:
        "200":
          description: Status refund berhasil diperbarui.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessStatusActionEnvelope"
              examples:
                approved:
                  summary: Refund di-approve
                  value:
                    success: true
                    message: refund status updated successfully
                    data:
                      id: 53c9f7e8-2973-4972-9876-c044de07902f
                      status: approved
                    errors: null
                    meta: null
                rejected:
                  summary: Refund ditolak
                  value:
                    success: true
                    message: refund status updated successfully
                    data:
                      id: 53c9f7e8-2973-4972-9876-c044de07902f
                      status: rejected
                    errors: null
                    meta: null
                processed:
                  summary: Refund diproses — disbursement diinisiasi, menunggu webhook
                  value:
                    success: true
                    message: refund status updated successfully
                    data:
                      id: 53c9f7e8-2973-4972-9876-c044de07902f
                      status: approved
                    errors: null
                    meta: null
        "400":
          description: |
            Request tidak valid. Kemungkinan penyebab:
            - ID refund bukan UUID valid
            - Status tidak valid (`ErrInvalidRefundStatus`)
            - Transisi status tidak diizinkan (`ErrInvalidRefundTransition`)
            - Strategy refund tidak didukung (`ErrRefundStrategyNotSupported`)
            - Data rekening tujuan belum lengkap (`ErrRefundDestinationRequired`)
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                invalid_transition:
                  summary: Transisi status tidak diizinkan
                  value:
                    success: false
                    message: invalid refund status transition
                    data: null
                    errors: null
                    meta: null
                destination_required:
                  summary: Rekening tujuan belum lengkap
                  value:
                    success: false
                    message: refund destination account is required
                    data: null
                    errors: null
                    meta: null
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "409":
          description: |
            Refund tidak dapat diproses karena:
            - Settlement order sudah completed (`ErrRefundBlockedByCompletedSettlement`)
            - Payout refund sedang dalam proses (`ErrRefundPayoutInProgress`)
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                settlement_completed:
                  summary: Settlement sudah completed
                  value:
                    success: false
                    message: refund cannot be processed because order settlement is already completed
                    data: null
                    errors: null
                    meta: null
                payout_in_progress:
                  summary: Payout sudah sedang berjalan
                  value:
                    success: false
                    message: refund payout is already in progress
                    data: null
                    errors: null
                    meta: null
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "502":
          description: Gagal menginisiasi disbursement refund ke Xendit.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIDHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                message: failed to initiate refund disbursement
                data: null
                errors: null
                meta: null
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
  /api/v1/finance/payouts/{id}/status:
    patch:
      tags:
        - Finance Payouts
      summary: Update status payout
      operationId: updateFinancePayoutStatus
      parameters:
        - name: id
          in: path
          description: ID payout batch (UUID).
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePayoutStatusRequest"
      responses:
        "200":
