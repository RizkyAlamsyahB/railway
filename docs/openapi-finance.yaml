    CreateOrderRefundRequest:
      type: object
      required:
        - return_reason_id
        - destination_bank_name
        - destination_account_number
        - destination_account_holder_name
      properties:
        return_reason_id:
          type: integer
          minimum: 1
          description: ID alasan refund dari master `return_reasons`.
          example: 1
        description:
          type: string
          maxLength: 1000
          nullable: true
          example: Kemasan penyok dan isi pecah saat diterima.
        destination_channel_code:
          type: string
          maxLength: 40
          example: ID_BCA
        destination_bank_name:
          type: string
          maxLength: 80
          example: Bank Central Asia
        destination_account_number:
          type: string
          maxLength: 64
          example: "1234567890"
        destination_account_holder_name:
          type: string
          maxLength: 120
          example: Budi Santoso
        image_object_keys:
          type: array
          maxItems: 5
          description: Daftar object key bukti gambar hasil endpoint presign.
          items:
            type: string
            example: refund-evidences/19594be3-d0fe-425e-aa6b-0e73b354c32f/2026/04/01/c4f34f8e-7512-4de2-b91a-3d4d9fda76fa
        video_object_key:
          type: string
          nullable: true
          description: Object key bukti video hasil endpoint presign (maksimal 1).
          example: refund-evidences/19594be3-d0fe-425e-aa6b-0e73b354c32f/2026/04/01/3f954fee-f2f9-4263-9d26-74a9d2fae17f
    CreateOrderRefundResponse:
      type: object
      required:
        - refund_id
        - order_id
        - status
        - amount
        - return_reason_id
        - reason
        - destination_channel_code
        - destination_bank_name
        - destination_account_holder_name
        - destination_account_number_last4
        - requested_at
      properties:
        refund_id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - requested
            - approved
            - rejected
            - processed
          example: requested
        amount:
          type: number
          format: double
          example: 452500
        return_reason_id:
          type: integer
          example: 1
        reason:
          type: string
          example: Barang rusak
        description:
          type: string
          nullable: true
          example: Kemasan penyok dan isi pecah saat diterima.
        destination_channel_code:
          type: string
          example: ID_BCA
        destination_bank_name:
          type: string
          example: Bank Central Asia
        destination_account_holder_name:
          type: string
          example: Budi Santoso
        destination_account_number_last4:
          type: string
          example: "7890"
        image_urls:
          type: array
          items:
            type: string
            format: uri
          example:
            - https://cdn.example.com/refund-evidences/19594be3-d0fe-425e-aa6b-0e73b354c32f/image-1.jpg
            - https://cdn.example.com/refund-evidences/19594be3-d0fe-425e-aa6b-0e73b354c32f/image-2.jpg
        video_url:
          type: string
          format: uri
          nullable: true
          example: https://cdn.example.com/refund-evidences/19594be3-d0fe-425e-aa6b-0e73b354c32f/video-1.mp4
        requested_at:
          type: string
          format: date-time
          example: "2026-04-01T10:00:00Z"
    PresignRefundEvidenceRequest:
      type: object
      required:
        - content_type
      properties:
        content_type:
          type: string
          description: |
            MIME type file yang akan di-upload.
            Allowed: `image/png`, `image/jpeg`, `image/webp`, `video/mp4`.
          example: image/jpeg
    PresignRefundEvidenceResponse:
      type: object
      required:
        - upload_url
        - object_key
        - content_type
        - expires_in
      properties:
        upload_url:
          type: string
          format: uri
          example: https://s3.example.com/bucket/refund-evidences/.../upload-signature
        object_key:
          type: string
          example: refund-evidences/19594be3-d0fe-425e-aa6b-0e73b354c32f/2026/04/01/c4f34f8e-7512-4de2-b91a-3d4d9fda76fa
        content_type:
          type: string
          example: image/jpeg
        expires_in:
          type: integer
          format: int32
          example: 900
    SubmitRefundDestinationRequest:
      type: object
      properties:
        user_bank_account_id:
          type: string
          format: uuid
          nullable: true
          description: |
            ID rekening bank customer yang sudah tersimpan.
            Jika diisi, data rekening dari profil customer akan digunakan
            dan field manual di bawah diabaikan.
          example: null
        destination_channel_code:
          type: string
          maxLength: 40
          description: Kode channel Xendit (contoh ID_BCA, ID_MANDIRI).
          example: ID_BCA
        destination_bank_name:
          type: string
          maxLength: 80
          description: Nama bank tujuan.
          example: Bank Central Asia
        destination_account_number:
          type: string
          maxLength: 64
          description: Nomor rekening tujuan.
          example: "1234567890"
        destination_account_holder_name:
          type: string
          maxLength: 120
          description: Nama pemilik rekening.
          example: Budi Santoso
        save_bank_account:
          type: boolean
          description: Jika true, rekening baru akan disimpan ke profil customer.
          default: false
          example: true
    SubmitRefundDestinationResponse:
      type: object
      required:
        - refund_id
        - status
        - message
      properties:
        refund_id:
          type: string
          format: uuid
        status:
          type: string
          example: requested
        message:
          type: string
          example: Data rekening tujuan refund berhasil disimpan. Tim finance akan memproses refund Anda.
    XenditRefundWebhookData:
      type: object
      description: Data object dari Xendit refund gateway webhook.
      properties:
        id:
          type: string
          description: ID refund dari Xendit.
          example: rfd_abc123def456
        payment_id:
          type: string
          description: ID payment dari Xendit.
          example: pymnt_abc123
        invoice_id:
          type: string
          description: ID invoice dari Xendit.
          example: inv_abc123
        amount:
          type: number
          format: double
          example: 114000
        payment_method_type:
          type: string
          description: Tipe metode pembayaran (VIRTUAL_ACCOUNT, EWALLET, QR_CODE, dll).
          example: VIRTUAL_ACCOUNT
        channel_code:
          type: string
          example: BCA
        currency:
          type: string
          example: IDR
        status:
          type: string
          description: Status refund dari Xendit.
          enum:
            - SUCCEEDED
            - FAILED
          example: SUCCEEDED
        reason:
          type: string
          example: REQUESTED_BY_CUSTOMER
        reference_id:
          type: string
          description: ID referensi internal (format `refund-{refund_id}`).
          example: refund-53c9f7e8-2973-4972-9876-c044de07902f
        failure_code:
          type: string
          nullable: true
          example: null
        created:
          type: string
          format: date-time
        updated:
          type: string
          format: date-time
    XenditRefundWebhookPayload:
      type: object
      required:
        - event
        - data
      properties:
        event:
          type: string
          description: Event refund webhook.
          enum:
            - refund.succeeded
            - refund.failed
          example: refund.succeeded
        business_id:
          type: string
          description: ID bisnis Xendit pengirim webhook.
          example: 62c589ea1f995274c6fd8f47
        created:
          type: string
          format: date-time
        data:
          $ref: "#/components/schemas/XenditRefundWebhookData"
    UpdateRefundStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          description: |
            Status refund. Alias "pending" akan dipetakan ke "requested".
            Jika status = processed, backend akan menginisiasi transfer refund (disbursement).
          enum:
            - requested
            - approved
            - rejected
            - processed
          example: approved
        destination_channel_code:
          type: string
          description: Kode channel payout Xendit (contoh ID_BCA). Digunakan saat status=processed.
          example: ID_BCA
        destination_bank_name:
          type: string
          description: Nama bank tujuan refund. Digunakan saat status=processed.
          example: Bank Central Asia
        destination_account_number:
          type: string
          description: Nomor rekening tujuan refund. Digunakan saat status=processed.
          example: "1234567890"
        destination_account_holder_name:
          type: string
          description: Nama pemilik rekening tujuan refund. Digunakan saat status=processed.
          example: Budi Santoso
        use_disbursement_fallback_for_qr:
          type: boolean
          description: |
            Jika true (default), QR refund yang belum terintegrasi gateway akan fallback ke disbursement.
          example: true
        use_disbursement_fallback_for_ewallet:
          type: boolean
          description: |
            Jika true (default), eWallet refund yang belum terintegrasi gateway akan fallback ke disbursement.
          example: true
    UpdatePayoutStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          description: Status payout. Gunakan "on_hold" untuk status hold.
          enum:
            - schedule
            - completed
            - failed
            - on_hold
          example: schedule
    XenditPayoutWebhookData:
      type: object
      required:
        - reference_id
      properties:
        id:
          type: string
          description: ID payout dari Xendit.
          example: p-out-f1f6b6a7-c307-4ea8-b650-7499888cf646
        reference_id:
          type: string
          description: ID referensi internal dari sistem (format `refund-{refund_id}`).
          example: refund-62fe8a4b-52dd-48e4-9b98-7dc99fa288f0
        amount:
          type: number
          format: double
          description: Nominal payout.
          example: 330000
        currency:
          type: string
          example: IDR
        status:
          type: string
          description: Status payout dari Xendit.
          example: SUCCEEDED
        channel_code:
          type: string
          example: ID_BCA
        failure_code:
          type: string
          nullable: true
          example: null
        created:
          type: string
          format: date-time
          nullable: true
        updated:
          type: string
          format: date-time
          nullable: true
    XenditPayoutWebhookPayload:
      type: object
      required:
        - event
        - data
      properties:
        business_id:
          type: string
