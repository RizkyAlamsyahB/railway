openapi: 3.0.3
info:
  title: Haji Umroh Store BE - Catalog API
  version: 1.0.0
  description: Dokumentasi OpenAPI 3 untuk endpoint katalog publik (produk, kategori, dan jasa pengiriman).
servers:
  - url: http://localhost:8080
    description: Local development server
tags:
  - name: Products
    description: Operasi untuk daftar produk marketplace.
  - name: Product Reviews
    description: Operasi untuk membaca ulasan produk dan ringkasan rating.
  - name: Categories
    description: Operasi untuk daftar kategori produk.
  - name: Shipping Services
    description: Operasi untuk daftar jasa pengiriman.
paths:
  /api/v1/categories:
    get:
      tags:
        - Categories
      summary: Daftar kategori aktif
      description: |
        Mengembalikan daftar semua kategori produk yang aktif (`is_active = true`),
        diurutkan berdasarkan nama secara alfabet (A-Z).

        Endpoint ini bersifat **publik** dan tidak memerlukan autentikasi.

        Kategori mendukung struktur hierarki melalui field `parent_id`.
        Kategori root memiliki `parent_id: null`, sedangkan sub-kategori
        merujuk ke ID kategori induknya.
      operationId: listCategories
      security: []
      responses:
        '200':
          description: Daftar kategori berhasil diambil.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessCategoryListEnvelope'
              example:
                success: true
                message: categories retrieved successfully
                data:
                  - id: c1d2e3f4-a5b6-7890-cdef-1234567890ab
                    parent_id: null
                    name: Perlengkapan Ibadah
                    slug: perlengkapan-ibadah
                    is_active: true
                  - id: d2e3f4a5-b6c7-8901-def0-234567890bcd
                    parent_id: c1d2e3f4-a5b6-7890-cdef-1234567890ab
                    name: Sajadah
                    slug: sajadah
                    is_active: true
                  - id: e3f4a5b6-c7d8-9012-ef01-345678901cde
                    parent_id: null
                    name: Oleh-Oleh Khas
                    slug: oleh-oleh-khas
                    is_active: true
                  - id: f4a5b6c7-d8e9-0123-f012-456789012def
                    parent_id: e3f4a5b6-c7d8-9012-ef01-345678901cde
                    name: Kurma
                    slug: kurma
                    is_active: true
                errors: null
                meta: null
        '500':
          description: Internal server error.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: failed to list categories
                data: null
                errors: null
                meta: null
  /api/v1/shipping-services:
    get:
      tags:
        - Shipping Services
      summary: Daftar jasa pengiriman aktif
      description: |
        Mengembalikan daftar semua jasa pengiriman yang aktif (`is_active = true`),
        diurutkan berdasarkan nama secara alfabet (A-Z).

        Endpoint ini bersifat **publik** dan tidak memerlukan autentikasi.

        ID dari shipping service digunakan saat membuat produk
        (`POST /api/v1/vendors/products` field `shipping_service_ids`).
      operationId: listShippingServices
      security: []
      responses:
        '200':
          description: Daftar jasa pengiriman berhasil diambil.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessShippingServiceListEnvelope'
              example:
                success: true
                message: shipping services retrieved successfully
                data:
                  - id: d1e2f3a4-b5c6-7890-def0-234567890abc
                    code: jne_reg
                    name: JNE Reguler
                    is_active: true
                    created_at: "2026-01-01T00:00:00Z"
                  - id: e2f3a4b5-c6d7-8901-ef01-345678901bcd
                    code: jnt_ez
                    name: "J&T Express"
                    is_active: true
                    created_at: "2026-01-01T00:00:00Z"
                  - id: f3a4b5c6-d7e8-9012-f012-456789012cde
                    code: sicepat_reg
                    name: SiCepat Reguler
                    is_active: true
                    created_at: "2026-01-01T00:00:00Z"
                  - id: a4b5c6d7-e8f9-0123-0123-567890123def
                    code: pos_kilat
                    name: Pos Kilat Khusus
                    is_active: true
                    created_at: "2026-01-01T00:00:00Z"
                errors: null
                meta: null
        '500':
          description: Internal server error.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: failed to list shipping services
                data: null
                errors: null
                meta: null
  /api/v1/products:
    get:
      tags:
        - Products
      summary: Daftar produk yang bisa dibeli customer
      description: |
        Mengembalikan daftar produk marketplace yang dapat dibeli customer.
        Produk yang ditampilkan hanya yang:
        - status `published`
        - memiliki minimal 1 varian aktif (`is_active = true`)
        - stok varian lebih dari 0 (`stock_on_hand > 0`)

        Endpoint ini bersifat **publik** dan tidak memerlukan autentikasi.

        Field response produk saat ini:
        - `id`
        - `name`
        - `price` (harga varian termurah yang memenuhi kriteria)
        - `rating_average` (rata-rata rating produk)
        - `rating_count` (jumlah review)
      operationId: listProducts
      security: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Nomor halaman.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          description: Jumlah item per halaman.
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [newest, cheapest]
            default: newest
          description: Urutan data. `newest` untuk terbaru, `cheapest` untuk termurah.
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Pencarian nama produk (case-insensitive).
      responses:
        '200':
          description: Daftar produk berhasil diambil.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessProductListEnvelope'
              example:
                success: true
                message: products retrieved successfully
                data:
                  - id: 0f7f4fd6-f55f-4f38-8d3b-7acef44ef8f2
                    name: Sajadah Premium
                    price: 150000
                    rating_average: 4.7
                    rating_count: 120
                  - id: db04f006-7498-4a96-a242-8ab9cf834248
                    name: Kurma Ajwa 500gr
                    price: 90000
                    rating_average: 0
                    rating_count: 0
                errors: null
                meta:
                  page: 1
                  limit: 10
                  total_items: 23
                  total_pages: 3
        '500':
          description: Internal server error.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: failed to list products
                data: null
                errors: null
                meta: null
  /api/v1/products/{id}:
    get:
      tags:
        - Products
      summary: Detail produk berdasarkan ID
      description: |
        Mengembalikan detail produk untuk halaman detail customer berdasarkan ID produk.
        Endpoint ini bersifat **publik** dan tidak memerlukan autentikasi.

        Aturan visibilitas:
        - hanya produk dengan status `published` yang dapat diakses
        - varian yang dikembalikan hanya varian aktif (`is_active = true`)
        - URL gambar pada response sudah berupa URL penuh
      operationId: getProductDetail
      security: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID produk.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detail produk berhasil diambil.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessProductDetailEnvelope'
              example:
                success: true
                message: product detail retrieved successfully
                data:
                  id: 0f7f4fd6-f55f-4f38-8d3b-7acef44ef8f2
                  name: Sajadah Premium
                  slug: sajadah-premium
                  description: Sajadah premium bahan lembut untuk ibadah harian.
                  status: published
                  halal_ai_status: pending
                  category:
                    id: c1d2e3f4-a5b6-7890-cdef-1234567890ab
                    name: Perlengkapan Ibadah
                    slug: perlengkapan-ibadah
                  vendor:
                    id: b1c2d3e4-f5a6-7890-bcde-1234567890aa
                    display_name: Toko Oleh-Oleh Mabrur
                  rating_average: 4.7
                  rating_count: 120
                  images:
                    - id: 8ea58d2f-c1a6-4fd3-9b37-67a743f57272
                      url: https://cdn.example.com/products/0f7f4fd6-f55f-4f38-8d3b-7acef44ef8f2/image-1.jpg
                      is_primary: true
                      sort_order: 0
                  variants:
                    - id: 2e9f4fd6-f55f-4f38-8d3b-7acef44ef111
                      sku: MBR-SJD-001
                      variant_name: Default
                      price: 150000
                      currency: IDR
                      stock_on_hand: 20
                      weight_gram: 500
                      is_default: true
                      is_active: true
                  created_at: "2026-03-01T10:00:00Z"
                  updated_at: "2026-03-04T10:00:00Z"
                errors: null
                meta: null
        '400':
          description: Parameter path tidak valid.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: invalid product ID
                data: null
                errors: id must be a valid UUID
                meta: null
        '404':
          description: Produk tidak ditemukan atau tidak tersedia untuk customer.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: product not found
                data: null
                errors: null
                meta: null
        '500':
          description: Internal server error.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: internal server error
                data: null
                errors: null
                meta: null
  /api/v1/products/{id}/reviews:
    get:
      tags:
        - Product Reviews
      summary: Daftar ulasan produk
      description: |
        Mengembalikan daftar ulasan (`published`) untuk sebuah produk.
        Endpoint ini bersifat **publik** dan tidak memerlukan autentikasi.

        Data diurutkan berdasarkan review terbaru.
      operationId: listProductReviews
      security: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID produk.
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Nomor halaman.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          description: Jumlah item per halaman.
      responses:
        '200':
          description: Daftar ulasan berhasil diambil.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessProductReviewListEnvelope'
              example:
                success: true
                message: product reviews retrieved successfully
                data:
                  - review_id: 8ea58d2f-c1a6-4fd3-9b37-67a743f57272
                    user_id: c17f4e2f-4bb4-44b4-9a5d-ff074d9fd7c9
                    reviewer_name: Ahmad Fauzi
                    rating: 5
                    review_text: Produk bagus, kualitas sesuai deskripsi.
                    image_urls:
                      - https://cdn.example.com/reviews/2026/03/04/obj-1
                    created_at: "2026-03-04T10:00:00Z"
                errors: null
                meta:
                  page: 1
                  limit: 10
                  total_items: 23
                  total_pages: 3
        '400':
          description: Parameter path/query tidak valid.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: invalid product ID
                data: null
                errors: id must be a valid UUID
                meta: null
        '500':
          description: Internal server error.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: internal server error
                data: null
                errors: null
                meta: null
  /api/v1/products/{id}/review-summary:
    get:
      tags:
        - Product Reviews
      summary: Ringkasan rating produk
      description: |
        Mengembalikan ringkasan rating produk:
        - `average_rating`
        - `total_reviews`
        - distribusi bintang `0..5`

        Endpoint ini bersifat **publik** dan tidak memerlukan autentikasi.
      operationId: getProductReviewSummary
      security: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID produk.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Ringkasan rating berhasil diambil.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessProductReviewSummaryEnvelope'
              example:
                success: true
                message: product review summary retrieved successfully
                data:
                  product_id: 0f7f4fd6-f55f-4f38-8d3b-7acef44ef8f2
                  average_rating: 4.67
                  total_reviews: 120
                  distribution:
                    - star: 0
                      count: 0
                      percentage: 0
                    - star: 1
                      count: 4
                      percentage: 3.33
                    - star: 2
                      count: 6
                      percentage: 5
                    - star: 3
                      count: 10
                      percentage: 8.33
                    - star: 4
                      count: 30
                      percentage: 25
                    - star: 5
                      count: 70
                      percentage: 58.33
                errors: null
                meta: null
        '400':
          description: Parameter path tidak valid.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: invalid product ID
                data: null
                errors: id must be a valid UUID
                meta: null
        '500':
          description: Internal server error.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestIDHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: internal server error
                data: null
                errors: null
                meta: null
components:
  headers:
    RequestIDHeader:
      description: ID unik request dari middleware RequestID.
      schema:
        type: string
        example: 9e0d6f87-89ed-4ed5-bf74-b0c7610ce9cf
  schemas:
    Category:
      type: object
      required:
        - id
        - name
        - slug
        - is_active
      properties:
        id:
          type: string
          format: uuid
          description: ID kategori.
          example: c1d2e3f4-a5b6-7890-cdef-1234567890ab
        parent_id:
          type: string
          format: uuid
          nullable: true
          description: |
            ID kategori induk. `null` untuk kategori root (level atas).
            Sub-kategori merujuk ke ID kategori induknya.
          example: null
        name:
          type: string
          description: Nama kategori.
          example: Perlengkapan Ibadah
        slug:
          type: string
          description: URL-friendly slug kategori.
          example: perlengkapan-ibadah
        is_active:
          type: boolean
          description: Status aktif kategori. Hanya kategori aktif yang ditampilkan.
          example: true
    ShippingService:
      type: object
      required:
        - id
        - code
        - name
        - is_active
        - created_at
      properties:
        id:
          type: string
          format: uuid
          description: ID jasa pengiriman. Gunakan ID ini saat membuat produk.
          example: d1e2f3a4-b5c6-7890-def0-234567890abc
        code:
          type: string
          description: Kode unik jasa pengiriman.
          example: jne_reg
        name:
          type: string
          description: Nama jasa pengiriman.
          example: JNE Reguler
        is_active:
          type: boolean
          description: Status aktif jasa pengiriman.
          example: true
        created_at:
          type: string
          format: date-time
          description: Waktu pembuatan record.
          example: "2026-01-01T00:00:00Z"
    ProductListItem:
      type: object
      required:
        - id
        - name
        - price
        - rating_average
        - rating_count
      properties:
        id:
          type: string
          format: uuid
          description: ID produk.
          example: 0f7f4fd6-f55f-4f38-8d3b-7acef44ef8f2
        name:
          type: string
          description: Nama produk.
          example: Sajadah Premium
        price:
          type: number
          format: double
          description: Harga varian termurah yang tersedia untuk dibeli.
          example: 150000
        rating_average:
          type: number
          format: double
          description: Rata-rata rating produk (0 jika belum ada review).
          example: 4.7
        rating_count:
          type: integer
          format: int64
          description: Jumlah total review produk.
          example: 120
    ProductDetailCategory:
      type: object
      required:
        - id
        - name
        - slug
      properties:
        id:
          type: string
          format: uuid
          description: ID kategori produk.
          example: c1d2e3f4-a5b6-7890-cdef-1234567890ab
        name:
          type: string
          description: Nama kategori produk.
          example: Perlengkapan Ibadah
        slug:
          type: string
          description: Slug kategori produk.
          example: perlengkapan-ibadah
    ProductDetailVendor:
      type: object
      required:
        - id
        - display_name
      properties:
        id:
          type: string
          format: uuid
          description: ID vendor pemilik produk.
          example: b1c2d3e4-f5a6-7890-bcde-1234567890aa
        display_name:
          type: string
          description: Nama toko yang ditampilkan ke customer.
          example: Toko Oleh-Oleh Mabrur
    ProductDetailImageItem:
      type: object
      required:
        - id
        - url
        - is_primary
        - sort_order
      properties:
        id:
          type: string
          format: uuid
          description: ID gambar produk.
          example: 8ea58d2f-c1a6-4fd3-9b37-67a743f57272
        url:
          type: string
          format: uri
          description: URL penuh gambar produk.
          example: https://cdn.example.com/products/0f7f4fd6-f55f-4f38-8d3b-7acef44ef8f2/image-1.jpg
        is_primary:
          type: boolean
          description: Menandakan gambar utama produk.
          example: true
        sort_order:
          type: integer
          description: Urutan tampilan gambar.
          example: 0
    ProductDetailVariantItem:
      type: object
      required:
        - id
        - sku
        - variant_name
        - price
        - currency
        - stock_on_hand
        - is_default
        - is_active
      properties:
        id:
          type: string
          format: uuid
          description: ID varian.
          example: 2e9f4fd6-f55f-4f38-8d3b-7acef44ef111
        sku:
          type: string
          description: SKU varian.
          example: MBR-SJD-001
        variant_name:
          type: string
          description: Nama varian.
          example: Default
        price:
          type: number
          format: double
          description: Harga varian.
          example: 150000
        currency:
          type: string
          description: Mata uang harga.
          example: IDR
        stock_on_hand:
          type: integer
          description: Jumlah stok varian.
          example: 20
        weight_gram:
          type: integer
          nullable: true
          description: Berat varian dalam gram.
          example: 500
        is_default:
          type: boolean
          description: Menandakan varian default.
          example: true
        is_active:
          type: boolean
          description: Menandakan varian aktif.
          example: true
    ProductDetailResponse:
      type: object
      required:
        - id
        - name
        - slug
        - description
        - status
        - halal_ai_status
        - category
        - vendor
        - rating_average
        - rating_count
        - images
        - variants
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          description: ID produk.
          example: 0f7f4fd6-f55f-4f38-8d3b-7acef44ef8f2
        name:
          type: string
          description: Nama produk.
          example: Sajadah Premium
        slug:
          type: string
          description: Slug produk.
          example: sajadah-premium
        description:
          type: string
          description: Deskripsi produk.
          example: Sajadah premium bahan lembut untuk ibadah harian.
        status:
          type: string
          description: Status produk.
          example: published
        halal_ai_status:
          type: string
          description: Status review Halal AI.
          example: pending
        category:
          $ref: '#/components/schemas/ProductDetailCategory'
        vendor:
          $ref: '#/components/schemas/ProductDetailVendor'
        rating_average:
          type: number
          format: double
          description: Rata-rata rating produk.
          example: 4.7
        rating_count:
          type: integer
          format: int64
          description: Jumlah total review produk.
          example: 120
        images:
          type: array
          description: Daftar gambar produk.
          items:
            $ref: '#/components/schemas/ProductDetailImageItem'
        variants:
          type: array
          description: Daftar varian aktif produk.
          items:
            $ref: '#/components/schemas/ProductDetailVariantItem'
        created_at:
          type: string
          format: date-time
          description: Waktu pembuatan produk.
          example: "2026-03-01T10:00:00Z"
        updated_at:
          type: string
          format: date-time
          description: Waktu terakhir update produk.
          example: "2026-03-04T10:00:00Z"
    ProductReviewListItem:
      type: object
      required:
        - review_id
        - user_id
        - reviewer_name
        - rating
        - review_text
        - image_urls
        - created_at
      properties:
        review_id:
          type: string
          format: uuid
          description: ID review.
