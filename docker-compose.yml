services:
  postgres:
    image: postgres:17-alpine
    container_name: haji-umroh-postgres
    ports:
      - "5432:5432"
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  migrate:
    image: migrate/migrate:v4.18.3
    container_name: haji-umroh-migrate
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./migrations:/migrations:ro
    command:
      [
        "-path", "/migrations",
        "-database", "postgres://${DB_USER}:${DB_PASSWORD}@postgres:${DB_PORT}/${DB_NAME}?sslmode=${DB_SSLMODE}",
        "up"
      ]
    restart: "no"

  minio:
    image: minio/minio:latest
    container_name: haji-umroh-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: haji-umroh-minio-init
    env_file:
      - .env
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${STORAGE_S3_BUCKET} &&
      mc anonymous set download local/$${STORAGE_S3_BUCKET}
      "
    restart: "no"

  api:
  image: ghcr.io/rizkyalamsyahb/railway:latest
  container_name: haji-umroh-api
  env_file:
    - .env
  ports:
    - "8080:8080"
  environment:
    DB_HOST: postgres
  depends_on:
    postgres:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
    minio-init:
      condition: service_completed_successfully
  restart: unless-stopped
  
  caddy:
    image: caddy:2
    container_name: haji-umroh-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres-data:
    name: haji-umroh-store-be_postgres-data
  caddy_data:
    name: haji-umroh-store-be_caddy_data
  caddy_config:
    name: haji-umroh-store-be_caddy_config
  minio-data:
    name: haji-umroh-store-be_minio-data
