services:
  traefik:
    image: traefik:v3.1
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.postgres.address=:5432
      - --api.dashboard=true
    ports:
      - "80:80"
      - "443:443"
      - "5432:5432"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: haji_umroh_store
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - traefik.enable=true
      - traefik.tcp.routers.postgres.rule=Host(`${TRAEFIK_POSTGRES_DOMAIN}`)
      - traefik.tcp.routers.postgres.entrypoints=postgres
      - traefik.tcp.routers.postgres.service=postgres-svc
      - traefik.tcp.services.postgres-svc.loadbalancer.server.port=5432

  migrate:
    image: migrate/migrate:v4.18.3
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations
    command:
      [
        "-path", "/migrations",
        "-database", "postgres://postgres:postgres@postgres:5432/haji_umroh_store?sslmode=disable",
        "up"
      ]
    restart: on-failure

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DB_HOST: postgres
    depends_on:
      traefik:
        condition: service_started
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.api-http.rule=Host(`${TRAEFIK_API_DOMAIN}`)
      - traefik.http.routers.api-http.entrypoints=web
      - traefik.http.routers.api-http.service=api-svc
      - traefik.http.services.api-svc.loadbalancer.server.port=8080

volumes:
  postgres-data:
